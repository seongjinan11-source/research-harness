    evidence: "관측 mask/context만으로 O∩C=∅ 및 O≠∅를 선택. Graph/context/query/truth가 짝에서 같음을 assert했고 query 정답은 재채점에만 사용했다. 새 모델 forward 없이 저장한 reference·evaluation 결과를 읽었으며 paired graph bootstrap5000회. 원래 gate·관찰·ID는 변경하지 않는다."
