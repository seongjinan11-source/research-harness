- id: FMARG-L02
  kind: lesson
  claim: 노드 간 covariance의 진단은 per-cell variance와 일반 ensemble 효과를 통제한다.
  observation: Joint와 diagonal에 같은 rho draws·조건부 평균·대각 분산·standard normal draws를 주고 rho 내 off-diagonal covariance만
    바꿨다. 두 arm 모두 rho는 graph 공유다. 관측값 clamp·conditional moment node permutation·12000-draw covariance sanity를 확인했다.
    이것이 새 정보나 method superiority를 입증하지는 않는다.
