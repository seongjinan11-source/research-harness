- id: FMARG-P03
  kind: preserved
  claim: Clustered missing에서는 rho 내 node covariance 보존이 diagonal sampling보다 작은 추가 NLL 이득을 보였다.
  observation: 'Joint−Diagonal NLL: Clustered-0.00391 CI[-0.00697,-0.00087], Uniform-0.00007 CI[-0.00394,+0.00354],
    k1+0.00369 CI[-0.00590,+0.01254]。'
