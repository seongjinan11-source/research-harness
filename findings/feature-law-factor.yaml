- id: FLAW-L01
  kind: lesson
  claim: 점별 cell 함수의 표현력 제약 제거와, 새 graph에서 feature law를 추론해 분류를 개선하는 것은 다른 검증이다.
  observation: 분산 차이의 참 half log-likelihood ratio는 x²의 함수라 큰 양수와 큰 음수가 같은 evidence를 준다. Original x*positiveNN은 이를 그대로 표현할 수 없지만 새 static/adaptive 함수는 짝수 evidence도 허용한다. 그 구조
    변경 이후에도 primary adaptive−static과 adaptive−original accuracy 우위는 확인되지 않았다.
  interpretation: 새 함수가 필요한 예시를 구성한 것만으로 그 함수를 유한 예산에서 학습해 효과적으로 활용한다는 결론은 나오지 않는다. 학습 law3종은 모두 알려진 상태이며 heldout은 parameter tuple 조합뿐이다. Exact fixed-law와 학습 factor의 차이에는 law
    uncertainty 처리와 정확한 latent 합산/BP 근사 차이도 포함된다. Same-BP 고정 대조도 함께 보고하며 어느 하나만 단일 실패 원인으로 확정하지 않는다. Normalized known-family reference KL과 실제 sampled-label accuracy를 분리한다.
