  verdict: 사용자가 정한 primary accuracy 기준을 충족하지 못했으므로, 현재 cell 함수 교체만으로 독립 메인 메소드가 된다는 가설은 닫는다. 추가 head/loss/temperature/updates로 이 bank에서 구제하지 않는다.
  failure_reason: 부호 제약 제거와 관측 column 통계 conditioning만으로 이 예산에서 분류 이득을 확인하지 못했다. 관측 정보량·통계 요약·함수족·비선형 최적화·finite BP/Bethe·학습량의 기여를 분리하지 않아 고유 원인은 미상이다. CI에0을 포함한 것을 효과0 또는
    동등성의 증명으로 쓰지 않는다.
  reason_status: unknown
  excluded_explanations:
  - 세 Factor와 두 fixed-law controls는 사전 선택한 동일 CE seed11 graph encoder/factor를 고정한다. Static1547/adaptive1575 trainable params, 동일 초기 predictive scores, 동일 seed별2048 tasks와256
    successful updates다. Frozen graph 재학습 효과가 아니다.
  - 새15개 모델을 CE만으로 학습했다. Public Mask/PCFI는 새 prior로 실제 학습한 별도 adapter architecture다. Law·actual parameter·orientation·query truth를 predictor 입력에 넣지 않았다.
  - Dev12 graphs의 수치·finite-gradient smoke weights3개를 폐기하고 설계를 잠근 뒤 final192 graphs를 생성했다. 최종 bank 생성 후 optimizer 전 발생한 keyword-only API 오류만 수정해 같은 bank와 초기화로 재시작했고 원 lock/로그를
    보존했다. 분석 entrypoint는 같은 이름의 역사적 모듈과 import 충돌을 분리했다.
  - 전체 source/config/bank/reference/checkpoint hashes, freeze/schedule, 모든 mask와45개 prediction replay를 확인했다. 작은 tree의 normalized law/orientation 완전 열거와 fixed BP, hidden-value
    poison, class/relation/column permutation 검사도 통과했다.
  closed_scope: 12-node binary native graph/2relations/2features, context총1/2/4개와 observed nodes3/6개 완전 분리, Gaussian mean/Student-t3 mean/variance law를 학습에 모두 넣고 diagonal train/off-diagonal
    heldout parameter tuples를 비교한 frozen-graph cell-only256-update CE pilot.
  not_closed: 기존 disjoint feature/label 연결 연산·signed likelihood·자기 role-update와 이전 Factor/teacher의 국소 개선은 보존한다. 모든 학습된 feature factor, unseen feature laws, 가변 feature/schema,
    더 큰 실제 graph,99.5% missing의 효과를 기각한 결과는 아니다. 이번에도 law 이름은 이미 보았다.
  reopen_when: 관측 통계로 pointwise rho만 조절하는 것과 다른, 현재 함수족이 놓치는 feature–relation 의존성을 학습·전이하는 구체적인 연산이 등장하고 강한 명시적 법칙 주변화보다 유리할 근거가 생길 때.
  comparison_floor: Original sign-constrained Factor, parameter-matched Flexible-static/adaptive, 동일 frozen graph의 full normalized law/parameter/orientation fixed-exact 및 same24-step
    fixed-BP, 실제 새 prior로 학습한 Mask/PCFI public PFN. Accuracy/NLL/Brier/reference KL과 end-to-end cost를 분리한다.
  recheck: 이 final bank를 추가 tuning에 쓰지 않는다. 새 연산의 구체적인 차이를 먼저 고정하고 독립 base graphs에서 자기 피처 없는 query accuracy를 primary로 비교하며 Gaussian 보존과 고정 추론 품질–비용을 함께 확인한다.
