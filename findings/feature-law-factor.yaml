- id: FLAW-P01
  kind: preserved
  claim: 세 feature law를 포함한 새 bank에서도 adaptive Factor는 같은 prior로 실제 학습한 공개 Mask/PCFI PFN보다 자기 피처 없는 query accuracy가 높았다.
  observation: Adaptive−Mask accuracy%p +10.979112 CI[+7.342324,+14.631011], NLL -0.042970 CI[-0.081804,-0.001247]. Adaptive−PCFI accuracy%p +11.497740 CI[+7.718815,+15.256125],
    NLL -0.043131 CI[-0.082211,-0.001461].
  do_not_claim: 두 공개 PFN 비교는 보조·multiplicity 미보정이다. Adaptive는 primary에서 static과 original을 이기지 못했으므로 adaptive cell의 독립적인 기여나 논문 메소드 성공이 아니다. 공개 PFN과 Factor는 architecture/사전학습/graph
    factor 경로가 달라 정확한 이득 원인을 분리하지 않았다. 이번에는 feature 제거 개입을 하지 않았으므로 이 차이만으로 variance feature를 활용했다고 단정하지 않는다. 고정 law 주변화보다 정확도가 낮은 것이라고 주장하지도 않는다. Adaptive−fixed exact accuracy
    CI도0을 포함한다.
