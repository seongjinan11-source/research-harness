- id: ADTR-L02
  kind: lesson
  claim: Gaussian 대조의 관측된 승리와 graph-GP 선행 원리·PFN 메소드의 기여를 구분한다.
  observation: SSGP는 graph regularizer/probit/EP/evidence 선택, GGP는 P K(X,X) P^T/robust-max/variational ELBO를 사용한다. 현재 구현은 관측행 singular score와24 sign/amplitude 가설의 고정 Gaussian/probit
    추론이며 두 논문의 재현이 아니다. 참 label-law LP57.135862%와 Gaussian56.154827%의 accuracy차이는 -0.981035 [95% CI -3.304919, +1.346377]%p였다.
  interpretation: 현재 family의 성능을 보존하되, Gaussian 조건화나 graph covariance 자체를 새 기여로 주장하지 않는다. Target fitting을 수행하는 선행 GP와0-update frozen 비교의 차이를 남긴다. 현재 모델이 신경망이 아니라는 이유로 배제하지
    않으며, 메인 메소드 확정은 아직 보류다. 임의 missing/다중class/미지schema 일반화와 SSGP/GGP 직접 재현은 미실행이다. 자동 revisit는 해결·학습 재개를 뜻하지 않는다.
