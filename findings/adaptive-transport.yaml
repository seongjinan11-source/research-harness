- id: ADTR-L01
  kind: lesson
  claim: 법칙 식별 가능성, 입력 후보의 가중치, 조건부 예측 연산과 비용을 구분한다.
  observation: 0/1source q(g)는수치오차내0.5다. 8source/k4 feature-only g accuracy60.15625%,joint59.375%; label-only t60.9375%,joint64.0625%. Primary joint PCFI52.555985%,50:50 52.354767%,feature-only52.461961%,direct
    Gaussian56.154827%. Gaussian은 동일-query feature-removal accuracy이득을 보였지만 adaptive PFN은 확인하지 못했다.
  interpretation: 숨겨진 orientation 대칭으로 정보가 없는 g는 router로 복원할 수 없다. Law weight 진단과 classification을 혼동하지 않는다. 같은 q를 입력 선택에 쓰는 것과 일관된 conditional decoder에 쓰는 것은 다르며 고유 원인은 미상이다.
    두 PFN forward·적분 비용을 포함한다. Secondary latent0.5 ties는 결과 열람 전 선언한1e-8 범위에서 기대0.5로 집계하고 원 raw/statistics를 보존한다. Query cohort 고정·기존 기록 보존을 유지한다.
