- id: IPCFIC-L01
  kind: lesson
  claim: Context router 실패, 내부 고정의 개발 신호, 새 graph 확인, 새 training-seed 일반화를 구분한다.
  observation: '원64graph bank에서 fixed−external accuracy +0.65743%p CI[-0.11984,+1.37358]였고 세 seed·네 primary cell의 점추정은 모두 양수였다. 그 후보를 선택한 뒤 새128graph bank의 정확도 기준을 잠갔다. 새 결과:
    external:accuracy 49.821540%/NLL 0.856885/Brier 0.552034; internal_fixed:accuracy 50.041098%/NLL 0.856498/Brier 0.552432; fixed-external accuracy%p +0.219558, 95% CI [-0.331926,
    +0.796665], NLL -0.000388, 95% CI [-0.003777, +0.002808], Brier +0.000398, 95% CI [-0.001679, +0.002518].'
  interpretation: 같은 bank의 여러 양의 점추정은 독립 재현을 대신하지 않는다. 반대로 원 context-router No-Go만으로 fixed 내부화를 이미 실패했다고 부를 수도 없다. 이번 결과는 기존6 checkpoints의 새 graph 검증이며 새 학습 seed 집단의 신뢰구간이
    아니다. 원·새 bank의 절대 정확도를 빼거나 합친 결과를 독립 confirmation으로 부르지 않는다.
