  evidence: 동일 official graph/SCM family, 새128 base graphs×7settings×6 reused checkpoints=5376 predictions. 새 training updates0. Graph 단위 paired bootstrap5000회; 고정 training
    seed3개 평균. 원64graph bank와 합치지 않음.
  verdict: 새 bank에서 고정 내부 PCFI의 정확도 우위를 사전 기준대로 확인하지 못했다. FP/FISF 내부화 후속 학습은 시작하지 않는다. 이 결과가 모든 내부 PCFI 방식의 무효나 동등성을 의미하지는 않는다.
  failure_reason: 사전에 고정한 새 bank accuracy 확인 기준을 통과하지 못했다. 고유 원인은 분리하지 않아 미상이며, CI가0을 포함한 경우 효과 없음/동등성을 증명한 것으로 쓰지 않는다.
  reason_status: unknown
  excluded_explanations:
  - 새 학습·checkpoint 선택·온도 tuning 없이 기존6개 checkpoint를 그대로 평가했다. 원 입력/연산/loader 및 저장 예측 replay와 hash를 확인했다.
  - 원 graph와 requested/actual seed 및 raw graph fingerprint가 겹치지 않는다. Zero-source mask를 제외하거나 성공할 때까지 재추출하지 않았다.
  closed_scope: 같은 official graph/SCM family와 training seeds11/12/13에서, 현재100-step literal PCFI의 fixed25-step interleaving을 원 checkpoint 그대로 사용한 독립128graph accuracy confirmation
    및 이를 근거로 한 FP/FISF 자동 확장.
  not_closed: IPCFI-F01은 context router의 원 판정으로 유지한다. 개발 bank의 fixed 양의 점추정은 삭제하지 않는다. 모든 내부화, native missing interface, 다른 학습/관측 연산, 실제 graph 또는 unseen schema 일반을 기각하지 않는다.
  reopen_when: 같은 배치를 반복하거나 bank를 tuning하는 대신, 현재 checkpoint/입력/연산의 한계를 바꾸는 구체적인 근거가 생기고 강한 외부 PCFI 대조와 새 training seeds 및 독립 graph 검증을 사전 설계할 수 있을 때.
  comparison_floor: 동일 public PFN 초기화/학습 budget의 외부 actual PCFI, 내부 fixed, context/strict label-blind 개발 대조. Primary missing-query accuracy와 NLL/Brier/full guard 및 CPU→CPU
    비용을 분리한다.
  recheck: 현재 두 bank를 재선택에 쓰지 않고, 변경할 원리·single primary와 충분한 training-seed/graph 단위를 먼저 잠근다. 원 CI0을 equivalence로 쓰지 않는다.
