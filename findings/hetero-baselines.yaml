- id: HET-F01
  kind: failure
  claim: Adapted HetGFD가 cross-type path 입력보다 큰 증분을 준다.
  observation: 'DBLP k=5 full: cross-type 89.96%, adapted HetGFD 89.92%; drop_A 90.18/90.19%. k=20 full은 둘 다93.55%.'
  verdict: 새 메소드 headroom 부족
  failure_reason: 관계 경로와 남은 native source가 이미 강한 신호를 전달했다. 격차가 작다는 관찰은 확인했지만 redundancy만이 원인이라는 인과 분해는 하지 않았다.
  reason_status: supported
  excluded_explanations: []
