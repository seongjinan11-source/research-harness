    kind: untested
    claim: '학습된 stochastic 계산 정책의 기대 예측과 greedy 배포 사이 차이를 같은 유한 경로의 확률 가중 평균으로 분리할 수 있는가.'
    observation: '현재 주 비교는 PG/Direct의 greedy, Uniform의 균등8경로 평균 및 dev-selected 고정 경로다. 학습된 PG 확률을 사용한 전체 경로 가중 예측은 실행하지 않았다. 이는 calibrated Bayesian posterior가 아닌 계산 정책의 분포다. 같은8회 추론 비용의 강한 대조와 새 bank가 필요한 후속 질문이며, 현재 후보의 확대 중단 판정을 바꾸거나 성공·실패로 세지 않는다.'
