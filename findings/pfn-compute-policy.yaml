project: FP05 missing-feature GraphPFN computation policy
date: '2026-11-05'
source: findings/sources/fp05-compute-policy-2026-11-05/DECISION_KO.md
setting: '공개 GraphPFN1.3의 adapter 3,564,288 parameters를 CE로 fine-tuning하고 513-parameter 내부 연산 정책을 비교했다. LimiX/입출력 encoder는 고정이다. 같은 PCFI100 입력과 3-bit/8경로에서 Fixed, Uniform, Direct, Group-PG 각3seed/128updates, 총12fits/1,536updates다. 새 합성96graphs/95·99.5% whole-node missing, 재사용 Cora/CiteSeer/PubMed 개발 패널을 평가했다. 실제 graph weight update는0회다.'
related: [GraphPFN, PolicyGNN, RMS, MA-PFN]
entries:
  - id: FP05-F01
    kind: failure
    claim: '불완전 피처 입력에서 내부 세 지점의 adapter 추가 실행을 Group-PG로 학습하면 일반 fine-tuning과 기대 목적 직접 최적화보다 높은 missing-query accuracy와 관측 피처 효용을 얻는다.'
    observation: 'Primary96graphs에서 Fixed49.290%, Uniform8평균49.475%, Direct48.776%, PG48.793%다. PG−Fixed−0.497%p nominal97.5% CI[-1.034,+0.012], PG−Direct+0.017[-0.241,+0.275]다. Disjoint48graphs/58cases의 PG observed−none−1.063[-5.567,+4.069], observed−shuffle−0.260[-2.127,+1.584]로 네 효능 gate 모두FAIL이다. Full-natural guard만PASS다. 30,828개 평가 예측의 주 감사와 두 독립 감사는PASS다.'
    verdict: '현재 반복 adapter action·학습 목적·128updates·greedy 배포의 확대를 중단한다. 이 후보를 missing 대응의 새 메인 메소드로 승격하지 않는다.'
    failure_reason: '배포된 두 정책 모두 모든 최종 합성·실제 episode에서000을 골랐고 같은 checkpoint의000 replay와 확률 배열이 동일했다. 적응적인 경로 선택 효과가 없다는 것은 확인됐지만, 연산 후보·상태·목적·최적화·greedy 추론 중 최종 원인은 분리하지 못했다.'
    reason_status: unknown
    excluded_explanations:
      - '실제 public pretrained adapter를 학습했고 LimiX는 고정했다. 작은 scratch Factor만 학습한 결과가 아니다.'
      - '초기000 parity/gradient 경계/tree probability/RNG·leakage 검사, checkpoint 내부/일정/배포/독립 지표·bootstrap 감사를 통과했다. 원인으로 확정할 구현 오류는 발견하지 못했다.'
      - 'Primary96graphs/192cases와 utility48graphs/58cases가 남았으며 source0/1이나 입력 불변 shuffle을 성능에 따라 제거하지 않았다.'
    closed_scope: 'Layer2/5/8의 동일 residual conv+MLP 추가 실행 세 bit, PCFI100 front end, 현재 상태 요약·목적·예산·greedy 배포를 우수한 missing-feature 계산 정책으로 확대하는 주장.'
    not_closed: 'RL 전체, 다른 유효한 추론 연산, 본체 Transformer의 policy-gradient, target-time 학습 또는 heterogeneous schema transfer는 검증하지 않았다. 작은 일반 fine-tuning 점 이득과 실제 피처 활용 반응은 보존한다.'
    reopen_when: '유익한 대안 계산과 그것을 배포에서 실제 사용하는 학습 원리를 제시하고, 기존의 모든000 현상 및 강한 고정·직접 최적화 대조를 다룰 독립 검증을 설계할 수 있을 때.'
    comparison_floor: '동일 public 초기값/PCFI/일정의 Fixed, Uniform8 및 dev-selected single-global, 동일8경로 Direct, own000 replay, frozen PCFI/NaN, LP/prior와 none/shuffle를 유지한다. 실제 추론 수와 calibration 비용을 맞춰 보고한다.'
    recheck: '새 cycle/plan/세 관점 검토/수치 검사 뒤 새 bank를 잠근다. 현재 final은 개발 자료로 취급하고 비용항·temperature·loss·학습량을 같은 bank에서 조정해 통과시키지 않는다. Primary missing-query accuracy와 utility·full guard를 먼저 고정한다.'
