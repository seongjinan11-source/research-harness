  - id: FP05-L01
    kind: lesson
    claim: '학습의 stochastic policy, greedy 배포 결정, adapter 학습 효과, 실제 관측 정보 효용을 각각 감사해야 한다.'
    observation: 'Direct와 PG의 배포는 모든 final/real episode에서000이고 replay 차이는0이다. 학습에서 여러 trace는 계속 sample되므로 이를 확률분포 collapse로 바꿔 부를 수 없다. PG dev CE 최선은3seed모두110이며0.01cost를 더한 개발 최선도 모두000은 아니므로 cost 하나로 원인을 확정하지 못한다. Direct도 같은 배포를 보여 PG sampling variance만으로 설명할 근거가 없다.'
    interpretation: '정확한 expected policy 목적과 group normalization은 같은 추정량이 아니며, hidden state detach 하의 adapter 조건부 gradient도 전체 coupled gradient와 다르다. 감사PASS는 효능PASS가 아니다. Train/dev/real 준비의 이전 utility bytes는 미보존이므로 최종 lock과 같다고 소급 주장하지 않는다. 다른 dependency와 실제 저장 입력을 감사하고 한계를 별도 남겼다.'
