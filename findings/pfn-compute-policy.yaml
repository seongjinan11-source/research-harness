  - id: FP05-P01
    kind: preserved
    claim: '공개 PFN의 실제 adapter 학습과 내부 discrete 계산 경로를 구현했으며, 실제 graph에서는 남은 관측값을 활용하는 반응이 남아 있다.'
    observation: 'Fixed49.290%와 Uniform49.475%의 primary 점 추정은 frozen PCFI48.788%보다 높지만 추가 유의성 주장은 하지 않는다. Real95에서 PG observed−none은 Cora/CiteSeer/PubMed+21.134/+11.180/+24.768%p, observed−shuffle는+3.185/+1.385/+2.071%p다. Frozen PCFI와 Fixed에도 관측 정보 활용 반응이 있다. PG 자체는 같은 입력의 frozen PCFI와 LP보다 real95/99/99.5 accuracy가 모두 낮다.'
    do_not_claim: 'Point gain이나 관측 피처 반응은 RL 고유 효과가 아니다. PG의 main과000 replay는 확률까지 같으며, 단순 fine-tuning·공통 PCFI 경로와 구분해야 한다. Uniform은 inference8회다. Real은 k4/class, RP16 입력, 재사용3graphs이고3seed×3rep를 독립9graphs로 세지 않는다. Native k20 기준선과 비교하거나 새 schema·backbone RL·관측 likelihood 복원 성과로 부르지 않는다.'
