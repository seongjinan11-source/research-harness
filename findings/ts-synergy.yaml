    자동 확대.
  not_closed: 제안2x2 predictive+conditional-null 학습은 미실행이다. 모든 TSFM,t0,다른 synergy family,실제 시계열·새 메소드 학습을 실패로 세지 않는다. GraphPFN 결과와 별개다.
