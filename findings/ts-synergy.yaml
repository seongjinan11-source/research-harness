  verdict: 다음 synergy 후보에서 실제로 이겨야 하는 강한 sparse-interaction 기준선으로 보존한다. 유용한 쌍을 알려준 oracle을 실용 기준선으로 사용하지 않았다.
  do_not_claim: Task별 과거 fitting을 사용한 회귀이므로 zero-shot TSFM 학습 성과가 아니다.10변수/4lag의 희소 product에서의 결과이며 임의 상호작용·real forecasting·일반속도 우위는 아니다. Gaprecovery는기술통계다.
