    evidence: Context node에 physical feature가 없고 query 정답을 개입에 사용하지 않았다. 같은 checkpoint/context/query에서 입력만 바꾼 graph48개 paired bootstrap이다.
  - id: G6T-L01
    kind: lesson
    claim: 생성 prior 재사용과 exact predictive teacher 사용은 다른 변경이며, 이번 효과는 후자에 한정한다.
    observation: 기존 master 생성기가 이미 Grid6와 같은 six-support density/signal·joint role·Gaussian orientation prior로 graph와 feature를 생성했다. 이번에는 생성기·train bank를 유지하고 단일 sampled query label 대신 관측에 조건부인 exact Grid6 query marginal을 감독으로 사용했다.
    interpretation: Matched family에서 expected sampled-label CE는 teacher entropy와 predictive KL의 합이므로, 이번 변경은 기대 목표를 새로 발명한 것이 아니라 조건부 label-draw 잡음을 제거한 조밀한 감독이다. Teacher는 actual test parameter를 받지 않지만 family/prior/feature law를 명시적으로 안다. Query marginals를 가르쳤으며 joint query-label 분포를 독립 샘플로 대체하지 않았다. OOD Grid6 KL은 참 OOD Bayes KL이 아니고 full latent enumeration의 확장성은 미입증이다. Distillation 자체의 novelty나 새 synthetic generator를 주장하지 않는다.
    tags: [pretraining-data, model-based-baseline, uncertainty, eval-protocol]
    keywords: [generator versus teacher, exact predictive marginal, Rao Blackwellized supervision, known family, query marginal, teacher knowledge]
    source_refs:
      - findings/sources/grid6-teacher-2026-11-02/METHOD.md
      - findings/sources/grid6-teacher-2026-11-02/protocol.json
      - findings/sources/grid6-teacher-2026-11-02/results/preflight.json
    evidence: 실제 생성·teacher·query loss 경로와 gradient 동등성 검사. Earlier feature-free JR loss 연구와 이번 연속feature/disjoint/parameter-integrated teacher 비교를 구분했다.
  - id: G6T-L02
    kind: lesson
    claim: Factor가 확보한 evidence 연결 연산과 그 연산을 학습하는 독립적인 필요성을 분리한다.
    observation: Context label→graph factor→관측feature node→shared feature-column latent→다른 node class의 경로가 실제 구현됐다. 새 bank의 feature 제거 하락은 CE Factor에도 있었다. Distillation의 추가 확인 효과는 teacher predictive KL 감소이며 실제 분류·분포 전이의 일반적 우위는 미확인이다.
    interpretation: 다음 후보는 분리된 피처·라벨 연결, signed evidence, 자기 role-update를 새 기능으로 다시 제안하지 않는다. 현재 학생도 neural potential과 관측값 계수를 학습하므로 이를 전부 고정 Gaussian factor라고 부르지 않는다. 고정된 주요 함수족 가정은 binary class/column orientation과 pairwise Ising형 observed-cell factor다. 새로운 후보는 이 함수족으로 부족한 조건부 feature–relation 의존성을 구체적으로 명시하고, 학습으로 그 의존성을 회수해 새 task에서 활용하는 연산과 강한 통계 대조를 설명해야 한다. 다른 family에서 신경망이 유리할 것이라는 가능성을 이미 확인한 장점으로 쓰지 않는다.
    tags: [amortized-inference, model-based-baseline, observation-mask, eval-protocol]
    keywords: [working factor inference, learned potential necessity, feature relation dependency, binary feature orientation, same potential role update, research positioning]
    source_refs:
      - findings/sources/factor-position-2026-11-02/user_review.md
      - findings/sources/disjoint-factor-2026-11-02/METHOD.md
      - findings/sources/grid6-teacher-2026-11-02/REVIEW_KO.md
    evidence: 사용자 연구 판정을 원문으로 보존하고 기존 구현·보고서와 대조한 해석이다. 새로운 학습·평가나 성능 수치를 추가한 결과가 아니다. 기존129개 항목의 관찰과 판정은 유지한다.
