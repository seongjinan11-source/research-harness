  - id: G6T-P02
    kind: preserved
    claim: 새 disjoint bank의 사전 보조 개입에서 기존 CE와 distilled Factor 모두 실제 관측feature 활용 효과를 보였다.
    observation: "Matched disjoint context2/observed6에서 distilled Factor의 feature 제거 accuracy−11.9213%p CI[−19.0972,−4.8611], shuffle−20.7176%p CI[−28.3594,−12.7315], graph permutation−29.0509%p CI[−39.5833,−17.9398]. 기존 CE Factor도 같은 bank에서 제거−12.0370%p CI[−19.6759,−4.2824]."
    do_not_claim: Feature 활용 자체가 distillation으로 새로 생겼다는 뜻이 아니다. CE 모델에서도 나타났다. 보조 개입은 primary Mask 성공을 대체하지 않는다. 제거에 대한 NLL/Brier 차이 CI는0을 포함한다. 이전 bank DFACT의 feature-removal 미통과 결과를 삭제하지 않으며 모든결측률·실제 graph로 확대하지 않는다.
