      - findings/sources/grid6-teacher-2026-11-02/results/final_integrity.json
    evidence: 새6개 모델1536 successful updates/12288 exposures, 기존9개 재평가. Fresh96 graphs 중48 matched primary, graph 내 fixed3 training seeds·조건 평균 후 paired bootstrap5000회. Teacher2048개 offline 준비15.313s. Inference 비용은 worker 종료 후 같은RTX3090의30회 median이며 외부GPU 부하는 통제하지 않았다.
    revisit_status: open
  - id: G6T-P01
    kind: preserved
    claim: Factor PFN에서는 exact Grid6 predictive distillation이 같은 CE 학생보다 teacher 분포에 대한 KL을 낮췄다.
    observation: "동일 새 bank, Factor CE accuracy69.8468%/NLL0.575272/KL0.067257, distill69.5877%/0.568642/0.049731. Teacher KL 차이−0.017526 CI[−0.026031,−0.010538], 약26.1% 감소. Fixed-mode factor BP 대비 teacher KL−0.057650 CI[−0.089157,−0.031682]. CE 대비 accuracy−0.2590%p CI[−1.2112,+0.7551], NLL−0.006630 CI[−0.023930,+0.007280]."
    do_not_claim: Factor는 사전 secondary라 공개 Mask primary 실패를 대체하지 않는다. Accuracy·실제 sampled-label NLL의 확실한 개선이나 calibration 개선으로 확대하지 않는다. Query 자신도 feature가 없는 사전 secondary에서는 CE64.7164%→distill63.5556%, accuracy−1.1609%p CI[−2.4190,−0.0482]로 오히려 하락했다. 이 보조 비교는 multiplicity 미보정이며 NLL 차이+0.004205 CI[−0.002231,+0.010960]는0을 포함한다. Grid6-BP 대비 전체 accuracy+1.2594%p CI[−0.9537,+3.5799], NLL+0.016771 CI[−0.016408,+0.053202]는 우위나 동등성의 증명이 아니다. Factor median8.764ms vs Grid6-BP12.425ms의 약1.42배와 teacher KL0.049731은 사전 .01/2배 경쟁 기준에 못 미친다. 실제 graph·unseen schema 전이나 novelty를 주장하지 않는다.
    tags: [amortized-inference, uncertainty, model-based-baseline, eval-protocol]
    keywords: [Factor PFN distillation, predictive KL, exact teacher, same architecture, conditional supervision, secondary improvement]
