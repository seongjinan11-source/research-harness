project: Exact Grid6 teacher for disjoint-feature PFN
date: '2026-11-02'
source: findings/sources/grid6-teacher-2026-11-02/REVIEW_KO.md
setting: 기존2048 train tasks/초기화/task order/256 updates를 유지해 Mask·Factor 각3 seeds를 exact predictive KL로 새 학습. 기존 CE9개를 fresh96 graph bank에서 재평가. Primary는 matched disjoint48 graphs의 공개 Mask teacher KL이며 Factor는 secondary다.
related: [GraphPFN, CSBMInference]
entries:
  - id: G6T-F01
    kind: failure
    claim: 기존 생성 prior의 exact Grid6 predictive를 가르치면 현재 공개 Mask GraphPFN이 teacher 추론을 더 잘 압축한다.
    observation: "Mask CE accuracy55.3475%/NLL0.678973/Grid6 KL0.104788, distill54.6255%/0.679253/0.104134. Distill−CE primary KL−0.000654 CI[−0.002034,+0.000583], accuracy−0.7220%p CI[−3.9174,+2.5422], NLL+0.000280 CI[−0.002496,+0.002959]. Primary teacher-effect gate=False. Mask forward median59.735ms vs Grid6-BP12.425ms, matched KL>.01로 competitive compression gate=False."
    verdict: 현재 공개 Mask 구성에 exact teacher 감독만 교체하는 갈래의 메인 방법 확대는 보류한다. Factor secondary의 별도 성과는 보존한다.
    failure_reason: 조밀한 exact 감독만으로 현재 학생의 predictive gap을 줄이는 확실한 이득을 확인하지 못했다. Input 경로·표현력·최적화·frozen backbone·학습량의 기여를 분리하지 않아 고유 원인은 미상이다.
    reason_status: unknown
    excluded_explanations:
      - 모든 새 학생은 원래 CE와 initial/frozen weights·task schedule·optimizer·학습률·trainable parameter 수·2048 exposures/256 successful updates가 일치한다. 기존 학습 checkpoint를 추가 학습한 비교가 아니다.
      - Teacher는 graph/관측feature/mask/context/family만 사용한다. 실제 query/helper label이나 실제 density/signal/role/feature orientation을 입력받지 않는다. Exact teacher의 normalization·class flip·hidden-value poison과 query-only KL/CE gradient 검사를 통과했다.
      - Source/bank/teacher/reference hashes, checkpoint 유한성, 저장예측 전체 재채점과45개 예측 재실행을 확인했다. CI에0을 포함한다는 사실을 효과0의 증명으로 해석하지 않는다.
    closed_scope: 12-node binary/2-relation/2-Gaussian-feature,50·75% node missing, 원래 frozen-backbone/adapters와256-update 예산에서, sampled-label CE만 exact unknown-parameter Grid6 predictive KL로 교체한 공개 Mask 학생의 확장.
    not_closed: G6T-P01/P02의 Factor 효과와 이전 disjoint-factor 정확도 개선은 보존한다. Distillation 전체, fully trained 다른 구조, 다른 feature law·real graph·unseen schema·99.5% missing·큰 graph의 teacher 학습은 기각하지 않는다. 기존 feature-free JR distillation과 다른 이번 범위를 구분한다.
    reopen_when: 학생이 teacher의 관계·관측 정보 추론을 표현하고 회수할 수 있도록 바꾸는 구체적 학습 또는 추론 연산이, 강한 기준선 대비 효율적 예측을 제공할 근거가 생길 때.
    comparison_floor: 동일 architecture/initialization/tasks/updates의 sampled CE, 실제 PCFI 입력으로 학습한 PFN, Factor CE/distill, fixed-mode factor BP, exact Grid6/Grid6-BP. Teacher 생성과 학생 학습 비용을 포함해 보고한다.
    recheck: 실패 bank에서 temperature·새 head·loss 혼합·학습량을 조정해 구제하지 않는다. 무엇을 바꾸는지 먼저 고정하고 새 graph/schema에서 primary KL·accuracy·NLL/Brier와 비용을 분리한다. Student architecture 변경과 teacher 변경을 동시에 하지 않는다.
    tags: [amortized-inference, model-based-baseline, pretraining-data, eval-protocol]
    keywords: [Grid6 teacher, exact predictive distillation, soft label, Mask GraphPFN, unknown parameter posterior, same budget, compression]
    reopen_tags: [graph-structure-use, observation-mask, differentiable-reasoning]
    reopen_keywords: [teacher representability, observed source routing, structured student, relational inference compression, feature law transfer]
