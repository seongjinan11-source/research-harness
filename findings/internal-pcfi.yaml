- id: IPCFI-L01
  kind: lesson
  claim: 실제 PCFI 내부화와 이전 MLP refiner, strict router label-blindness와 labels-only 효과를 분리한다.
  observation: 새 구현은 PCFI의 공간 전파와 채널 상관 보정 연산을 유지했고 초기 context/label-blind 예측은 내부 고정과 같았다. 작은 그래프의 SciPy 차이는 최대4.43e-7, 실제 dev FP32 kernel/cache 차이는8.54e-5였다. Label-blind router에
    PFN states와 labels를 오염시켜도 routing은 같았다.
  interpretation: PFN 중간 feature tokens도 이미 context labels를 담을 수 있어 명시적 label input만0으로 두면 label-blind가 아니다. 본 대조는 hidden 경로 전체를 없애므로 PFN feedback+context의 묶음 효과이고 labels-only
    원인분해가 아니다. 고정 PCFI를25step씩 끼우는 것과 앞에서100step을 완료하는 것은 PFN의 비선형 층 때문에 일반적으로 동치가 아니다. Row-stochastic 연산은 상수 신호를 유지하며 zero-source/zero-start에서 새 값을 만들지 못한다. 이를 바로 전체 failure
    원인으로 단정하지 않는다.
