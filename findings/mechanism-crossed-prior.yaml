- id: MCP-F01
  kind: failure
  claim: 동일 주변분포의 feature-style/label-rule crossing이 강한 입력 기준선을 넘어 공식-prior 결측 과제로
    전이된다.
  observation: 'Gate A=False, Gate B=False; controlled:offdiagonal:uniform vs coupled_mask:
    -0.00119 [-0.00603, +0.00402]; controlled:offdiagonal:clustered vs coupled_mask:
    -0.00288 [-0.00817, +0.00207]; controlled:offdiagonal:uniform vs coupled_pcfi:
    +0.00396 [-0.00917, +0.01896]; controlled:offdiagonal:clustered vs coupled_pcfi:
    -0.01740 [-0.03587, -0.00337]; official:any:uniform vs official_mask: -0.00210
    [-0.00970, +0.00530]; official:any:clustered vs official_mask: -0.00369 [-0.00928,
    +0.00194]'
  verdict: 두 gate 동시 통과 실패; 현재 controlled prior를 메인 방법으로 확대하지 않음
  failure_reason: 정해진 초기화·256 성공 updates·함수족에서 요구한 predictive 우위를 확보하지 못했다. Prior의
    한계, 학습량, preprocessing, context 식별 난도 중 원인을 분리한 실험은 아니다.
  reason_status: unknown
  excluded_explanations:
  - 서로 다른 trainable parameter 수나 seed별 update schedule 차이로 대조를 설명할 수 없도록 검사했다.
  closed_scope: 이 finite controlled family와 공개 Mask Plain continuation 설정에서 단순 mechanism
    crossing만으로 범용 missing GraphPFN 성과를 주장하는 것
  not_closed: 다른 그래프 prior·관측 정보가 충분한 task family·실제 graph·동적 learned generator 일반을
    기각하지 않는다. 기존 공식 prior의 induced coupling 자체가 실패 원인이라고 입증하지 않았다.
  reopen_when: 어떤 관측 정보와 예측 rule의 조합이 전이에 필요한지를 구체적으로 바꾸는 generator/inference 원리가
    나오고 동일 비용의 강한 대조를 넘을 근거가 생길 때.
  comparison_floor: 동일 구조·초기화·update의 Official/Coupled Mask, 입력으로 학습한 Coupled PCFI,
    context/uniform prior, LP, 4-view random-fill; 실제 graph에서는 PCFI/FISF-trained PFN·Ephris도
    필요.
  recheck: 새 독립 bank에서 full/node/cell 조건과 actual-feature 제거·셔플을 고정해 검증한다. 같은 bank의
    loss/epochs 튜닝으로 구제하지 않는다. Controlled/official family 변경과 coupling만의 효과를 분리한다.
