  kind: lesson
  claim: Mechanism-crossing의 실제 학습을 기존 finite-bank curriculum과 분리해 기록한다.
  observation: NEXT-U01의 첫 pilot을 실행했다. 12 checkpoints, 3072 successful updates, 12288
    probability files 재채점. Concrete feature/mask/query 및 rule-instance marginals를
    맞췄고 model 구조·초기화·schedule을 유지했다. One graph/update이므로 paired loss는 없다.
