  - id: FP01-L01
    kind: lesson
    claim: 기존 mean family가 일반 투영에 닫히지 않는 사실과 그것을 넓히면 실제 피처 효용이 회복된다는 가설은 다르다.
    observation: "K>=3의 one-preferred/equal-other mean family는 일반RP를 보존하지 않는다. 그러나 projected task 노출만 바꾼 B−A는 primary−0.017%p였다. Full real95%에서 C−none은 Cora−0.024/CiteSeer+0.003/PubMed−0.440/CS0.000/Physics+0.205%p. Cora/CiteSeer의 B 대비95% feature utility 개선은 주로 기존 손상을 줄인 형태이며 안정적 추가 정보 활용은 미입증이다."
    interpretation: 구조 개선으로 이미 얻은 성능·피처 손상 감소·새로운 피처 정보 활용을 구분한다. 일반RP는 평균 형태뿐 아니라 covariance·rank/SNR·clipping도 바꾸므로 이번 비교로 고유 원인을 확정하지 않는다. Public PCFI-PFN보다 높은 accuracy만으로 feature inference 성공을 선언하지 않는다.
