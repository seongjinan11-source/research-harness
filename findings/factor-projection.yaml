    evidence: 3개 독립 계획 리뷰·수치 검사 후 source/statistics lock. 최종48base graph의12개 N×class strata 내5000 paired bootstrap, 고정3training seed의 metric 평균. 2개 co-primary accuracy에 각각97.5%CI를 사용했고 실제 그래프에는 독립 CI를 부여하지 않았다.
