setting: 기존512 합성base tasks의 raw/RP를 대응시켜 A기존Factor·B투영학습·C_global유한centroid·C적응centroid를 각3seed256updates로 비교했다. Graph core와 graph-only role weights는 공통 고정, 실제 그래프 업데이트0이다. Synthetic final은48base graph의 동일family 새seed이고 실제5graph는 재사용development다.
