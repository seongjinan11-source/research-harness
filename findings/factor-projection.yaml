  - id: FP01-P01
    kind: preserved
    claim: 동일 centroid 추론에서 관측 통계 기반 shared encoder는 전역3계수보다 합성 주평가의 accuracy와 확률 점수를 개선했다.
    observation: "C_global52.565%→C53.752%,+1.187%p,97.5%CI[+0.213,+2.446]. NLL0.99801→0.97400. 이는 전체 gate 중 한 비교의 성공이며 C−B +0.952%p CI[−0.585,+2.696] 미통과를 대체하지 않는다."
    do_not_claim: Adaptive encoder의 모든 효과를 부정하지 않지만, B 대비 확실한 우위·안정적 추가 feature utility·unseen schema·독립 real 일반화·정확한 연속 Bayes·Gaussian centroid와 BP 결합의 신규성을 주장하지 않는다. Graph-only role weights는 feature에 고정되어 feature-conditioned joint posterior를 학습한 결과도 아니다.
