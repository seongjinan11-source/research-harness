- id: SIGN-L01
  kind: lesson
  claim: Feature 복원의 부호 제약, label heterophily, frozen PFN 분류, known-law 정보 우위를 구분한다.
  observation: 단일 channel path의+1 source/0 missing start에서 PCFI는 음수를 만들지 못했고 parity 변환은 반대 부호를 만들었다. 최종 factorial은 graph/labels/context/query/mask를 feature law 간 고정했다. Primary
    결과 mask:accuracy52.405028%/NLL0.709999/Brier0.512094; pcfi:accuracy50.190226%/NLL0.715966/Brier0.520255; known_signed:accuracy56.026584%/NLL0.707501/Brier0.506394; positive_lp:accuracy46.683098%/NLL0.796353/Brier0.572964;
    signed_lp:accuracy56.260834%/NLL0.687817/Brier0.492625; uniform:accuracy50.265421%/NLL0.693147/Brier0.500000; known_signed-pcfi accuracy%p +5.836358 [95% CI +2.291311,
    +9.440175]; known_signed-mask accuracy%p +3.621556 [95% CI +0.027501, +7.207857]; known_signed-positive_lp accuracy%p +9.343486 [95% CI +5.338770, +13.482302]; known_signed-signed_lp
    accuracy%p -0.234249 [95% CI -5.629258, +4.934528].
  interpretation: PCFI의 단일-channel counterexample은 뒤 PFN의 분류 불가능성 증명이 아니다. Label/feature heterophily는 독립 축이며 실제 달성된 homophily를 보고한다. Privileged g reference의 개선은 unknown-g adaptation의
    성과가 아니다. Signed diffusion/BP는 기존 자산이므로 새 이름으로 novelty를 주장하지 않는다. 기존 training prior 밖의 frozen 실패를 새 architecture 필요성으로 곧바로 해석하지 않는다. Source 수가 바뀌면 missing-query 집합도 바뀌므로
    feature intervention은 원 primary query 집합으로 양쪽 예측을 제한한다. 보조 집계 보정은 원 statistics·예측을 보존해 별도 기록했다.
