project: SSP sparse size 문헌·미검증 확장
date: '2026-11-06'
source: findings/sources/ssp-sparse-size-2026-11-06/LITERATURE_REVIEW_KO.md
setting: 원문·기존72편 정리본·제한된 추가 검색. 새 training/objective 호출 없음.
entries:
- id: SSP-SP-U01
  kind: untested
  claim: Tied count 구조가 개별 monomial shrinkage 아래 잘 추정되지 않아 same-count 결정을 해치는가?
  observation: 문헌은 dense SK의 normal prior 선택, basis별 sparsity 차이, size basis 모델링과 최근 horseshoe 응용을 각각
    제공한다. 이들을 size→prior 손실→same-count regret의 직접 확인 결과로 결합할 수는 없다.
  verdict: 유망한 미검증 연결 가설; native BOCS 실패·최초성 확정 아님
  not_closed: Native horseshoe의 size 추정·실제 결정 영향은 아직 검증하지 않았다.
  do_not_claim: 모든 size 함수가 최대 dense, horseshoe가 반드시 실패, FM rank1이 모든 곡률을 해결, 4arm만으로 원인 확정이라는 주장을 하지
    않는다.
  failure_reason: 새 결과는 없어 인과 원인을 확정할 수 없다. 기존 corrected linear cycle의 signed gate 실패도 보존한다.
  reason_status: hypothesis
  reopen_when: Native prior·known costs·basis·inference·acquisition을 고정한 비교가 새 독립 자료에서 실제 same-count 손실을
    확인할 때
  comparison_floor: Horseshoe/normal의 같은 basis·likelihood 대조, known-cost residualization, 별도 FM 구조 대조,
    HS+count intervention
  recheck: 같은 archive·후보·budget·intercept·scale·추론 정확도에서 count fit, held-out same-K error와 regret을 사전
    명세한다. FM 성능 차이는 prior-only 인과효과로 보지 않는다.
