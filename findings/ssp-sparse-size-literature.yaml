  evidence: 문헌·소스 확인과 analyst 해석을 분리; 새 실험 없음
  literature:
  - paper_id: BOCS
    relation: boundary
    note: Native sparse quadratic prior와 known-penalty 처리의 출발점.
  - paper_id: BOCSRandom
    relation: motivation
    note: Dense SK 때문에 normal prior를 택한 동기. Size 실패 실증은 아님.
  - paper_id: BOCSPSR
    relation: boundary
    note: 모델 가정과 acquisition 최적화 비용을 구별.
  - paper_id: NonOrthogonalSet
    relation: boundary
    note: Basis-dependent sparsity의 인접 선행.
  - paper_id: FABOLAS
    relation: boundary
    note: 명시적 size basis의 선행. Training fidelity와 subset composition은 다름.
  - paper_id: WavelengthBOCS
    relation: motivation
    note: 최근 horseshoe 응용의 긍정 사례. Size 손실 검증은 미실행.
  - paper_id: FactorizationMachines
    relation: boundary
    note: Factor sharing 대조 및 작은 rank·곡률 부호의 적용 경계.
