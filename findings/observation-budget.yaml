- id: OBS-F02
  kind: failure
  claim: 부분그래프 선택 개선으로 경쟁력 있는 확률 예측을 확보했다.
  observation: 사후 Laplace context-prior NLL0.85241/Brier0.55736. Budget64 Observation의 matched NLL은+0.21952 CI[+0.12555,+0.31655],
    cluster+0.23310 CI[+0.14044,+0.32727] 더 나빴다.
  verdict: 단순 확률 기준선에도 경쟁력 부족
  failure_reason: Frozen PFN끼리의 상대 개선이 단순 class prior 대비 utility를 보장하지 않았다. Calibration·적은 context·subgraph mismatch·전처리
    중 원인은 미상이다.
  reason_status: unknown
  excluded_explanations: []
  closed_scope: PPR/구조 정책 대비 개선만으로 좋은 missing-feature predictor라고 주장
  not_closed: 확률 점수 비교를 accuracy의 같은 결론으로 자동 확대하지 않는다. Prior 대조는 사후 sanity check다.
  reopen_when: 극소 context·불완전 입력에서 단순 prior보다 좋은 확률 정보를 실제로 회수하는 추론 원리가 나올 때.
  comparison_floor: Uniform class probability, Laplace context prior, full graph, strongest fixed retrieval
  recheck: 학습 전에 단순 확률·majority 대조를 고정하고 NLL/Brier/accuracy를 독립 graph에서 함께 평가한다.
