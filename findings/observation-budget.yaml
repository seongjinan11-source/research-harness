- id: OBS-F01
  kind: failure
  claim: Mask-aware 학습 정책이 강한 경로 규칙을 넘는다.
  observation: Budget64 Observation/Paths NLL matched1.07193/1.05353, cluster1.08551/1.07685. 차이+0.01839 CI[−0.06529,+0.10213],
    +0.00866 CI[−0.11473,+0.11820].
  verdict: 주 성공 기준 미통과·확장 보류
  failure_reason: Mask를 보는 것은 유용했지만 비슷한 효과를 고정 shortest-path closure도 얻었다. Joint subset 표현력·stochastic train/deterministic
    inference·학습 budget 중 정확한 원인은 분리하지 않았다.
  reason_status: unknown
  excluded_explanations: []
  closed_scope: 현재 mask/geometry shared-node MLP를 더 학습해 메인 방법으로 확대
  not_closed: 모든 learned retrieval을 기각하지 않는다. Budget32 cluster 차이−0.19284 CI[−0.39771,+0.00284]는 보조 개발 신호이며 승리가
    아니다.
  reopen_when: 동일 resident budget에서 mask-aware 공동 부분그래프 구성이 강한 경로 규칙보다 나은 utility를 보이는 장치가 나올 때.
  comparison_floor: Evidence-paths, PPR, equal-capacity structure policy, random, context prior
  recheck: Fresh graph에서 사전 budget·mask gate를 고정하고 preprocessing/search를 포함한 비용과 label 예측을 함께 비교한다.
  reopen_tags: &id001
  - observation-mask
  - context-scale
  - graph-structure-use
  reopen_keywords: &id002
  - subgraph
  - halo
  - retrieval
  - observation policy
  - evidence path
