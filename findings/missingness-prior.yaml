  kind: lesson
  claim: 공식 전처리와 신호 대비 headroom을 먼저 확인한다.
  observation: No-missing accuracy 약72.9%, majority 약62%, MCAR 80% 손실 약3.5%p. 약한 입력 경로와의 비교만으로 새 prior의 가치를 주장하지
    않는다.
