project: 초기 Missingness-aware GraphPFN
date: '2026-11-01'
source: findings/sources/graphpfn-2026-11-01/missing_closure.md
setting: 공식 prior의 소형 binary tasks, missingness mechanism mixture, 단일 학습 seed. NaN 학습과 official imputation 경로를 구분.
closed_scope: 아래 각 항목의 구현·조건·예산에 한정. 미실행 방법과 전체 연구 방향을 실패로 세지 않는다.
related:
- GraphPFN
entries:
- id: MISS-F01
  kind: failure
  claim: Missingness prior 추가가 공식 입력 경로와 미학습 MNAR에서 유리하다.
  observation: NaN-input Ours−B4는 label_dep에서 +0.75/+1.43/+0.78%p였지만 degree_dep/self_mask는 약 ±0.1%p. Official imputation의
    released GraphPFN이 NaN-trained Ours보다 label_dep에서 0.54/0.63/0.12%p 높았다.
  verdict: 범용 우위 미확보·해당 라인 중단
  failure_reason: Raw-NaN 기준선이 공식 imputation보다 약했고, official fill만으로도 mask가 잘 드러났다(AUROC 0.97). Context-query mask
    관계 불일치에서 mixed-prior 이득이 유지되지 않았다. 이것만으로 모든 원인을 확정하지는 않는다.
  reason_status: supported
  excluded_explanations: []
  closed_scope: NaN 학습의 작은 이득을 official-input robustness나 unseen-MNAR 일반화로 승격
  not_closed: Imputed-input에 맞춘 prior의 효과는 미평가다. 더 넓은 MNAR 식별 문제도 기각하지 않는다.
  reopen_when: 관측 메커니즘의 context-query shift를 다루면서 official preprocessing 대비 추가 가치를 보이는 학습 원리가 나올 때.
  comparison_floor: 공개 GraphPFN + official imputation, 동일 예산 B4
  recheck: 동일 입력 경로·초기화·예산의 새 bank에서 context-query mismatch와 미학습 mask를 paired 평가한다.
  reopen_tags: &id001
  - observation-mask
  - prior-mismatch
  - distribution-shift
  reopen_keywords: &id002
  - MNAR
  - missingness
  - context-query
  - observation mechanism
  - imputation
  tags: *id001
  keywords: *id002
  source_refs:
