project: CORL-S size/capacity strata mixed reward for RL automatic heuristic design
date: '2026-11-20'
source: findings/sources/co-rl-strata-2026-11-20/DECISION_KO.md
setting: >-
  CALM 계열 RL-AHD에서 응답 하나의 스칼라 보상이 크기·용량 층의 평균이 되는 문제를 다룬 사전 명세 v2.
  이전 cycle(2026-11-19 보상 잡음 진단)의 OBP obp_v2(층 4개: 5k/1k × 용량 100/500, 층당 50)와
  TSP tsp_v3(N 50/100/200, 층당 50) pool을 쓴다. 이번 cycle에서는 dev split만 썼고 confirm은 읽지 않았다.
  held-out 층 생성, 동결, 학습은 하지 않았다.
closed_scope: >-
  기존 dev pool의 child–parent 판정 수준에서, OBP 층 혼합 보상의 형태(혼합 평균 R0, 고정 강건 z-score R2,
  MO-GRPO형 group z-score R2g, 층별 승률 R3)를 비교하는 처방 비교 cycle을 계획대로 실행하는 것.
related: [CALM, MOGRPO, GDPO, A2DEPT, AdaEva, LLMEndToEndCO]
entries:
  - id: CORLS-F01
    kind: failure
    claim: '층 혼합 보상의 형태를 바꾸면(R3 층별 승률, R2 고정 스케일, R2g MO-GRPO형) RL-AHD의 child–parent 개선 판정이 R0(혼합 평균 gap)와 달라지고, 그 차이로 held-out 층 전이를 판정할 수 있다.'
    observation: >-
      dev 사전 점검(동작이 같은 쌍 제외). OBP 68쌍(24 group)의 불일치율은 R2 vs R3 4.4% [0, 11.5],
      R2g vs R3 4.4%, R0 vs R3 2.9%(2쌍), R0 vs R2 1.5%였다. 층 부호가 충돌하는 15쌍에서 R0·R2g·R3의 판정은 같았다.
      TSP 89쌍은 R2 vs R3 6.7% [2.2, 12.3]였고, 층 충돌 14쌍에서는 35.7% [13.3, 64.3]였다. TSP는 층별 MAD가 거의 같아 R2 = R0였다.
    verdict: '중단(사용자 결정, Phase 0 이전). 주 판정 J3는 검정력 부족으로 결론 없음이 예상되었다.'
    failure_reason: 'OBP에서 처방 사이 결정 차이 자체가 작다. dev 비율을 confirm 크기에 적용하면 R0–R3 불일치 쌍이 약 5개로, J3에 필요한 불일치 단위 15개에 못 미칠 것으로 추정했다(추정이며 confirm에서 확인하지 않음).'
    reason_status: supported
    excluded_explanations: ['작은 group std의 잡음이 결정을 크게 바꾼다는 설명은 dev에서 지지되지 않았다(R2 vs R2g 불일치 2–3%).']
    closed_scope: 'OBP obp_v2 dev pool, 층당 50 instance, child–parent 판정에서 R0/R2/R2g/R3 비교로 처방 우열을 가리는 cycle.'
    not_closed: 'TSP 층 충돌 쌍의 평균 대 순위 집계 차이, 실제 GRPO 학습 중 층 가중 이동(H1b), 더 큰 pool, held-out 층 전이 자체.'
    reopen_when: '학습 중 층별 분산이 크게 이동한다는 근거, 또는 층 충돌 쌍이 충분히 많은 문제·pool이 생겨 처방 사이 판정 차이가 커질 때.'
    comparison_floor: 'R0(혼합 평균), MO-GRPO형 group z-score, 고정 스케일 Pre-Norm, CALM 저장소 보상.'
    recheck: '새 문제나 pool의 dev에서 같은 precheck_r2_r3.py로 형태 사이 불일치율과 층 충돌 쌍 수를 먼저 잰다.'
    tags: [reward-signal, multi-reward, eval-protocol]
    keywords: [strata mixed reward, size strata, online bin packing, TSP, GRPO advantage, MO-GRPO, win rate aggregation, decision disagreement, precheck]
    reopen_tags: [reward-signal, multi-reward]
    reopen_keywords: [policy-dependent reward variance, stratum weight drift, rank aggregation reward, per-instance advantage]
    source_refs: [findings/sources/co-rl-strata-2026-11-20/PRECHECK_KO.md, findings/sources/co-rl-strata-2026-11-20/precheck_dev.json, findings/sources/co-rl-strata-2026-11-20/DECISION_KO.md]
    evidence: dev 원 행렬에서 재계산(precheck_r2_r3.py)
    literature:
      - {paper_id: MOGRPO, relation: direct_prior, note: 'Theorem 1(advantage와 성분 std 비례)과 성분별 group z-score가 기제와 처방을 선점한다. 부록 Pre-Norm 결과는 고정 스케일로도 충분할 수 있음을 보인다.'}
      - {paper_id: GDPO, relation: direct_prior, note: '성분별 정규화 후 batch 정규화. 같은 처방 계열이다.'}
      - {paper_id: A2DEPT, relation: direct_prior, note: 'AHD에서 원 목적값 합의 scale bias를 지적하고 크기 척도로 정규화한다.'}
      - {paper_id: CALM, relation: motivation, note: '대상 RL-AHD. 보상 형태 ablation이 보상 정의의 중요성을 보였다.'}
      - {paper_id: LLMEndToEndCO, relation: comparison, note: 'instance 하나 단위의 group이라 층 혼합이 구조적으로 없는 대비 사례이자 단순 대안의 출처다.'}
    revisit_status: open
  - id: CORLS-P01
    kind: preserved
    claim: '선행 대비 차별점 정리: 층 혼합 보상의 문제·기제·처방은 선행이 있고, 남는 차별점은 목표 선언 아래 균등화의 정오 판정, gap 정규화 뒤 남는 분산 가중, 작은 group 강건성, 학습 중 가중 이동뿐이다.'
    observation: 'A2DEPT 부록 식(48), MO-GRPO Theorem 1·Limitations·부록 Pre-Norm 단락, AdaEva Table 1·3과 부록 B, LLMEndToEndCO §4.3, GDPO 초록·그림 1을 원문에서 확인했다.'
    do_not_claim: '층 혼합 보상의 scale bias를 처음 지적했다거나, 층별 정규화·순위 집계를 새 처방으로 주장하지 않는다.'
    tags: [reward-signal, multi-reward]
    keywords: [novelty audit, differentiation, scale bias, Pre-Norm]
    source_refs: [findings/sources/co-rl-strata-2026-11-20/DIFFERENTIATION_KO.md]
    literature:
      - {paper_id: MOGRPO, relation: direct_prior, note: '기제와 처방의 출처'}
      - {paper_id: AdaEva, relation: boundary, note: '단일 층 search pool의 Kendall W는 층 사이 충돌을 재지 않는다.'}
  - id: CORLS-L01
    kind: lesson
    claim: 'AdaEva의 TSP Kendall W = 0.03은 instance 사이 순위 충돌이 아니라 후보가 거의 동률인 상태(Across-CV 0.0001)를 반영한다.'
    observation: 'AdaEva Table 3: TSP W 0.03, Across CV 0.0001, Within CV 0.0348. OBP W 1.00, Across CV 0.3403. search pool은 단일 크기다(OBP 5,000 items·capacity 100, TSP 100-city).'
    interpretation: '2026-11-19 보상 잡음 진단 계획이 TSP를 주 문제로 바꾼 근거를 이 해석으로 정정한다. 낮은 W를 instance 잡음의 증거로 옮기지 않는다.'
    tags: [eval-protocol, reward-signal]
    keywords: [Kendall W, near ties, across-candidate CV, instance agreement]
    source_refs: [findings/sources/co-rl-strata-2026-11-20/DIFFERENTIATION_KO.md]
  - id: CORLS-L02
    kind: lesson
    claim: '휴리스틱 순위 수준의 층 사이 불일치(OBP τ 0.43–0.85)는 child–parent 판정 수준의 형태 간 차이로 이어지지 않을 수 있다.'
    observation: 'OBP dev에서 층 사이 순위 τ가 낮았는데도 R0와 R3의 판정 불일치는 2.9%였다.'
    interpretation: '처방 비교 cycle을 설계하기 전에, 판정에 실제로 쓰이는 단위(쌍·group)에서 형태 간 불일치를 먼저 잰다. 이것이 값싼 결정적 진단이다.'
    tags: [eval-protocol, reward-signal]
    keywords: [precheck first, decision-level disagreement, rank-level vs pair-level]
    source_refs: [findings/sources/co-rl-strata-2026-11-20/PRECHECK_KO.md]
