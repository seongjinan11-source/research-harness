project: Disjoint feature–label factor PFN pilot
date: '2026-11-02'
source: findings/sources/disjoint-factor-2026-11-02/REPORT_KO.md
setting: 새96 binary typed-SBM graphs 중 matched48 primary. 관측feature node와 label context 교집합0. 3 arms×3 seeds, 동일2048 task exposures/256 updates. Context는 총1/2/4개,12개 node 중3/6개 관측.
related: [GraphPFN, CSBMInference, GSPN]
entries:
  - id: DFACT-P01
    kind: preserved
    claim: 관측 feature와 label context가 겹치지 않는 새 graph bank에서 학습된 structured predictor가 두 공개 GraphPFN 입력 대조보다 높은 정확도를 얻었다.
    observation: "Factor PFN65.4004%/NLL0.628722, Mask PFN57.0974%/0.676368, 실제 PCFI 입력으로 학습한 PFN55.2304%/0.677401. Factor−Mask accuracy+8.3030%p CI[+2.7750,+14.0753], Factor−PCFI+10.1700%p CI[+4.4253,+16.3513]. NLL 차이는 각각−0.047645 CI[−0.141633,+0.050681], −0.048678 CI[−0.142740,+0.049630]로0을 포함한다."
    do_not_claim: 확률 품질의 neural 대비 유의한 우위, strong classical 대비 우위, variable schema·실제 graph 전이, 논문급 novelty로 확대하지 않는다. Matching은 task/step budget이며 파라미터 수·학습 시간은 다르다. Source raw-values/graph intervention과 learned potential의 독립적 가치도 별도로 본다. Low-density의 Factor63.7621%/NLL0.632631 vs Constant60.4249%/0.696110은 보조 point estimate이며 해당 paired CI를 보고하지 않았으므로 일반적인 OOD adaptation 성공으로 승격하지 않는다.
    tags: [graph-structure-use, observation-mask, amortized-inference, eval-protocol]
    keywords: [disjoint feature label nodes, observed cell factors, factor PFN, prior fitted inference, source alignment, fresh bank]
    source_refs:
      - findings/sources/disjoint-factor-2026-11-02/REPORT_KO.md
      - findings/sources/disjoint-factor-2026-11-02/protocol.json
      - findings/sources/disjoint-factor-2026-11-02/results/paired.json
      - findings/sources/disjoint-factor-2026-11-02/results/summary.json
    evidence: 새 graph48개에서 context·관측수·fixed3 seeds를 graph 내 평균한 paired bootstrap5000회. Query CE로 실제9개 모델을 학습했다.
  - id: DFACT-P02
    kind: preserved
    claim: 학습된 predictor는 disjoint 조건의 feature–node 대응과 graph 구조 변화에 민감하다.
    observation: "사전 context2/observed6 보조 intervention, matched48 graphs: feature shuffle−11.2269%p CI[−20.3704,−2.0833], graph permutation−21.7593%p CI[−34.3779,−8.7963]. No-observed−standard는−6.1343%p CI[−12.9630,+0.9259]였으며 NLL 차이는−0.046387 CI[−0.276343,+0.134338]였다."
    do_not_claim: Shuffle 민감도만으로 feature 추가의 유익한 순효과를 확정하거나, 원래 feature-removal gate를 통과했다고 쓰지 않는다. CI가0을 포함하는 제거 결과도 feature 효용0의 증명은 아니다. Loopy feedback 차단을 새 방법으로 골라 gate를 바꾸지 않는다.
    tags: [observation-mask, graph-structure-use, eval-protocol]
    keywords: [observed alignment, shuffled feature, graph permutation, feature removal, no observed, intervention]
    source_refs:
      - findings/sources/disjoint-factor-2026-11-02/results/interventions.json
      - findings/sources/disjoint-factor-2026-11-02/results/decision.json
    evidence: 같은 checkpoint/context/query에서 입력만 변경. Query truth는 개입 구성에 사용하지 않았다. Primary 전체와는 다른 보조 조건이다.
  - id: DFACT-P03
    kind: preserved
    claim: Query 자체도 feature가 없는 사전 secondary 분할에서 학습된 factor predictor의 neural 대조 대비 개선이 나타났다.
    observation: "Factor64.6030%/NLL0.600055, Mask56.9842%/0.679388, PCFI54.4846%/0.684093, Constant63.3009%/0.599397, Grid6-BP65.7650%/0.585340. Factor−Mask accuracy+7.6188%p CI[+1.7946,+13.6193], NLL−0.079333 CI[−0.137580,−0.023154]; Factor−PCFI accuracy+10.1184%p CI[+3.5331,+16.8865], NLL−0.084038 CI[−0.142503,−0.027776]."
    do_not_claim: 같은 bank의 사전 secondary이며 primary gate를 대체하지 않는다. Constant 대비 accuracy/NLL CI는0을 포함한다. Grid6-BP 대비 NLL 차이+0.014715 CI[−0.004854,+0.037785]도0을 포함하며 동등성을 증명한 것은 아니다. 전체 context·query 조건의 확률 우위나99.5% missing 전이로 확대하지 않는다.
    tags: [observation-mask, graph-structure-use, eval-protocol]
    keywords: [query without features, disjoint observations, secondary analysis, feature source, missing query]
    source_refs:
      - findings/sources/disjoint-factor-2026-11-02/results/query_without_features.json
      - findings/sources/disjoint-factor-2026-11-02/results/secondary_partitions.json
      - findings/sources/disjoint-factor-2026-11-02/runtime/secondary_partitions.py
    evidence: Query feature mask만으로 분할. 새 학습·primary 변경 없이 저장 예측을 재채점했다. Context both-classes 분할은 별도의 사후 진단으로 구분했다.
  - id: DFACT-F01
    kind: failure
    claim: 현재 learned node/feature factor PFN이 강한 model-based inference와 경쟁하는 독립적인 메인 방법이다.
    observation: "Neural accuracy gate=True지만 feature-removal gate=False, mechanism gate=False. Constant factor66.0053%/NLL0.621022 대비 learned65.4004%/0.628722: accuracy−0.6049%p CI[−3.4860,+1.9721], NLL+0.007700 CI[−0.056868,+0.098511]. Grid6-BP65.9557%/NLL0.555143 대비 learned NLL+0.073580 CI[+0.019579,+0.150308]. Grid6-exact predictive KL0.056253>.01. Single-graph forward median6.837ms vs Grid6-BP11.874ms로 약1.74배이며 사전2배 비용 기준 미충족."
    verdict: 정확도 개선과 입력 민감도는 보존하지만 현재 known-family 구성의 메인 메소드 확대는 보류한다.
    failure_reason: 유의한 neural accuracy 개선만으로 learned potential의 필요성이나 classical 대비 품질·비용 우위를 확보하지 못했다. Potential fit, binary model-family 제약, finite BP/Bethe 근사, 학습량의 기여를 분리하지 않았다. 고유 원인은 미상이다.
    reason_status: unknown
    excluded_explanations:
      - Source와 bank lock, all3200 bank hashes, frozen public weights, 실제 성공update·schedule, finite checkpoints와11952 probability 재채점을 확인했다.
      - Tree에서 BP/Bethe 계산을 독립 열거와 대조했고, class/feature/relation/node 순열과 hidden-value poison 검사를 통과했다. 이것이 cyclic production graph의 정확성 보장은 아니다.
      - BP-only reference에서 불필요한 exact query moments를 제외했고 원래 reference와 예측 차이0을 확인했다.
    closed_scope: 현재8099-parameter·24-step BP·binary node/column latent·12-node/2-feature/2-relation known-family·256-update 구성을 범용 missing GraphPFN 메인 방법으로 승격하는 것.
    not_closed: DFACT-P01/P02/P03의 실제 성과를 지우지 않는다. 다른 feature law, 추론 구조, variable schema, 큰 graph에서 학습한 potential의 효용을 기각하지 않는다. 미실행 후속을 실패로 세지 않는다.
    reopen_when: 작은 알려진 Gaussian family의 고정 factor/parameter grid로 충분하지 않은 과제에서, 실제 관측값과 context를 결합하는 학습 원리가 독립적 품질·비용 이득을 제공할 근거가 생길 때.
    comparison_floor: 동일 입력·예산의 실제 Mask/PCFI/FISF-trained PFN, fixed-factor BP, known-family Grid6 exact/BP, feature-only, LP/class prior. 실제 graph/schema 확장에서는 원래 Ephris/Wander와 해당 model-based 추론도 검토한다.
    recheck: 실패 bank에서 새 temperature/head/loss로 구제하지 않는다. 어떤 likelihood/function-family 또는 inference operation을 바꾸는지 먼저 명시하고 새 독립 bank에서 accuracy와 probabilistic quality·cost를 분리해 검증한다. Context total과 per-class, primary와 secondary를 구분한다.
    tags: [model-based-baseline, amortized-inference, observation-mask, eval-protocol]
    keywords: [factor graph PFN, constant potential, BP approximation, strong classical baseline, coherent weights, disjoint]
    reopen_tags: [prior-mismatch, graph-structure-use, differentiable-reasoning]
    reopen_keywords: [unknown feature law, learned observation likelihood, conditional evidence, sparse approximate inference, heterogeneous schema]
    source_refs:
      - findings/sources/disjoint-factor-2026-11-02/results/decision.json
      - findings/sources/disjoint-factor-2026-11-02/results/paired.json
      - findings/sources/disjoint-factor-2026-11-02/results/benchmark.json
      - findings/sources/disjoint-factor-2026-11-02/results/final_integrity.json
    evidence: 실제9개 학습·2304 성공updates·18432 task exposures. 같은GPU median30회이며 외부GPU 부하는 통제하지 않았다. 이전 circuit을 이 bank에서 재학습한 비교가 아니다.
    revisit_status: open
  - id: DFACT-L01
    kind: lesson
    claim: Latent node class와 feature centroid를 함께 추론하는 원리는 기존 CSBM 연구와 겹친다.
    observation: CSBMInference는 latent community와 Gaussian feature centroid에 대한 AMP–BP, Bethe free entropy와 parameter estimation을 다룬다. 이번 binary column state·mask 처리·learned potential만으로 novelty를 주장하지 않는다.
    interpretation: 이 pilot은 새로운 입력 조건에서 학습·추론을 검증한 것이며, 원 논문 AMP–BP의 재현이나 우월성 비교가 아니다. Known-family quality floor는 별도의 Grid6 reference다.
    tags: [model-based-baseline, eval-protocol, uncertainty]
    keywords: [CSBM, AMP BP, latent feature centroid, prior art, novelty scope]
    source_refs:
      - papers/CSBMInference.yaml
      - findings/sources/disjoint-factor-2026-11-02/METHOD.md
    evidence: 원 논문의 setup, factor graph와 message equations, parameter estimation을 확인했다.
  - id: DFACT-U01
    kind: untested
    claim: 새로운 feature law·semantic schema·real graph·99.5% missing으로의 확장
    observation: 이번 실행은12 nodes·binary classes·2 Gaussian features·2 relations다. Context1/2/4는 총 label 수이며 per-class가 아니다. 3/6 observed nodes는75/50% node missing이며99.5% 조건이 아니다. Variable feature count를 표현할 수 있는 코드여도 평가는2 features만 수행했다.
    tags: [feature-heterogeneity, zero-shot-gap, graph-scale, observation-mask]
    keywords: [unseen feature law, semantic schema, extreme missingness, real heterograph, variable feature count]
    source_refs:
      - findings/sources/disjoint-factor-2026-11-02/protocol.json
      - findings/sources/disjoint-factor-2026-11-02/REPORT_KO.md
    evidence: 명시한 미실행 범위. 이전 circuit/memory의 판정을 변경하지 않는다.
