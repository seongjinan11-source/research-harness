project: Plain relation adaptation과 CRR 제안 철회
date: '2026-11-01'
source: findings/sources/graphpfn-2026-11-01/role_reversal.md
setting: 기존 Plain, exact-degree bipartite 재배선, 역할 교환·mechanism freeze·label shuffle 진단. CRR 추가 학습은 하지 않음.
closed_scope: 아래 각 항목의 구현·조건·예산에 한정. 미실행 방법과 전체 연구 방향을 실패로 세지 않는다.
