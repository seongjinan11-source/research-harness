project: FP02 joint graph nuisance inference
date: '2026-11-04'
source: findings/sources/fp02-nuisance-2026-11-04/DECISION_KO.md
setting: 기존 실제5graph rep0/seed11의 none 및95% 결측10episode를 재사용한 development다. 새 Poisson fixed/SBM update/DC update30예측과 기존70비교를 재채점했다. Frozen C_global 관측factor와24step추론을 공유하며 신경망학습 및 target optimizer는0회다.
related: [GraphPFN, CSBMInference, SSGP, GGP]
entries:
  - id: FP02-F01
    kind: failure
    claim: 차수 propensity, 클래스 비율과 class-pair affinity를 동일 관측에서 갱신하면 기존 nonedge 손해를 복구하면서 CiteSeer 성능을 보존한다.
    observation: "None 다섯graph 평균 accuracy는 fixed47.226%,SBM42.150%,DC43.805%,oldfull55.691%,oldedge63.750%,LP restart66.319%다. Physics DC20.290% 대 oldfull48.551%/oldedge88.801%; CiteSeer DC35.090% 대 oldfull52.898%. DC와SBM 사전7개 조건 모두FAIL. DC95−none accuracy 평균+0.245%p로 피처 추가 효용도 확립하지 못했다. AuditPASS와 성능gate실패를 분리한다."
    verdict: 현재 Poisson working score·초기화·3회Gamma갱신/24stepBP의 Stage1신경망학습 확대를 중단한다. 이 개발bank에서 damping/횟수/affinity를 바꾸어 구제하지 않는다.
    failure_reason: 같은 데이터의 반복중복 가산이나 기본 수치오류는 독립검사에서 발견되지 않았고, prior+current sufficient statistics 갱신도 실패했다. Physics의 큰 클래스 소실은 첫 nuisance갱신 전에 이미 발생하며 갱신으로 회복되지 않았다. Label=단일graph community 가정·초기화·loopy BP·Poisson misspecification의 고유 기여는 분리하지 못했다.
    reason_status: unknown
    excluded_explanations:
      - 독립 CPU/tinyCUDA tree oracle, Gamma moments와edge/nonedge count/exposure, hidden poison, context clamp, permutation, gradient, source0/1, 빈graph 검사가PASS다. Sparse nonedge mean-field는 dense추론과 차이가 있으며 이를 정확Bayes라고 부르지 않는다.
      - 저장100예측의 입력·query·truth·context·hash가 동일하고 독립재채점 및 source audit를 수행했다. None에서도 실패하므로 피처압축만으로 이 결과전체를 설명할 수 없다.
      - Physics fixedPoisson도 악화하여 hub pair의Poisson포화만으로 전체실패를 설명할 수 없다. 이를 전체DC-SBM의 불가능성으로 확대하지 않는다.
    closed_scope: FP02 PLAN_v2와protocol의 고정10개development episode에 대한 현재3연산의 Stage1확대. 동일 최종결과를 본 뒤 graph마다 full/edge/DC를 골라 성공으로 보고하지 않는다.
    not_closed: 기존 Factor의 disjoint label-feature 연결, oldedge의 실측성능, 적절한 조건부graph prior, 다른학습된관측factor, homophily 적응 및 DCSBM 일반은 기각하지 않는다.
    reopen_when: 현재의 graph-likelihood 또는 초기화/근사 중 어떤 연산을 바꾸는지 명확히 정의하고, 큰 클래스 분할을 피하면서 독립조건에서 기존oldedge와LP를 넘을 구체적 근거가 있을 때.
    comparison_floor: 동일 관측/context/query의 oldfull,oldedge,Poisson fixed,SBM/DC 갱신,LP harmonic/restart,public PFN 및PCFI/FISF+PFN. Population·minority·NLL/Brier와피처제거 대조를 유지한다.
    recheck: 별도cycle에서3독립리뷰와 수치검사 후 새training/final bank를 고정한다. 재사용실제5graph는development이며 노드bootstrap 또는 모델seed를 독립graph로 세지 않는다.
