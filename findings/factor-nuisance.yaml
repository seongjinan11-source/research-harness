  - id: FP02-L01
    kind: lesson
    claim: Homophily와 nonedge 삭제의 효용은 같은 변수가 아니며 극소 context의 raw homophily를 참값처럼 사용하면 안 된다.
    observation: Physics 개발부분graph의 사후 전체label homophily는0.9581710258이지만 oldfull48.551%에서oldedge88.801%로 개선된다. Context만 읽는 독립계산에서 Cora28labels/3edges(3same),CiteSeer24/0,PubMed12/1(0same),CS55/2(2same),Physics20/2(2same)다. 전체label homophily는 사후진단이며 모델입력이 아니다.
    interpretation: Bernoulli SBM에서 homophily이면 edge LLR은양수/nonedge LLR은음수이고 heterophily이면 반대다. 두 경우 모두 올바른 관측 likelihood라면 nonedge가 정보일 수 있다. 삭제의 이득은 해당 추론기의 misspecification과 근사 등을 포함하며 h하나로 판정되지 않는다. Class-balanced context의 표본편향과 표본수 부족도 별도로 처리해야 한다.
    tags: [graph-structure-use, observation-mask, label-imbalance, eval-protocol]
    keywords: [homophily versus nonedge informativeness, context-only support, balanced context, edge likelihood ratio, identifiability, few labels]
