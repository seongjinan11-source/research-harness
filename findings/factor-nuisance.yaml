  - id: FP02-U01
    kind: untested
    claim: Context에서 관계 compatibility를 추정하고 graph-conditioned label-field와 관측 feature factor의 공동 추론에 사용한다.
    observation: 제안만 했으며 미구현·미학습이다. Graph를 label partition에서 생성하는 likelihood 대신 기존 graph 위의 조건부 label field를 학습하는 후보이다. Context에서 edge 방향·강도를 추정할 때도 support·불확실성·class permutation과 pseudo-query의 self-label LOO 누출을 검사해야 한다.
    verdict: 미실행 후보로 보존하며 성공이나 학습 실패로 세지 않는다. Gaussian-field SSL,CLP/CPGNN,learned diffusion과 겹치는 원리 자체는 novelty가 아니다.
    tags: [graph-structure-use, prior-mismatch, observation-mask, amortized-inference]
    keywords: [conditional graph label field, context adaptive compatibility, missing feature factor, uncertainty, not implemented]
