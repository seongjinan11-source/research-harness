areas: [ml-foundations]
problem: "Relational graph와 node features를 활용해 적은 라벨로 node classification을 수행한다."
core_idea: "Feature GP를 자기 자신과 1-hop 이웃에서 평균하여 covariance P K(X,X) P^T를 만든다. Robust-max likelihood와 inducing-point variational inference를 사용하며 ELBO로 파라미터를 최적화한다."
key_assumptions:
  - "관측된 feature kernel과 이웃 평균이 label 예측에 유용하다고 가정한다."
strengths:
  - text: "그래프와 feature를 covariance에서 결합하며 empirical kernel mean embedding으로 해석한다."
    tags: [graph-structure-use, uncertainty]
  - text: "Inducing variables로 근사 추론하고 별도 early-stopping validation을 요구하지 않는다."
    tags: [inference-cost, adaptation]
limitations:
  - text: "§3.2에서 분류 posterior는 해석적으로 계산할 수 없어 variational 근사를 사용한다."
    tags: [uncertainty]
    source: self
  - text: "§3.3의 추론 비용은 O(L M^2)이며 covariance 계산에 최대 차수의 제곱 비용이 있다."
    tags: [graph-scale, inference-cost]
    source: self
  - text: "[analyst] Feature 관측 mask의 공동 likelihood와 target 재학습 없는 PFN 전이는 검증하지 않는다."
    tags: [observation-mask, zero-shot-gap]
    source: analyst
builds_on: [GaussianProcesses, KernelMeanEmbeddings, SparseVariationalGaussianProcesses]
compared_against: [GCN, MoNet, DCNN, DeepWalk, Planetoid, LP, ICA, SemiEmb, ManiReg]
open_questions:
  - "관측 feature와 context가 분리되어도 feature kernel을 정의하고 새로운 graph에 적용할 수 있는가?"
hooks:
  - "ADTR-P02의 직접 추론과 구별해야 할 graph covariance 선행연구다. 공식 GGP 재현은 미실행이다."
notes: "L은 labelled nodes 수, M은 inducing variables 수다. 공식 metadata의 pages와 Nicolò 표기를 따랐다. Code README의 전용 GPflow branch 의존성을 확인했다. PFN이 아니며 §5.2는 라벨 획득 뒤 재학습한다."
