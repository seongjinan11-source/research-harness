- id: PCFIRA-L02
  kind: lesson
  claim: 공간 confidence와 Node-frame은 factorial로 분리하고 label heterophily와 feature law도 독립적으로 다룬다.
  observation: I/Node×weighted/uniform공간전파를비교했고confidence는descriptor와채널보정에유지했다. 기존dev2graph는모두label-homo였으며새32개개발graph는label-homo/hetero×feature-smooth/rough네cell에8개씩배정했다.
    원test/realbank를독립최종검증으로재명명하지않았다.
  verdict: 공간가중치interaction을confidence전체효과로확대하지않고,라벨heterophily를모든numericfeature의부호반전과같게보지않는다. 한부품이효과없으면그부품의필요성을좁히고전체연구를자동중단하지않는다.
