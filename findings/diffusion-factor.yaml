  observation: factor_bp:accuracy71.403770%/FactorKL0.085031/Grid6KL0.091114; factor_exact:accuracy71.644896%/FactorKL0.000000/Grid6KL0.011446; smc_gibbs1:accuracy69.765487%/FactorKL0.008698/Grid6KL0.020647;
    smc_gibbs_cost:accuracy68.853340%/FactorKL0.007171/Grid6KL0.017499; diffusion_only:accuracy65.673225%/FactorKL0.047351/Grid6KL0.060687; diffusion_smc_fixed:accuracy65.151014%/FactorKL0.079318/Grid6KL0.090732;
