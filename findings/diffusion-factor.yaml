- id: DFI-F02
  kind: failure
  claim: Rényi-2/ESS 기반 adaptive likelihood tempering이 같은 learned diffusion+SMC fixed schedule보다 예측 품질을 개선한다.
  observation: Fixed FactorKL0.079318,ESS0.071562;difference-0.007756[95CI-0.019864,+0.006172].Accuracy65.151014%→64.952601%.ESSgate=False.
  verdict: 현재.8K threshold/8stage budget의ESS controller 증분은 미입증이며 추가 tuning하지 않는다.
  failure_reason: KL 증분 CI가0을 포함하고accuracy도 개선되지 않았다. Weight entropy/step schedule만으로 latent coverage와 predictive fit을 보장할 수 없으며 고유 원인은 미분리다.
  reason_status: unknown
  closed_scope: 같은64particles/8stages/학습된reverse kernel을 유지하고32-step bisection으로incremental ESS≥.8K의β를 택한뒤 마지막stageβ=1을 강제하는 controller.
  not_closed: Rényi Neural Processes의 variational objective는 실행하지 않았다. 모든 Rényi divergence/entropy 활용,다른SMC bridge/step budget·posterior inference를 기각하지 않는다.
  reopen_when: Weight entropy와 label-predictive joint mode error의 관계를 분리하고,같은 particle/latency budget에서 ESS 외의 필요한 정보를 이용하는 제어 연산이 생길 때.
  comparison_floor: 동일proposal/potential의fixed schedule,ordinary Gibbs-SMC,exact frozen-model reference와accuracy를유지한다. Adaptive extra overhead를 포함한다.
  recheck: 새graph에서fixed-ESS controller 차이를posterior fit/분류/시간으로나누어검증한다. 최종ESS상승을성공으로대체하거나RNP논문방법을실행했다고부르지않는다.
