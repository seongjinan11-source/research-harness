  - id: FP03-P01
    kind: preserved
    claim: 동일 candidate 확률에서 context로 계산한 가중치는 uniform prior보다 유용했다.
    observation: None accuracy adaptive60.910% 대uniformprior35.269%로+25.641%p다. MeanNLL은fixed-edge1.62348에서adaptive1.33772로낮아졌지만Brier와accuracy는악화했고NLL이득은균일하지않다.
    do_not_claim: 강한fixed-edge/LP우위,일반calibration해결,참homophily posterior,stablefeatureutility나새PFN학습성과가아니다.1rep/1seed개발효과를독립통계검증으로확대하지않는다.
