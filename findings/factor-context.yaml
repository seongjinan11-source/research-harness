  - id: FP03-L01
    kind: lesson
    claim: Best-single candidate는convex mixture의상한이아니고,실제parent함수가후보군에포함되는지별도로확인해야한다.
    observation: CiteSeer bestsingle41.834% 대oldfull52.898%는coverage경고지만모든mixture상한을증명하지않는다.실제PubMed adaptive NLL1.07710은best-single1.09861보다낮다. Oldfull의learned pair-specificJ와denseBP는새scalar/rank-oneJ와MF로표현되는endpoint가아니다.
    interpretation: 가중치오차와새potential/근사변경을동일한원인으로설명하지않는다.동일operator의실제endpoints를보존한통제가필요하다.
    tags: [eval-protocol, graph-structure-use, uncertainty]
    keywords: [mixture bound, best single, operator containment, prediction sensitivity, paired inference]
