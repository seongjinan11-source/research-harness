- id: RFILL-L01
  kind: lesson
  claim: 분산 맞춤 null을 완전히 무정보 random baseline이라고 부르지 않는다.
  observation: Iid/graph-prior variance-matched null에는 원래 conditional variance 정보가 남는다. Unit-noise에는 missing proposal의
    관측값 정보가 없지만 실제 관측 위치의 값은 여전히 PFN에 제공한다. Null 우위/동등성을 전체 observed feature의 무용함으로 확대하지 않는다.
