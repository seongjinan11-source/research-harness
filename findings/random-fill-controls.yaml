entries:
- id: RFILL-F01
  kind: failure
  claim: 현재 frozen conditional Gaussian completion이 분산을 맞춘 random-fill/graph-prior null보다 안정적으로 좋은 예측을 제공한다.
  observation: 'uniform: Conditional0.91589, iid-matched0.91367, graph-prior-matched0.91325, iid-unit0.91305, wrong-sign0.91511;
    clustered: Conditional0.91352, iid-matched0.91728, graph-prior-matched0.91166, iid-unit0.91666, wrong-sign0.91460;
    Conditional−iid matched +0.00222 [-0.00277, +0.00718] / -0.00376 [-0.00973, +0.00184]; Conditional−graph prior
    matched +0.00265 [-0.00076, +0.00626] / +0.00186 [-0.00105, +0.00512]'
  verdict: 사전 random-control gate 미통과; 현재 frozen conditional의 독립 가치 미입증
  failure_reason: 동일 관측 입력·checkpoint·분산/forward-budget 대조에서 요구한 conditional law 우위가 없었다. 관측값에 조건화한 복원, 구조 random
    feature, 확률 smoothing의 원인별 기여를 완전히 식별한 결과는 아니다.
  reason_status: unknown
  excluded_explanations:
  - Null은 분산·동일 PFN 호출 수를 맞췄다. 이것이 정확한 true posterior 또는 모든 feature law에 대한 대조를 뜻하지는 않는다.
  closed_scope: 현재 zero-input-trained PFN과 Gaussian surrogate를 실제 feature posterior의 메인 메소드로 확대하는 것
  not_closed: 실제 관측 피처의 직접 효용·context-conditioned feature-law 학습·shared suffix·coherence 일반은 평가하지 않았다. 분산 맞춤 null에는
    second-moment 정보가 남고 unit null에는 실제 값 clamp가 남는다.
  reopen_when: Context와 관측 피처가 joint feature law에 제공하는 추가 정보를 proper feature score와 실제 query improvement로 입증하고,
    같은 예산의 random/구조 입력보다 좋은 연산이 나올 때.
  comparison_floor: Variance-matched iid/graph prior, iid unit, zero/PCFI/FISF 입력 및 같은 예산·별도 학습의 강한 PFN. 실제 관측 입력
    직접 경로와 proposal 경로를 구분.
  recheck: 새 학습 가설을 source/data/budget 고정 후 별도 bank에서 비교한다. Label-blind law 대조와 true-label-context conditional-law
    증분을 분리하며 query labels를 forward에 사용하지 않는다.
