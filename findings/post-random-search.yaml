project: Random-fill controls 이후의 문헌 기반 후보 선별
date: '2026-11-02'
source: findings/post-random-search.yaml
setting: "문헌 원문과 기존 실패의 범위를 대조한 연구 제안. 새로운 GPU 학습·성능 결과가 아니다."
related: [PFNSeparability, StructuralMissingPFN, TabImpute, GSPN, Ephris, GNNmim]
entries:
  - id: NEXT-L01
    kind: lesson
    claim: "Missing PFN·flow posterior·separable prior·tractable marginalization 자체를 새 발명이라고 제안하지 않는다."
    observation: "StructuralMissingPFN은 incomplete context의 direct prediction과 auxiliary flow posterior를 이미 제시한다. PFNSeparability는 feature SCM과 label SCM을 독립적으로 뽑는 원리도 명시한다. GSPN은 모델 내 missing-variable marginalization을 제공한다. 새로운 적용이나 구현만으로 novelty가 확보되지 않는다."
    tags: [prior-mismatch, amortized-inference, observation-mask, theory-gap]
    keywords: [separability, direct incomplete prediction, flow posterior, tractable marginalization, novelty overlap]
    source_refs:
      - papers/PFNSeparability.yaml
      - papers/StructuralMissingPFN.yaml
      - papers/GSPN.yaml
    evidence: "각 논문의 본문에서 직접 확인한 선행연구 중복"
  - id: NEXT-U01
    kind: untested
    claim: "그래프·feature 생성 방식과 label rule의 coupling을 바꾸는 mechanism-crossed graph prior"
    observation: "현재 1순위 연구 후보지만 독립 SCM 원리 자체는 선행연구다. 단순 pairing 순서가 아닌 생성 joint distribution을 바꾸고 같은 Mask Plain 구조·학습량으로 비교해야 한다. REG-F01은 finite bank의 재가중 실패여서 이 후보를 실행해 실패한 결과가 아니다. RFILL-F01이 이 coupling을 실패 원인으로 입증한 것도 아니다."
    proposed_operator: "nu~p(nu), psi~p(psi), omega~p(omega); (G,X)~p_nu; Y~p_psi(Y|G,X); M~p_omega(M|G)로 시작한다. 다양한 nu와 psi를 독립 재조합하고 incomplete-input query CE로 학습한다. Mask가 값·label에 의존하는 MNAR은 첫 대조와 분리한다."
    unresolved: "그래프 조건부 prior의 형식적 separability와 유효 정보량은 따로 확인해야 한다. Missing feature의 marginal predictive는 feature law에도 의존하므로 'unlabeled feature가 필요 없다'는 결론을 가져오지 않는다. 독립 noise parameter를 뽑는 것만으로 induced laws가 독립이 되는 것도 아니다."
    comparison_floor: "동일 초기화·update·총 task 수의 기존 prior, crossed prior의 unpaired task 대조, zero+mask PFN, PCFI/FISF-trained PFN, 같은 4-view random-fill. Ephris 및 GNNmim은 입력·학습 regime 차이를 명시한 별도 baseline이다."
    recheck: "먼저 기존 generator가 실제로 어떤 induced coupling을 갖는지 확인한다. 새 prior의 feature 필요성은 generator 수준에서 보장하거나 측정하고, 모델이 실측값을 이용하는지는 no-observed/shuffled-observed 대조로 별도 평가한다. 기존 개발 bank 외 새 graph seeds·held-out 생성 조합과 dense raw-feature real graph에서 NLL/Brier/accuracy를 모두 확인한다."
    tags: [prior-mismatch, pretraining-data, compositional-generalization, observation-mask]
    keywords: [mechanism crossed prior, independent SCM, feature label coupling, task recombination, graph missing features]
    source_refs:
      - papers/PFNSeparability.yaml
      - findings/reference-regret.yaml
      - findings/random-fill-controls.yaml
    evidence: "기존 실패와 다른, 아직 실행하지 않은 prior 설계 가설"
  - id: NEXT-U02
    kind: untested
    claim: "Observed-cell 집합과 원래 graph를 직접 처리하는 sparse observation GraphPFN"
    observation: "숫자 completion을 생성하지 않고 (node,feature,value) 관측 token과 context-label token을 원래 graph에 연결한다. GRAPE의 관측 bipartite 표현과 Ephris의 sparse ICL과 겹치므로 단순 tokenization 조합은 novelty가 약하다. 성능·연산 예산을 동시에 확인할 보조 후보로 남긴다."
    proposed_operator: "Shared feature encoder로 관측 cell만 표현하고 original-edge message passing과 observation-node interactions로 query representation을 만든다. Missing cells를 샘플이나 pseudo-observation으로 추가하지 않는다."
    unresolved: "관측 source 보존이 예측 증분을 주는지는 미입증이다. SRC-F01의 출처 covariance 보정 실패와 BIND-F01의 hard common-support 실패를 새 방법으로 다시 포장하지 않는다. 관측 row가 거의 없으면 sparse 표현만으로 정보를 만들 수 없다."
    comparison_floor: "동일 prior·학습량·파라미터의 dense zero+mask PFN, GRAPE식 encoder의 meta-trained 대조, Ephris, strong PCFI/FISF 입력. 새 graph별 학습은 허용하지 않는다."
    recheck: "관측 node 수·거리·feature 폭을 분리하고 unseen graph와 동일 비용에서 관측 token 표현의 이득을 확인한다. Existing source covariance head를 재실행하는 실험이 아니다."
    tags: [observation-mask, tokenization, graph-structure-use, inference-cost]
    keywords: [sparse observation tokens, GRAPE, observed cells, no imputation, Ephris]
    source_refs:
      - papers/Ephris.yaml
      - findings/source-error.yaml
      - findings/binding-product.yaml
    evidence: "문헌과의 중복을 명시한 미실행 대안"
    external_refs:
      - https://snap.stanford.edu/grape/
  - id: NEXT-U03
    kind: untested
    claim: "Sampling 대신 tractable circuit으로 missing variables를 소거하는 prior-fitted graph predictor"
    observation: "확률 circuit의 query conditional을 synthetic tasks에서 학습하는 고위험 후보다. GSPN의 exact local marginal과 conditional SPN은 기존 방법이므로 PFN을 붙였다는 사실만으로 새 메소드가 되지 않는다."
    proposed_operator: "유효한 circuit C에서 p(Y_q=c|e)=C(e,Y_q=c)/sum_a C(e,Y_q=a)를 계산한다. Missing leaf를 적분하며, task별 adaptation과 가변 feature/class를 지원하는 circuit 설계가 추가로 필요하다."
    unresolved: "Cyclic graph에서 locally valid circuit과 global joint를 구분한다. 같은 원본 관측을 복제한 두 scope를 곱하면 decomposability가 깨질 수 있다. X_obs를 이용해 circuit parameter까지 바꾸면서 하나의 고정된 joint를 정확히 적분했다고 주장하지 않는다. 표현력·동적 scope·비용 모두 미해결이다."
    comparison_floor: "GSPN, conditional SPN, direct Mask Plain PFN, 4-view random-fill, known-family에서는 Grid6. Circuit validness와 scope 검증을 성능보다 먼저 확인한다."
    recheck: "작은 유효 circuit에서 열거와 marginal 결과를 대조하고, 같은 family의 direct predictor가 못하는 predictive/비용 이득이 있는 경우에만 graph 확장을 검토한다."
    tags: [differentiable-reasoning, uncertainty, observation-mask, model-based-baseline]
    keywords: [probabilistic circuit, GSPN, exact local marginal, decomposability, dynamic scope]
    source_refs:
      - papers/GSPN.yaml
    evidence: "원리와 주요 구현 장애를 함께 기록한 미실행 대안"
    external_refs:
      - https://ml-research.github.io/papers/shao2022ijar.pdf
