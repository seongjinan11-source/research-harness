id: context-conditioned-feature-belief
date: '2026-11-02'
text: Synthetic graph prior에서 context labels에 조건화한 joint feature law를 학습하고 observed
  encoder와 hypothesis suffix를 공유한다. Martingale coherence는 알려진 학습 원리로 취급하며, valid conditional
  sampling·feature-law 식별·stochastic coarse estimator의 독립 replica·동일 비용 대조를 검증한다.
  새 학습은 아직 미실행이다.
