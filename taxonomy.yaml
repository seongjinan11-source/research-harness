# 강점(strengths)과 한계(limitations)에 공통으로 붙이는 태그.
# 같은 태그가 A의 한계이면서 B의 강점이면 "A + B" 접목 후보가 된다.
# 새 태그가 필요하면 여기에 먼저 추가하고 쓴다. (build 시 미등록 태그는 경고)

areas:
  graph-fm: 그래프 foundation model
  graph-learning: 그래프 표현학습·GNN·그래프 기반 clustering
  heterogeneous-graphs: 이종 노드·관계 그래프 표현학습
  knowledge-graphs: 지식그래프 embedding·시간적 추론
  single-cell: 단일세포 표현학습·clustering
  pfn: Prior-data fitted network / in-context learning on synthetic priors
  tabular-fm: 테이블 foundation model
  tsfm: 시계열 foundation model
  mvts: 다변량 시계열
  bo: Bayesian optimization
  eda: 반도체 / EDA
  ml-foundations: ML 근본론 (scaling, ICL 이론, 일반화 등)
  benchmark: 벤치마크·평가·분석 연구
  survey: 서베이
  neurosymbolic: 신경망과 기호 프로그램·논리 추론의 결합

tags:
  # --- 데이터 / 사전학습 ---
  prior-mismatch: synthetic prior와 실제 데이터 분포 사이의 간극
  pretraining-data: 사전학습 데이터의 양·다양성·구성에 대한 의존
  eval-protocol: 벤치마크 누수(사전학습 데이터와 평가셋 중복), 평가 protocol·baseline 공정성
  # --- 규모 / 비용 ---
  context-scale: context(학습 샘플 수, 노드 수, 시계열 길이)가 커질 때의 메모리·성능 한계
  inference-cost: 추론·학습 비용, latency
  # --- 입력 이질성 ---
  feature-heterogeneity: 데이터셋마다 다른 feature 차원·의미를 하나의 모델로 다루는 문제
  label-space: 지원 클래스 수·라벨 공간 제약
  label-imbalance: context 라벨 분포 불균형
  selection-bias: 라벨 노드·context가 community·차수 등 구조를 따라 편향되게 선택되어 생기는 손실과 그 보정
  label-shift: 집단·도메인별 클래스 사전확률 변화의 추정과 출력 쪽 prior 보정(label-shift EM, calibration)
  group-offset: community·batch·도메인 단위 feature offset과 클래스 구성의 교락, 그 offset 아래 클래스 원형 추정
  # --- 그래프 ---
  graph-structure-use: 그래프 구조를 쓰는 방식 (heterophily, long-range, message passing 한계)
  graph-scale: 대규모 그래프 처리
  heterogeneous-semantics: 노드·관계·사건 타입에 따른 의미와 표현의 구분
  meta-paths: 이종그래프에서 meta-path의 선택·구성·인코딩
  contrastive-learning: positive·negative 구성과 contrastive objective
  multi-view-fusion: 여러 표현 view의 융합·상호 보완
  llm-semantics: LLM으로 생성·추출한 의미 정보의 활용과 의존성
  graph-geometry: 그래프의 기하·곡률·계층적 embedding 구조
  structural-imbalance: 연결 성분 크기·차수 등 그래프 구조의 불균형
  temporal-kg: 시간적 지식그래프의 사건 이력과 미래 fact 추론
  graph-distillation: GNN의 예측·표현을 student 모델로 증류하는 방법
  feature-reweighting: 입력 feature의 적응적 가중치 조절
  graph-sparsification: edge budget 아래 그래프 희소화·부분그래프 구성
  # --- 시계열 ---
  channel-dependency: 변수 간 의존성 모델링 (channel-independent 가정 포함)
  covariates: 외생 변수·covariate 활용
  context-horizon: 입력 context 길이·예측 horizon 제약
  nonstationarity: 분포 변화, regime shift, 오래된 history 처리
  tokenization: patching·tokenization·입력 표현 설계
  # --- 추론 / 학습 설계 ---
  auxiliary-loss: 보조 loss·component 감독(posterior, conditional 등)이 최종 예측 개선으로 이어지는지
  amortized-inference: 학습된 posterior·evidence head(amortization)와 exact·명시적 추론의 관계
  distribution-shift: 학습 분포 밖 조건(밀도·signal 외삽, 새 그래프 bank 등)으로의 일반화
  observation-mask: 관측 안 된 값과 관측된 0(nonedge 등)의 구분, 결측·관측 과정 처리
  model-based-baseline: 알려진 family·prior를 쓰는 명시적 추론 기준선(grid posterior 등)과의 비교
  program-synthesis: 예제로부터 실행 가능한 프로그램을 찾거나 program sketch를 채우는 방법과 제약
  library-learning: 여러 태스크의 해에서 재사용 가능한 함수·추상화 라이브러리를 학습하는 방법과 제약
  differentiable-reasoning: 기호·논리 추론을 통해 확률과 gradient를 계산하는 방법과 제약
  compositional-generalization: 학습한 구성요소를 새로운 조합·길이·추론 사슬에 재사용하는 일반화
  # --- 일반 ---
  task-coverage: 지원 태스크 범위 (예측만, 분류만 등)
  zero-shot-gap: zero-shot 성능, fine-tuning·probe 의존도
  adaptation: fine-tuning·적응 방법과 비용
  uncertainty: 확률적 예측, calibration
  information-consistency: nested 관측에서 추가 정보 이후 예측의 조건부 평균과 이전 예측의 일관성(martingale consistency), 단순 view 일치와의 구분
  training-stability: 사전학습·fine-tuning의 안정성, seed 간 변동
  robustness: irrelevant context·noise·adversarial 입력에 대한 민감도
  interpretability: 해석 가능성
  theory-gap: 왜 작동하는지에 대한 이론적 설명

  # SSP size/composition와 문헌 근거
  subset-cardinality: Subset의 size/count 변화와 그 효과 모델링
  nuisance-separation: Nuisance 효과와 관심 composition 추정의 분리 및 정보 공유
  identifiability: 관측 구조와 가정 아래 parameter·contrast의 식별 가능성
  experimental-design: 제한된 관측 예산에서 정보와 추천을 위한 입력 선택
  decision-regret: 실제 추천·선택의 손실과 추정 지표의 관계
  modular-inference: 모듈 사이 Bayesian feedback의 유지·차단·조절
  robustness-radius: Fitted 결정이 바뀌는 perturbation 크기와 그 한계
  sparsity-prior: 계수 희소화를 유도하는 prior와 dense 공유 구조의 적합성
  basis-dependence: 기저·parameterization에 따라 달라지는 함수 sparsity와 추정
  low-rank-interactions: Latent factor를 공유하는 low-rank interaction 모델
  known-cost-separation: 알려진 비용·penalty를 surrogate 학습에서 분리해 정확히 처리
