id: LAVA
title: A lava attack on the recovery of sums of dense and sparse signals
authors: Victor Chernozhukov, Christian Hansen, Yuan Liao
venue: arXiv
year: 2015
links:
  paper: https://arxiv.org/abs/1502.03155v2
citation:
  type: misc
  title: A lava attack on the recovery of sums of dense and sparse signals
  authors:
  - Victor Chernozhukov
