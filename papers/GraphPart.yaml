citation:
  type: article
  title: "Partition-Based Active Learning for Graph Neural Networks"
  authors: ["Jiaqi Ma", "Ziqiao Ma", "Joyce Chai", "Qiaozhu Mei"]
  year: 2023
  journal: "Transactions on Machine Learning Research"
  arxiv: "2201.09391"
  url: https://openreview.net/forum?id=e0xaRylNuT
  verified_from:
    - https://jmlr.org/tmlr/papers/
    - https://arxiv.org/abs/2201.09391
areas: [graph-learning]
problem: "라벨 예산이 정해진 one-step batch-mode active learning에서, GNN 노드 분류의 오차를 가장 줄이려면 어떤 노드들의 라벨을 한 번에 요청해야 하는지를 묻는다."
core_idea: "저자들은 실제 그래프의 community 구조에 착안해, 라벨 분포가 그래프 전체가 아니라 각 partition 안에서만 매끄럽다는 약한 label smoothness 가정을 둔다. 이 가정과 MLP의 Lipschitz 가정 아래, test 노드의 기대 오차가 같은 partition 안에서 aggregated feature 공간상 가장 가까운 학습 노드까지의 거리와 그 노드의 margin loss로 위에서 묶인다는 bound를 얻는다. 이를 최소화하도록 GraphPart는 Clauset-Newman-Moore modularity 최대화로 그래프를 K개 partition으로 나누고(라벨 없이 elbow로 K 결정), partition마다 예산을 b//K로 나눠 aggregated feature(2층 GCN이면 S²X) 위 K-Medoids로 대표 노드를 고른다. GraphPartFar는 앞서 다른 partition에서 고른 노드와 가까운 후보에 벌점을 주어 partition 간 중복을 줄인다."
key_assumptions:
  - "라벨 분포가 graph partition(community) 안에서는 매끄럽고 partition 사이에서는 급변할 수 있다고 가정한다(Assumption 1)."
  - "GNN을 aggregation g와 Lipschitz MLP h의 합성으로 볼 수 있다고 본다. GCN은 기존 결과로 근사적으로 포함한다."
  - "Seed 라벨 없이 한 번에 예산 전체를 고르는 one-step 설정이며, validation 라벨이 없어 hyperparameter를 튜닝할 수 없다고 본다."
strengths:
  - text: "추가 hyperparameter가 없다. Partition 수 K도 라벨 없이 elbow로 정하므로 validation 라벨이 없는 active learning 상황에 맞는다."
    tags: [experimental-design]
  - text: "Label smoothness를 partition 안에서만 요구해 Coreset·FeatProp의 전역 smoothness 가정보다 약하고, 그들의 증명에 숨어 있던 '선택된 학습 노드의 라벨 분포가 한 클래스에 몰린다'는 비현실적 가정을 제거했다(대신 margin loss 항이 추가된다)."
    tags: [experimental-design, theory-gap]
  - text: "7개 benchmark와 GCN·GraphSAGE·GAT에서 Random, Uncertainty, Density, CoreSet, Degree·PageRank centrality, AGE, FeatProp보다 넓은 예산 범위에서 Macro-F1이 높았다. Partition 단계는 aggregated feature, embedding, 원 feature 어느 거리와 결합해도 효과가 있었고 seed 간 표준오차도 줄였다."
    tags: [experimental-design, selection-bias]
  - text: "학습 노드에서 먼 test 노드일수록 정확도가 떨어지는 accuracy disparity를, 무작위 선택보다 대부분의 데이터셋에서 줄였다. 라벨을 community마다 고르게 퍼뜨리는 것이 원거리 노드 성능에 직접 도움이 된다는 증거다."
    tags: [selection-bias, structural-imbalance]
limitations:
  - text: "FeatProp 등 선행 연구와 마찬가지로, 효과가 데이터에서 smoothness 가정이 성립하는지에 달려 있다."
    tags: [graph-structure-use, theory-gap]
    source: self
  - text: "클래스가 많은 Corafull·Arxiv에서는 작은 예산에서 일부 클래스가 아직 선택되지 않아 FeatProp과의 차이가 예산 160 이상에서야 유의해졌다. Arxiv에서는 예산 320을 넘으면 Micro-F1 차이가 사라지고 Macro-F1에서만 우위가 남았다."
    tags: [label-space, experimental-design]
    source: self
  - text: "Active learning 절차가 학습 데이터 구성에 편향을 들여올 수 있으며, accuracy disparity 외의 fairness 지표(equal opportunity 등)에 대한 영향은 따로 조사해야 한다고 저자들이 밝힌다."
    tags: [selection-bias]
    source: self
  - text: "[analyst] Partition마다 예산을 b//K로 똑같이 나누고 partition 크기나 클래스 구성은 고려하지 않는다. 그래서 클래스 균형을 보장하지 않으며, 선택 정책을 바꿀 수 있는 경우의 처방이다. 라벨 위치가 이미 주어진 편향 선택을 사후에 보정하는 방법은 아니다."
    tags: [experimental-design, label-imbalance, selection-bias]
    source: analyst
builds_on: [FeatProp, CoreSet, ClausetNewmanMoore, KMedoids]
compared_against: [Random, Uncertainty, Density, CoreSet, DegreeCentrality, PageRankCentrality, AGE, FeatProp]
open_questions:
  - "Partition별 예산을 크기·불확실성·클래스 구성에 맞춰 배분하면 더 나아지는가? 현재는 균등 분할이다."
  - "Community coverage 이득과 partition 안 대표성(medoid) 이득을 분리하는 ablation이 없다. 각 community에서 무작위로 하나씩 고르는 것과 비교하면 어느 쪽이 더 기여하는가?"
hooks:
  - "(BSEL commconc의 반대 정책, 예산 대조) commconc는 클래스마다 소수 community에 context를 몰아 뽑고, GraphPart는 정확히 반대로 모든 community에 예산을 퍼뜨린다. BSEL-P05의 do_not_claim이 'GraphPart, LoGIC 대비 능동 선택 비교는 안 했다'고 명시하므로, 같은 예산 25%(CiteSeer 60개, Cora 70개)에서 L-uncov(+5.1/+2.8, 덮이지 않은 community에 라벨 추가)와 GraphPart식 medoid 선택을 나란히 두면 그 빈칸이 채워진다. GraphPart의 open question인 'coverage 대 medoid 대표성' 분해도 같은 표에서 함께 답할 수 있다."
  - "(손실의 coverage 몫 추정) GraphPart의 bound는 같은 partition에 학습 노드가 없으면 성립하지 않는다. 이는 BSEL-F04 failure_reason의 '클래스 질량 65–92%가 context 없는 community에 있다'와 같은 구조다. 같은 크기에서 commconc, uniform, GraphPart context를 GraphPFN에 넣어 비교하면 손실 중 coverage로 설명되는 몫을 잴 수 있다. 이는 O-info(정책과 무관한 무작위 라벨, SRec 0.72/0.82)를 보완하는 하한이다."
notes: "게재 정보는 TMLR 공식 논문 목록(jmlr.org/tmlr/papers)에서 확인했다(2023년 4월, OpenReview forum e0xaRylNuT, Survey certification 표시). OpenReview 페이지 자체는 bot challenge 때문에 읽지 못했다. volume·pages는 TMLR에 없다."
