id: GraphPart
title: "Partition-Based Active Learning for Graph Neural Networks"
authors: "Jiaqi Ma, Ziqiao Ma, Joyce Chai, Qiaozhu Mei (University of Michigan)"
venue: "TMLR 2023"
year: 2023
links:
