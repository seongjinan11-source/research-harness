problem: Additive nuisance 아래 treatment contrast를 효율적으로 추정하는 설계를 다룬다.
core_idea: Estimability와 block information을 분석하고 nuisance-resistant optimal design과
  작은 support의 구성을 다룬다.
key_assumptions:
- 본문의 모델·관측·입력 가정 안에서 해석하며 SSP의 count-dependent adaptive 정책으로 보장을 자동 이전하지 않는다.
strengths:
- text: Nuisance를 제거한 contrast information 및 설계의 직접 선행이다.
  tags: &id001
  - experimental-design
  - identifiability
  - nuisance-separation
limitations:
- text: Treatment indicator와 overlapping subset incidence는 같은 특수 설정이 아니며 SSP 손실은 별도
    평가가 필요하다.
