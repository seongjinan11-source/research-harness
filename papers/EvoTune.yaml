id: EvoTune
title: "Algorithm Discovery With LLMs: Evolutionary Search Meets Reinforcement Learning"
authors: "Anja Surina, Amin Mansouri, Lars Quaedvlieg, Amal Seddas, Maryna Viazovska, Emmanuel Abbe, Caglar Gulcehre (EPFL)"
