id: CorrectSmooth
title: "Combining Label Propagation and Simple Models out-performs Graph Neural Networks"
authors: "Qian Huang, Horace He, Abhay Singh, Ser-Nam Lim, Austin R. Benson (Cornell University / Facebook AI)"
venue: "ICLR 2021"
year: 2021
