areas: [benchmark, tsfm]
problem: "TSFM을 이상탐지에 쓸 때는 보통 복원 오차나 예측 오차가 큰 지점을 이상으로 본다. 그런데 이 zero-shot 방식이 한 줄짜리 통계 baseline보다 정말 나은지는 엄밀하게 검증된 적이 없다."
core_idea: "TSB-AD-U 평가 세트의 단변량 시계열 350개(23개 데이터셋)에서 VUS-PR로 평가한다. 대상은 복원 기반 MOMENT(base, large)와 예측 기반 Chronos-Bolt(small, base), TimesFM(1.0, 2.0), Time-MoE(base, large), 두 head를 가진 TSPulse이고, context 길이는 64, 256, 512다. 복원 모델은 window와 그 복원값의 MSE를, 예측 모델은 한 step 앞 예측의 제곱 오차를 anomaly score로 쓴다. 비교 대상은 파라미터가 없는 one-liner 두 종류다. 복원 모델에는 이동 window의 분산(Var-w)을, 예측 모델에는 직전 window 평균과 다음 값의 제곱 차이(Last-w, Centered-w)를 맞세운다. 평균 점수뿐 아니라 시계열별 점수 상관, Cohen's d, Wilcoxon non-inferiority 검정으로 둘이 사실상 같은 신호인지 확인한다. 이어서 왜 같아지는지를 분해해 설명하고, 앞으로의 방향으로 짧은·긴 horizon 예측의 결합, hidden representation 위의 이상탐지, labeled anomaly를 쓴 fine-tuning을 제안한다."
key_assumptions:
  - "TSB-AD-U의 단변량 시계열과 VUS-PR이 이상탐지 성능을 충분히 대표한다고 본다. Event-based F1은 부록에서 보조 확인용으로만 쓴다."
  - "zero-shot으로 복원·예측 오차를 그대로 점수로 쓰는 방식이 TSFM을 이상탐지에 쓰는 표준이라고 보고, 이 방식을 평가 대상으로 삼는다. fine-tuning이나 embedding 기반 사용은 결론의 범위 밖이다."
  - "예측 모델의 점수는 한 step 앞 예측 오차로 정의한다. horizon을 바꾸면 결과가 달라진다는 것은 별도 분석으로 다룬다."
  - "평균 점수가 비슷하고 시계열별 점수 상관이 0.9 이상이며 non-inferiority 검정을 통과하면 두 detector가 실질적으로 같다고 판정한다."
strengths:
  - text: "평균 점수만 비교하지 않고 시계열별 점수의 상관, effect size, 비열등성 검정까지 봤다. 모든 TSFM과 baseline 쌍에서 시계열별 VUS-PR 상관이 0.90 이상이었고, MOMENT-base-512와 Var-512는 평균 0.311 대 0.313, 상관 0.991이었다. 그래서 TSFM이 비슷한 점수를 낸다는 수준을 넘어 사실상 같은 신호를 낸다고 주장할 수 있었다."
    tags: [eval-protocol]
  - text: "복원 기반 점수가 왜 분산으로 무너지는지 메커니즘을 밝혔다. window마다 z-normalization을 하면 점수가 'window 분산 × 정규화된 window의 복원 MSE'로 분해된다. MOMENT의 정규화된 복원 MSE는 이상 포함 여부와 상관없이 약 1.1로 거의 일정해서 분산 항이 점수를 결정한다. Min-Max나 전역 정규화로 바꾸면 분산과의 상관이 줄어드는 ablation으로 원인을 확인했다."
    tags: [tokenization, interpretability]
  - text: "예측 기반 점수의 실패 원인도 설명했다. sliding window가 sequence anomaly 안으로 들어가면 context가 이미 이상한 값을 담고 있어서, 모델이 다음 이상값을 잘 맞혀 버리고 오차가 작아진다. 한 사례에서 TimesFM-1.0-512의 VUS-PR은 sequence anomaly에서 horizon 1일 때 0.04, 128일 때 0.68이었고, point anomaly에서는 반대로 1.0에서 0.02로 떨어졌다. TSB-AD가 보고한 'point anomaly에는 강하고 sequence anomaly에는 약하다'는 현상을 설명하는 근거다."
    tags: [context-horizon, task-coverage, nonstationarity]
  - text: "결론이 특정 설정의 우연이 아님을 보였다. 다섯 계열, 여러 모델 크기, context 길이를 모두 바꿔도 결과가 같았고, 모델을 키워도 정상 구간과 이상 구간의 복원이 함께 좋아질 뿐 오차 차이는 벌어지지 않았다. MOMENT 사전학습에 들어가지 않은 데이터셋만 따로 봐도 같은 현상이 나타나 데이터 오염으로 설명되지 않는다는 점도 확인했다."
    tags: [context-horizon, pretraining-data, eval-protocol]
  - text: "benchmark 자체도 점검했다. TSB-AD-U에서 라벨이 문제인 시계열 50개를 찾았고, VUS-PR이 순위만 보기 때문에 미세한 수치 흔들림이 큰 점수 차이로 증폭되는 사례를 보였다. 집계 지표만 보지 말고 데이터와 점수 곡선을 직접 시각화하라는 권고로 이어진다."
    tags: [eval-protocol]
  - text: "앞으로의 방향을 초기 증거와 함께 제시했다. 한 시계열에서 MOMENT의 복원 오차는 VUS-PR 0.003으로 32개 detector 중 31위였지만, 같은 모델의 hidden representation에 kNN을 적용하자 0.250으로 5위까지 올랐다. TSFM 표현 자체는 쓸모가 있고 쓰는 방식이 문제라는 점을 보여준다."
    tags: [zero-shot-gap, interpretability]
limitations:
  - text: "주 실험은 단변량에 한정된다. 저자들은 TSFM 대부분이 단변량 입력만 기본 지원하기 때문이라고 설명했다. channel 간 의존성을 다루는 Chronos-2와 Toto 1.0은 부록에서 정성적 결과만 보였고, 주 결론과 맞아떨어진다고만 적었다."
    tags: [channel-dependency]
    source: self
  - text: "hidden representation 위의 kNN이 오차 기반 점수보다는 낫지만, 같은 시계열에서 KMeansAD 같은 전용 detector가 여전히 더 높다고 저자들이 밝혔다. labeled anomaly로 fine-tuning하는 방향은 범위 밖이라고 명시하고 실험하지 않았다."
    tags: [zero-shot-gap, adaptation]
    source: self
  # cited: 이 논문을 인용하면서 한계를 지적한 후속 논문은 찾지 못했다. 확인한 후보(ChronosAD, AnomSeer, TimeRadar, A Comparative Study of Adaptation Strategies for TSFMs in AD)는 이 논문을 인용하지 않거나 비판 문장이 없었다.
  # review: OpenReview forum(https://openreview.net/forum?id=H27kvyG4qf)이 인증 화면만 돌려줘서 리뷰 본문을 확인하지 못했다. 미기재.
  - text: "[analyst] 제안한 세 방향의 근거는 대부분 개별 사례다. horizon 결합은 사례 두 개와 일부 집계 결과, hidden representation은 시계열 한 개의 결과이고, fine-tuning은 제안만 있다. 그래서 TSFM을 다르게 쓰면 전용 detector를 이길 수 있는지는 아직 열려 있다. 논문이 확실히 보인 것은 '현재 방식은 안 된다'까지다."
    tags: [zero-shot-gap, adaptation]
    source: analyst
  - text: "[analyst] TSPulse 결과는 직접 돌리지 않고 원 논문의 수치를 가져왔다. context 길이도 512 하나뿐이다. 다른 네 계열과 전처리·평가 설정이 완전히 같다고 보기 어려우므로, TSPulse에 대한 결론은 다른 계열보다 약하게 읽어야 한다."
    tags: [eval-protocol]
    source: analyst
builds_on: [TSB-AD]
compared_against: [MOMENT, Chronos-Bolt, TimesFM, Time-MoE, TSPulse, Chronos-2, Toto]
open_questions:
  - "Chronos-2처럼 channel 간 attention을 쓰는 모델도 정량 평가에서 one-liner로 무너지는가. cross-channel 정보가 분산 붕괴를 피하게 해 주는가."
  - "zero-shot 전이를 해치지 않으면서 window의 scale 정보를 살리는 정규화가 있는가. 분산 붕괴는 정규화를 바꾸면 사라지는가, 아니면 다른 형태로 남는가."
  - "TSFM hidden representation 위의 detector가 대규모 평가에서 KMeansAD 같은 전용 detector를 이길 수 있는가."
  - "label 없이 horizon을 고르거나 결합하는 원칙적인 방법은 무엇인가. point anomaly와 sequence anomaly 사이의 trade-off를 어떻게 다룰 것인가."
hooks:
  - "MVTS 이상탐지 방향의 모든 실험에 Var-w와 Last-w를 sanity baseline으로 넣어야 한다. 더 나아가 '새 detector의 시계열별 점수가 one-liner와 0.9 이상 상관되면 새 정보가 없다'는 진단을 그대로 빌려 쓸 수 있다. 리뷰어가 가장 먼저 던질 질문을 미리 막는 장치다."
  - "실패 원인이 'context가 이상 구간을 흡수해 버린다'는 점이므로, alarm triage에서는 반대로 이용할 수 있다. 경보 구간 이전의 context만으로 긴 horizon 예측을 만들고 경보 구간과 비교하면, 이상이 context에 섞이지 않은 상태에서 경보를 반증하거나 확인하는 근거가 된다. TSFM을 detector가 아니라 반증 도구로 쓰는 셈이다."
  - "context가 이상 구간을 빠르게 흡수하는 현상은 nuisance-context·regime shift 연구의 거울상이다. 이상탐지에서는 새 패턴에 너무 빨리 적응하는 것이 실패지만, regime shift 뒤 예측에서는 obsolete history를 빨리 버리는 것이 성공이다. 같은 모델이 context 안의 변화에 얼마나 빨리 적응하는지를 하나의 지표로 재면, 두 연구를 같은 축 위에서 설명할 수 있다."
