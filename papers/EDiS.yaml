problem: Sparse GNN 학습에서 고정 topology의 한계와 매 epoch 재추출하는 비용을 함께 줄이는 문제를 다룬다.
core_idea: '[본문 확인] 그래프를 한 번 edge-disjoint subgraph library로 분해해 저장한다. 매 epoch 이 library를 조합해 정확한 edge budget의 sparse
  view를 만들며, 기본 selector는 feature score와 successive maximum-score covering forest를 이용한다.'
key_assumptions:
- 분해와 조합이 가능한 관측 그래프 및 edge score를 제공해야 한다.
strengths:
- text: 구조 추출을 한 번 수행한 뒤 여러 budget과 epoch에서 cached decomposition을 재사용한다.
  tags:
  - graph-sparsification
  - inference-cost
- text: 동일 edge budget의 sparse view를 바꾸며 학습하고 cut-edge 보존을 조건부로 분석한다.
  tags:
  - graph-sparsification
  - graph-structure-use
limitations:
- text: Task-aware score, dynamic temporal composition, graph-/link-level prediction 확장을 향후 과제로 남겼다.
  tags:
  - task-coverage
  - nonstationarity
  source: self
