areas: [llm-rl, benchmark]
problem: "LLM 데이터 분석 agent가 코드는 정상 실행하면서도 데이터 가정에 맞지 않는 검정을 골라 p-value와 결론을 틀리는 문제를, 평가(P-Bench)와 검증 가능한 통계 보상을 쓴 RL 학습(Fisher-R1) 양쪽에서 다룬다."
core_idea: "P-Bench는 경제학·생물학·의학의 open-ended 가설검정 task 425개(Easy 203, Hard 222)로, 질문과 CSV만 주고 방법은 알려주지 않으며, 정답 키는 참조 코드를 실제로 실행한 로그에서 가져온다. 학습용으로는 LLM이 시뮬레이션 데이터 생성 과정을 작성하고 정해진 방법으로 분석한 결과를 정답 키로 쓰는 합성 task 8,642개를 방법·시나리오·표본 크기·효과 크기(null/borderline/medium)·힌트·seed의 격자로 만든다. Claude Sonnet 4.6 teacher trajectory를 걸러 SFT한 뒤 DAPO(G=8, 비대칭 clip, 분산 0인 group 제거)로 RL한다. 보상은 형식·실행 유효성 gate에 p-value를 z-scale(Φ⁻¹, 상한 5)로 바꾼 근접도 0.9와 기각 결정 일치 0.1을 곱한 형태이고, 방법 선택 자체에는 보상 항이 없다."
key_assumptions:
  - "전문가가 고른 참조 분석 하나의 p-value와 α=0.05 결정이 '타당한' 답이라고 본다. 여러 방법이 방어 가능한 경우에도 참조와의 근접도로만 평가한다."
  - "LLM이 쓴 시뮬레이션 DGP와 정해진 방법의 출력이 정답 키로 충분히 정확하며, 합성 분포에서 배운 방법 선택이 실제 데이터 task로 옮겨 간다고 가정한다."
  - "p-value 근접도(결과)만 보상해도 올바른 방법 선택(과정)이 따라 학습된다고 가정한다(outcome-grounded reward)."
strengths:
  - text: "보상을 결과값의 스케일에 맞게 설계했다. p-value는 0 근처에 몰려 차이가 안 보이므로 z-scale로 바꾸고 상한을 두어 비교하며, 연속 근접도와 이산 결정 일치를 섞고, 형식·실행 유효성을 곱셈 gate로 둔다. 정답 키가 있는 합성 환경 덕분에 외부 judge 없이 보상을 결정적으로 계산한다."
    tags: [reward-signal]
  - text: "평가에서 결정만 맞히는 Raw와 결정과 수치(|Δz|<0.5)를 함께 요구하는 Strict를 분리했다. GPT-5.4는 Hard에서 Raw 58.3, Strict 30.5로, 결론 방향은 맞아도 추정이 틀리는 경우가 많다는 것을 드러낸다."
    tags: [eval-protocol]
  - text: "7B ablation에서 SFT만 하면 pass@1이 거의 오르지 않고, DAPO만 해도 일부 오르며, 둘을 결합할 때 Easy·Hard Strict 모두 가장 좋다. 14B 모델은 Strict 4개 지표 중 3개에서 GPT-5.4보다 높다."
    tags: [adaptation]
  - text: "합성 학습 task와 P-Bench 사이에 embedding 유사도 기준 near-duplicate가 없음을 확인해 학습·평가 오염을 점검했다."
    tags: [eval-protocol, pretraining-data]
limitations:
  - text: "P-Bench는 task마다 가설검정 하나만 평가한다. 다중검정 보정을 포함한 여러 검정 pipeline으로의 확장은 향후 과제로 남겼다."
    tags: [task-coverage]
    source: self
  - text: "신뢰할 만한 통계 agent가 약한 주장에 거짓 정당성을 줄 수 있다는 이중 용도 위험을 인정하고, 인간 통계 검토의 대체가 아니라 평가·감독 도구로 공개한다고 밝혔다. 가정 정당화, 방법 선택의 불확실성 정량화, 단일 검정이 부적절한 경우의 인식은 향후 과제다."
    tags: [uncertainty, task-coverage]
    source: self
  - text: "[analyst] 보상에 방법 선택 항이 없어서, 부적절한 방법이라도 p-value가 참조와 비슷하면 보상을 받는다. 또 보상 구성요소(z-scale 변환, 결정 항 0.1, 상한 5)를 하나씩 뺀 ablation이 없어, 어느 설계가 이득을 냈는지 분리되지 않는다."
    tags: [reward-signal, eval-protocol]
    source: analyst
  - text: "[analyst] 평가가 425개 task에 모델당 3회 시행이고 Strict 허용치 0.5는 저자가 정한 값이다. 14B와 GPT-5.4의 Easy Strict 차이(64.2 대 64.7)처럼 근소한 차이는 이 표본에서 구분하기 어렵다."
    tags: [eval-protocol]
    source: analyst
builds_on: [DAPO, verl]
compared_against: [GPT-5.4, DeepSeek-V4-Pro, GPT-OSS-120B, Qwen3-Coder-30B, Qwen3-32B, Qwen2.5-Coder, DataMind]
open_questions:
  - "방법 선택에 대한 과정 보상을 넣으면 Hard에서 Strict가 더 오르는가, 아니면 여러 방법이 방어 가능하다는 점 때문에 오히려 해가 되는가?"
  - "합성 DGP 격자(표본 크기·효과 크기)의 구성이 학습된 방법 선택의 일반화를 얼마나 좌우하는가? 실제 데이터 교란(이분산, 군집 관측)으로의 전이는 어디서 끊기는가?"
hooks:
  - "(AHD 보상 스케일) Fisher-R1이 p-value를 z-scale로 바꾸고 상한을 두는 이유, 즉 값이 한쪽 끝에 몰려 차이가 사라지는 문제는 학습이 진행될수록 gap이 0 근처로 몰리는 AHD 보상에도 같은 형태로 나타난다. log-gap 변환과 상한을 CALM식 상대 Δ, 고정 baseline 차이와 같은 조건에서 비교하는 것이 사용자 노트의 보상 형태 비교 축과 맞닿는다. 다만 Fisher-R1의 보상은 task 하나의 정답과의 거리이고, AHD 보상은 소수 instance 위의 평균 목적값이라 instance 표본 잡음과 층 혼합이 추가로 섞인다는 점이 다르다(가설 수준의 대응)."
  - "(고정 instance 집합 대신 생성기) Fisher-R1은 정답 키를 계산할 수 있는 합성 DGP를 크기·효과 크기 격자로 생성해 학습한다. CALM처럼 OBP 4개·TSP 64개의 고정 집합으로 보상을 계산하는 대신 parametric instance 생성기와 작은 instance의 정확해로 보상을 만드는 방향(사용자 연구계획 방향 1)의 직접적인 설계 선례다. 하지만 Fisher-R1은 보상 잡음 자체를 분석하지 않으므로 선행 위협이 아니라 설계 참고로만 쓸 수 있다."
  - "(Raw vs Strict, 분산 0 group) Raw/Strict 분리는 AHD에서 실행·feasible 비율과 gap<τ 비율을 따로 보고하는 평가 형식으로 옮길 수 있다. DAPO의 분산 0 group 제거는 사용자 dev 관찰에서 parent와 동작이 같은 자식 비율이 OBP 47–50%, TSP 33%였던 점과 연결된다. 그런 group이 많으면 유효 학습 신호가 줄어드는데, 이 영향이 OBP와 TSP에서 다를 수 있다는 것은 아직 검증하지 않은 가설이다."
