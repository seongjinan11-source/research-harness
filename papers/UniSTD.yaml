problem: 최종 logits나 고립된 hidden state만 맞추는 증류가 teacher의 layer-wise 표현 변화를 충분히 전달하지 못하는 문제를 다룬다.
core_idea: '[출판사 초록·공개 발췌 확인; 전체 본문 미확인] Raw·propagation-enhanced·fused view를 shared MLP에 입력한다. Response·trajectory·velocity
  distillation과 view consistency를 조합해 teacher의 상태와 층간 변화 경향을 전달한다.'
key_assumptions:
- Teacher의 여러 층 표현과 그래프 전파로 보강한 feature를 구성할 수 있어야 한다.
strengths:
- text: Teacher의 hidden-state 순서와 층간 transition 경향을 함께 증류한다.
  tags:
  - graph-distillation
  - auxiliary-loss
- text: 배포된 MLP forward에서 graph access를 요구하지 않도록 설계했다.
  tags:
  - inference-cost
  - graph-distillation
limitations:
- text: '[analyst] Method는 예측 전에 입력 feature를 만들거나 갱신하기 위한 graph propagation이 남을 수 있다고 명시한다. Graph-free forward와
    전체 파이프라인의 graph-free 비용을 구분해야 한다.'
