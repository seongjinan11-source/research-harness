id: Moirai-MoE
title: "Moirai-MoE: Empowering Time Series Foundation Models with Sparse Mixture of Experts"
authors: "Xu Liu, Juncheng Liu, Gerald Woo, Taha Aksu, Yuxuan Liang, Roger Zimmermann, Chenghao Liu, Junnan Li, Silvio Savarese, Caiming Xiong, Doyen Sahoo (Salesforce AI Research / NUS / HKUST(GZ))"
