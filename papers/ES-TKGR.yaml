problem: TKG 구조·시간 이력만으로는 사건 타입과 배경 semantics를 충분히 구분하기 어려운 문제를 다룬다.
core_idea: '[출판사 초록·공개 발췌 확인; 전체 본문 미확인] ETHCE는 hierarchical event type과 prototype contrastive objective로 relation을
  학습한다. SKGE는 static background graph를 인코딩하고 dynamic·static feature를 적응적으로 융합한다.'
key_assumptions:
- 각 fact를 event type·background field와 정확히 정렬할 수 있어야 한다.
strengths:
- text: Fact에 정렬된 계층적 event type과 배경 정보를 entity·relation 표현에 도입한다.
  tags:
  - heterogeneous-semantics
  - temporal-kg
- text: Dynamic event 구조와 static background semantics를 함께 활용한다.
  tags:
  - multi-view-fusion
limitations:
- text: 공개된 Limitations 문단은 CAMEO 코드와 ICEWS 부가 field에 의존하며, 이들이 완전히 독립적인 지식원이 아니고 가용성·완전성이 효과에 영향을 준다고 명시한다.
