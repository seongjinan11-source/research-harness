problem: KG embedding에서 계층적 개념과 instance 세부정보를 일관된 relation 연산으로 함께 표현하는 문제를 다룬다.
core_idea: '[출판사 초록·공개 발췌 확인; 전체 본문 미확인] Embedding 공간을 operator ring 위의 left module로 기술한다. Structural operator T의
  filtration으로 계층을 만들고, commutator regularization으로 구조와 relation 연산의 일관성을 유도한다. Dual-scale nonlinear deformation도
  결합한다.'
key_assumptions:
- 학습된 structural·relational operator가 설정한 대수적 제약을 만족하도록 최적화해야 한다.
strengths:
- text: 계층적 구조와 entity–relation 연산을 하나의 대수적 표현으로 기술한다.
  tags:
  - graph-geometry
  - interpretability
- text: Structural filtration과 commutator regularization으로 abstraction 간 일관성을 모델링한다.
  tags:
  - graph-structure-use
  - auxiliary-loss
limitations:
