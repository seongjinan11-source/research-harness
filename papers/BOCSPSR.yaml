problem: BOCS acquisition 최적화의 SDP 비용과 근사 정확도를 개선한다.
core_idea: Parameterized submodular relaxation의 내부 문제를 graph cut으로 풀고 외부 parameter를 갱신한다. Surrogate prior를
  바꾸는 방법이 아니라 BOCS의 acquisition optimizer를 개선한다.
key_assumptions:
- Binary quadratic acquisition과 submodular relaxation을 사용한다.
strengths:
- text: 원문 §3은 BOCS가 저차 interaction 같은 모델 가정이 맞을 때 유용하다고 정리한다.
  tags:
  - task-coverage
- text: BOCS의 acquisition optimizer와 surrogate prior의 기여를 구별할 비교 대상을 제공한다.
  tags:
  - inference-cost
limitations:
- text: Size/composition 분리나 horseshoe가 dense count 방향을 잃는 현상을 직접 평가한 연구가 아니다.
  tags:
  - subset-cardinality
  - sparsity-prior
  source: analyst
