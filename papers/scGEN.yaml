core_idea: '[초록 확인; 전체 본문 미확인] Gene-aware embedded network에 adaptive feature weighting과 반복적 fine-tuning을 적용한다. 겹치는
  전사체 profile을 가진 애매한 세포의 구분에 주의를 배분한다.'
key_assumptions:
- 세포별 RNA 발현 feature와 unsupervised clustering 설정이 필요하다.
