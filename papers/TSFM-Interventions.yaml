  # 저자 철자는 PMLR·arXiv 표기를 따랐다. ICML virtual page는 "Michal Wilinski"로 diacritic 없이 적는다.

areas: [tsfm]
problem: "TSFM이 범용 도구로 쓰이고 있지만, 내부에서 무엇을 어떻게 표현하는지는 거의 알려져 있지 않다. 이 내부 표현을 분석해서 모델을 더 가볍게 만들고(pruning) 출력을 원하는 방향으로 조종(steering)하는 데 쓸 수 있는지 묻는다."
core_idea: "첫째, MOMENT, Chronos, Moirai의 layer 간 표현 유사도를 linear CKA로 재서 모델 안과 크기가 다른 모델 사이를 비교한다. 큰 모델에서는 연속한 여러 layer가 거의 같은 표현을 내는 block 구조가 나타난다. 둘째, 이 block마다 첫 layer와 마지막 layer만 남기고 중간 layer를 건너뛰는 방식으로 pruning한다. block은 CKA heatmap을 눈으로 보고 정하며, 자동화 알고리즘도 함께 제안한다. 효과는 MOMENT의 zero-shot imputation, Chronos의 zero-shot forecasting, fine-tuning한 MOMENT의 forecasting에서 잰다. 셋째, 일정한 값에 선형 trend를 더한 시계열과 sinusoid 시계열을 합성해서, layer와 token별 linear probe로 trend 방향이나 주기성 같은 concept이 어디서 구분되는지 찾는다. 넷째, 두 concept class의 layer별 activation median 차이를 steering 벡터로 삼아 추론 중 모든 token의 hidden state에 강도 λ로 더한다. 이렇게 일정한 입력의 예측에 trend나 주기성을 심을 수 있는지 확인한다."
key_assumptions:
  - "CKA 유사도가 높은 연속 layer는 기능적으로도 중복되어 있어서 건너뛰어도 된다고 본다."
  - "concept이 activation 공간에서 선형 방향으로 표현된다고 본다. linear probe와 덧셈형 steering 모두 이 가정에 기댄다."
  - "고정된 amplitude와 주기로 만든 합성 trend·sinusoid 시계열이 실제 데이터의 concept을 대표한다고 본다."
  - "합성 데이터에서 얻은 steering 벡터가 실제 입력에도 같은 의미로 작동한다고 본다."
strengths:
  - text: "언어·비전 모델에서 쓰던 표현 분석 도구(CKA, probing, steering)를 TSFM에 체계적으로 옮겼다. patch 기반 encoder인 MOMENT, 값을 이산 token으로 바꾸는 encoder-decoder인 Chronos, Moirai처럼 구조가 다른 세 계열을 같은 방법으로 비교했다."
    tags: [interpretability]
  - text: "표현 분석을 실제 효율 개선으로 연결했다. fine-tuning한 MOMENT에서 중복 block을 모두 잘라내도 장기 예측 성능이 원래 모델과 거의 같았고, 메모리는 절반 넘게 줄었다. ILI에서는 MSE가 3.260에서 2.981로 오히려 좋아졌다. MOMENT-Large에서 block 하나만 잘라도 모델 크기가 11%, 추론 시간이 5% 줄었다."
    tags: [inference-cost]
  - text: "재학습 없이 출력을 바꾸는 steering을 보였다. 일정한 입력에 concept 벡터를 더하자 Chronos의 예측에 trend와 주기성이 나타났고, 두 concept을 섞는 비율도 조절할 수 있었다. 실제 데이터인 ECG5000에서는 MOMENT embedding 위 SVM이 정상으로 분류하던 30개 샘플이 steering 후 모두 비정상으로 바뀌었다."
    tags: [interpretability, adaptation]
  - text: "concept이 어느 layer와 어느 patch에서 구분되는지 위치를 찾았다. 일정한 시계열과 sinusoid의 구분은 시계열 전체를 봐야 생기고, 증가·감소 trend는 처음과 끝 patch에서 구분되었다. amplitude 차이는 어디서도 뚜렷하게 구분되지 않았는데, 저자들은 입력 정규화가 원인일 수 있다고 해석했다."
    tags: [interpretability, tokenization]
  - text: "모델 크기에 따른 표현 차이도 보였다. 같은 계열에서 초기 layer는 크기와 상관없이 비슷하지만 뒤쪽 layer는 갈라지고, 이 경향은 Chronos에서 특히 강했다. 큰 모델의 block 패턴은 작은 모델로부터 예측할 수 없어서, pruning 위치를 모델마다 따로 찾아야 한다는 점도 드러났다."
    tags: [interpretability]
limitations:
  - text: "분석 대상이 transformer 기반 모델에 한정된다고 저자들이 인정했다. state space model이나 MLP를 쌓은 구조(TTM 계열)로 넓히는 것은 향후 과제로 남겼다."
    tags: [interpretability]
    source: self
  - text: "steering을 다른 실제 데이터셋과 도메인에서 검증하고, forecasting과 imputation 밖의 anomaly detection, classification 같은 태스크로 넓히는 것을 향후 과제로 남겼다."
    tags: [task-coverage, interpretability]
    source: self
  - text: "후속 연구가 이 논문을 가장 가까운 선행연구로 두고, block 형태의 layer 유사도와 latent intervention을 보고한 연구로 정리했다. 그리고 concept parameter, layer별 선형 복원 가능성, 통제된 concept 조합을 중심에 두어 이를 보완한다고 밝혔다. 그 분석에서 AR(1), level shift, trend 같은 단순한 시간 영역 concept은 초기 layer에서 이미 선형으로 복원되었지만, spectral 요인과 time-warping 요인은 가장 덜 접근 가능했다."
    tags: [interpretability]
    source: cited
    by: "On the Internal Semantics of Time-Series Foundation Models (2025)"
    by_link: https://arxiv.org/abs/2511.15324v1
  # review: ICML 2025 OpenReview forum(https://openreview.net/forum?id=goVzfYtj58)은 ICML virtual page에서 확인했지만, OpenReview가 인증 화면만 돌려줘서 리뷰 본문을 읽지 못했다. 미기재.
  - text: "[analyst] CKA로 중복이라고 판정한 layer가 zero-shot에서는 기능적으로 중복이 아니었다. 모든 block을 잘라낸 Chronos-Large는 ETTh에서 MASE가 0.776에서 1.093으로, ercot에서 0.627에서 1.281로 나빠졌다. MOMENT zero-shot imputation도 ETTh1 MSE가 0.371에서 0.673으로, Electricity에서 0.250에서 0.819로 나빠졌다. pruning의 이득은 사실상 fine-tuning을 전제로 할 때만 확인되었다. block 위치도 눈으로 정했고, 제안한 자동화 알고리즘은 평가하지 않았다."
    tags: [inference-cost, zero-shot-gap]
    source: analyst
  - text: "[analyst] steering의 근거는 대부분 합성 데이터 위의 정성적 그림이다. 실제 데이터 실험은 ECG5000 30개 샘플의 class가 바뀌었다는 결과 하나뿐이다. steering 후 시계열이 그럴듯한 형태를 유지하는지, 의도하지 않은 성질까지 바뀌는지는 재지 않았다. concept도 trend 방향과 주기성의 이진 구분에 머문다."
    tags: [interpretability, robustness]
    source: analyst
builds_on: [MOMENT, Chronos, Moirai, CKA]
compared_against: []
open_questions:
  - "CKA 유사도를 zero-shot에서도 안전한 자동 pruning 기준으로 바꿀 수 있는가. 표현이 비슷한 것과 기능이 겹치는 것을 어떻게 구분할 것인가."
  - "합성 데이터로 만든 steering 벡터가 regime shift, 이상 구간, 외생 충격 같은 실제 데이터의 concept으로 옮겨지는가."
  - "Moirai처럼 여러 변수를 한 sequence로 펴서 처리하는 모델에서 변수 간 상관이나 lead-lag 같은 다변량 concept도 선형 방향으로 표현되는가."
hooks:
  - "nuisance-context 연구에 메커니즘 수준의 근거를 줄 수 있다. Chronos-2나 Moirai에서 irrelevant stream을 넣었을 때와 뺐을 때 대상 변수 token의 activation 차이를 layer별로 구하면, 이 논문의 steering 벡터와 같은 방식으로 'nuisance 방향'을 얻는다. 이 방향을 투영해서 지웠을 때 성능이 회복되면, irrelevant context가 어느 layer에서 대상 표현을 오염시키는지 보일 수 있다."
  - "ECG5000에서 steering 한 번으로 정상이 비정상으로 바뀐 것은 MOMENT embedding 안에 이상과 관련된 선형 방향이 있다는 뜻이다. TSAD-OneLiners가 보인 'hidden representation이 복원 오차보다 낫다'는 결과와 합치면, MVTS 이상탐지에서 이 방향으로의 투영값을 anomaly score로 쓰는 방식을 시험해 볼 수 있다. 같은 벡터를 빼는 반사실적 입력을 만들면 alarm triage에서 '이 성질이 없었다면 경보가 꺼지는가'를 반증 질문으로 던질 수 있다."
  - "regime shift 연구에서는 regime 전후 구간을 두 class로 놓고 layer별 probe를 돌리면, 모델이 regime 정보를 어느 layer에서 구분하는지 볼 수 있다. obsolete history를 버리는 개입을 어느 layer에 넣어야 하는지 정하는 근거가 된다."
