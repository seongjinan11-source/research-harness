problem: 관측 자료에서 강한 confounding과 작은 heterogeneous treatment effect를 함께 추정한다.
core_idea: Outcome을 prognostic component와 treatment-effect component로 나누고 별도 tree prior를 둔다. 추정 propensity를
  prognostic response model에 포함하여 regularization-induced confounding을 완화한다.
key_assumptions:
- Causal 해석에는 treatment assignment의 unconfoundedness와 overlap 등 본문 식별 가정이 필요하다.
strengths:
- text: 예측 정확도와 treatment-effect 정확도를 구별하고 두 효과의 regularization을 분리한다.
  tags:
  - nuisance-separation
  - prior-mismatch
- text: Propensity estimate를 response prior에 반영하여 targeted selection에 대응한다.
  tags:
  - experimental-design
limitations:
- text: Propensity와 treatment-effect의 causal 추정은 BO의 adaptive archive 및 same-count ranking과 다른 대상이다. Propensity
    feature 하나로 SSP 결정이 보호된다고 주장할 수 없다.
  tags:
  - decision-regret
  source: analyst
builds_on:
- RegConfounding
compared_against:
- BART
- Propensity-augmented BART
open_questions: &id001
- Count와 composition의 prior를 구별하고 관측 수집 구조를 고려하는 인접 해결 선행으로 인용한다.
