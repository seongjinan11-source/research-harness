areas: [graph-learning]
problem: "라벨 노드가 test 노드와 다른 분포로 편향되게 뽑혔는데 test 분포는 학습 때 알 수 없을 때(agnostic label selection bias), GNN parameter 추정이 편향되고 일반화가 무너지는 문제를 다룬다."
core_idea: "저자들은 stable learning을 빌려 GNN embedding을 label과 불변 관계를 갖는 stable 변수 S와 그렇지 않은 unstable 변수 V로 나누고, 편향 선택이 둘 사이에 spurious correlation을 만든다고 본다. 모델이 비선형 항을 다 맞추지 못하는 misspecification 아래에서는 이 상관이 parameter 추정 편향으로 이어진다는 것을 partitioned regression으로 보인다. 처방은 라벨 노드마다 sample weight를 학습해, weight를 준 penultimate-layer embedding의 변수 쌍 상관을 없애는 decorrelation regularizer다. Differentiated 버전(DVD)은 confounder balancing 관점에서 각 변수 쌍의 가중을 마지막 층 regression 계수로 정해, 혼란 편향에 크게 기여하는 쌍을 우선 제거한다. 학습은 sample weight 고정 후 GNN 갱신, 계수로 변수 가중 계산, GNN 고정 후 weight 갱신을 번갈아 반복한다. 선형 aggregation은 무상관성을 보존하므로 마지막에서 두 번째 층만 decorrelate해도 된다는 정리를 근거로 GCN·GAT에 그대로 붙인다."
key_assumptions:
  - "Embedding이 stable/unstable 변수로 나뉘고 E(Y|S,V)=E(Y|S)가 train·test 모두에서 성립한다고 가정한다(Assumption 1)."
  - "Label 생성에 GNN이 맞추지 못하는 비선형 항이 있다(misspecification)고 보며, 편향의 원인을 변수 간 상관의 변화로 한정한다."
  - "Test 분포는 전혀 모른다. 실험은 validation·test 노드를 학습 그래프에서 가린 inductive 설정이다."
  - "편향 선택은 이웃 라벨 불일치 비율 r_i(중심 노드와 라벨이 다른 이웃의 비율)에 따라 뽑히는 방식과, NELL의 클래스당 1/5/10개 극소 라벨 두 종류로 모사된다."
strengths:
  - text: "Test 노드나 라벨 없는 IID 표본에 접근하지 않고 라벨 노드 집합 안의 재가중만으로 편향을 줄인다. SR-GNN처럼 unbiased 표본이 필요한 방법을 쓸 수 없는 agnostic 상황을 겨냥한다."
    tags: [selection-bias, distribution-shift]
  - text: "Cora·Citeseer·Pubmed의 세 편향 강도 모두에서 GCN·GAT보다 좋았고 개선 폭은 최대 17.0%였다. 편향이 셀수록 이득이 컸고, 편향 없는 split에서도 손해가 없었다. NELL처럼 라벨이 극히 적을 때는 DVD가 VD보다 확실히 나았다."
    tags: [selection-bias, label-imbalance]
  - text: "편향 선택이 변수 상관을 통해 parameter 추정 편향으로 이어진다는 경로를 정리로 보였다. Penultimate layer decorrelation으로 충분하다는 정리 덕분에 GCN·GAT에 구조 변경 없이 붙고, epoch당 학습 시간도 GCN과 같은 자릿수다."
    tags: [theory-gap, inference-cost]
limitations:
  - text: "VD는 모든 변수 쌍을 decorrelate하려면 많은 표본이 필요하고, DVD는 미지의 비선형 항 때문에 추가 parameter가 학습을 불안정하게 만들 수 있다. 저자들은 라벨이 많을 때는 VD가 더 안정적일 수 있다고 인정한다."
    tags: [training-stability]
    source: self
  - text: "GCN-DVD 같은 decorrelation 방법은 distribution shift의 부작용을 완화할 뿐 편향 자체를 줄이지는 못하며, 모델을 다시 학습해야 한다고 지적한다."
    tags: [selection-bias, adaptation]
    source: cited
    by: "FRGNN: Mitigating the Impact of Distribution Shift on Graph Neural Networks via Test-Time Feature Reconstruction (2023)"
    by_id: FRGNN
    by_link: https://arxiv.org/abs/2308.09259
  - text: "[analyst] Sample weight는 이미 뽑힌 라벨 노드 사이에서 영향력을 재분배할 뿐이다. 라벨이 하나도 없는 지역이나 community의 클래스 구성 정보를 새로 만들 수 없고, 편향의 원인을 embedding 변수 간 상관으로 한정해 지역별 클래스 사전확률 차이(label shift)는 다루지 않는다. 실험의 편향도 이웃 라벨 불일치 비율에 따른 선택이라 community 집중형 선택과는 다르다."
    tags: [selection-bias, label-shift, group-offset]
    source: analyst
builds_on: [StableLearning-VD, DVD-StableLearning, GCN, GAT]
compared_against: [GCN, GAT, GNM-GCN, GNM-GAT, ChebNet, SGC, APPNP, Planetoid, MLP]
open_questions:
  - "Transductive 설정에서 test 그래프 구조가 보이는데도 agnostic 가정을 유지하는 것이 최선인가? 라벨 없는 노드 분포를 쓰는 SR-GNN식 정보와 decorrelation을 결합하면 어느 쪽이 더 기여하는가?"
  - "Stable/unstable 분해가 실제 embedding 축과 맞는지, 그리고 편향 선택이 상관 대신 community 단위 클래스 구성을 바꿀 때도 decorrelation이 효과가 있는지 검증되지 않았다."
hooks:
  - "(BSEL commconc의 범위 밖 선행연구) DGNN의 처방은 라벨 집합 내부 재가중이라서 BSEL-F04 failure_reason의 핵심인 'context 없는 community에 클래스 질량의 65–92%가 있다'를 건드릴 수 없다. 또 frozen GraphPFN에는 weight를 줄 학습 loss가 없고, 가장 가까운 대응인 context 재표집은 F04에서 −1.0이었다. 따라서 DGNN은 메소드 후보가 아니라, '라벨 선택 편향 = 변수 상관 편향'으로 보는 관점과 commconc의 'community 단위 클래스 출력 prior 왜곡'(BSEL-P03, O-swap SRec 0.77–0.89) 관점을 대조하는 related work로 쓰는 것이 맞다."
notes: "게재 정보(journal, volume 35, issue 4, pages 4411–4422, 2024년 4월)는 DOI의 Crossref 레코드에서 읽었다. IEEE Xplore 페이지 자체는 열지 못했다. Crossref 제목은 'With'가 대문자이고 arXiv 제목은 'with'다. 코드 링크는 원고와 arXiv 페이지에 없다."
