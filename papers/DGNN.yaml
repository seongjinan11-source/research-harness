id: DGNN
title: "Debiased Graph Neural Networks With Agnostic Label Selection Bias"
authors: "Shaohua Fan, Xiao Wang, Chuan Shi, Kun Kuang, Nian Liu, Bai Wang (BUPT / Zhejiang University)"
