problem: Nuisance 회귀의 regularization이 관심 계수에 bias를 만드는 문제를 다룬다.
core_idea: Control 계수의 과도한 shrinkage가 regularization-induced confounding을 만드는 기전을
  분석하고 동시 회귀와 prior 설계로 대응한다.
key_assumptions:
- 본문의 모델·관측·입력 가정 안에서 해석하며 SSP의 count-dependent adaptive 정책으로 보장을 자동 이전하지 않는다.
strengths:
- text: Nuisance shrinkage가 다른 계수 추정으로 bias를 전달하는 직접 통계 선행이다.
  tags: &id001
  - nuisance-separation
  - prior-mismatch
limitations:
- text: Treatment-effect 결과를 count-dependent nuisance 또는 adaptive BO의 보장으로 옮길 수 없다.
  tags: *id001
  source: analyst
