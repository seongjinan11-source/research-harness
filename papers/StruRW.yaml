id: StruRW
title: "Structural Re-weighting Improves Graph Domain Adaptation"
authors: "Shikun Liu, Tianchun Li, Yongbin Feng, Nhan Tran, Han Zhao, Qiang Qiu, Pan Li (Georgia Tech / Purdue / Fermilab / UIUC)"
venue: "ICML 2023"
