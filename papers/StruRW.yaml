  title: "Structural Re-weighting Improves Graph Domain Adaptation"
  authors: ["Shikun Liu", "Tianchun Li", "Yongbin Feng", "Nhan Tran", "Han Zhao", "Qiang Qiu", "Pan Li"]
  year: 2023
