id: MoDaH
title: "MoDaH achieves rate optimal batch correction"
authors: "Yang Cao, Zongming Ma (Yale University)"
venue: "arXiv 2025"
year: 2025
links:
  paper: https://arxiv.org/abs/2512.09259

citation:
  type: misc
