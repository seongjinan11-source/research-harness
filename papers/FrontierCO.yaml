areas: [benchmark, co-heuristics]
problem: "조합최적화용 ML solver(GNN, neural-symbolic, LLM agent)가 작은 합성 벤치마크에서만 평가되어, 실제 구조와 대규모 instance에서도 고전 solver와 경쟁할 수 있는지 알 수 없다."
core_idea: "MIS, MDS, TSP, CVRP, CFLP, CPMP, FJSP, Steiner tree의 8개 문제에 대해 DIMACS, PACE, TSPLib 등 대회·공개 저장소의 instance를 모았다. 문제마다 고전 SOTA solver가 1시간 안에 대체로 1% 미만 gap에 도달하는 easy set과, 최적값이 알려지지 않았거나 계산이 무거운 hard set을 나눴다. hard는 크기만이 아니라 구조적 난이도로 정의되어 hard MIS가 easy MIS보다 노드 수가 적기도 하다. 주 지표는 [0, 1]로 자른 primal gap이며 infeasible은 1이다. 학습용 데이터와 LLM agent용 dev set을 문제별 생성기로 함께 제공하고, neural solver 14종과 LLM agent 3종(FunSearch, Self-Refine, ReEvo)을 KaMIS, LKH-3, HGS, Gurobi, CPLEX 등과 instance당 1시간 제한으로 비교했다."
key_assumptions:
  - "대회·공개 저장소 instance와 best-known solution이 실제 문제의 구조와 규모를 대표한다고 본다."
  - "primal gap을 [0, 1]로 잘라 평균하면 문제 사이 비교가 가능하다고 본다."
  - "생성기로 만든 학습·dev 데이터가 실제 test instance로 일반화를 시험하기에 적절한 출발점이라고 본다."
strengths:
  - text: "TSP 1,000만 노드, MIS 800만 노드까지 규모를 키우고 실제 대회 instance를 써서, 작은 합성 벤치마크에서 보이던 성능이 무너지는 모습을 보였다. 예를 들어 LEHD는 표준 TSP 벤치마크에서 약 0.72% gap이었지만 FrontierCO easy TSP에서 약 10%, hard TSP에서 약 77%였다."
    tags: [distribution-shift, context-scale]
  - text: "LLM agent의 8개 문제 평균 gap이 easy에서 hard로 가며 약 세 배로 늘었다(FunSearch 10.05%→30.65%, Self-Refine 8.18%→22.03%, ReEvo 7.25%→19.25%). 동시에 Self-Refine이 easy MIS에서 KaMIS를, FunSearch가 hard CVRP에서 HGS를 이긴 사례도 보고해 결과를 한쪽으로만 읽지 않게 했다."
    tags: [distribution-shift, eval-protocol]
  - text: "hard를 크기만이 아니라 구조적 난이도(hypercube STP, SAT 유도 MIS 등)로 정의해, 크기와 난이도를 같은 축으로 취급하지 않았다."
    tags: [eval-protocol]
  - text: "BKS를 문헌과 leaderboard에서 모아 저자 서버에서 다시 검증했고, 신뢰할 기준이 없는 instance는 지정 solver를 최대 2시간 돌려 기준을 만들었다. 학습·dev 데이터와 숨겨진 평가 함수를 함께 공개해 누수를 줄였다."
    tags: [eval-protocol]
limitations:
  - text: "LLM은 생성한 알고리즘 중 무엇이 효과적인지 스스로 판단하지 못해 결과 분산이 크고, 그래서 검증이 어려운 task에는 쓰기 어렵다고 저자들이 지적했다. 큰 instance에서 자원을 많이 쓰는 코드를 실행하는 안전 문제도 언급했다."
    tags: [training-stability, reward-signal]
    source: self
  - text: "LLM이 만든 알고리즘은 simulated annealing, LNS 같은 기존 metaheuristic을 주로 재사용하며, CO에서 새로운 알고리즘적 추론을 보였다고 하기 어렵다고 밝혔다."
    tags: [program-synthesis]
    source: self
  - text: "neural solver는 8개 문제 중 4개에서 메모리 부족으로 실행되지 않았고, GNN의 local message passing이 비유클리드 STP 같은 전역 구조를 잡지 못한다고 인정했다. TSP는 2D Euclidean만 다룬다."
    tags: [graph-structure-use, context-scale]
    source: self
  - text: "[analyst] LLM agent의 easy→hard 열화를 instance 크기 효과와 구조 효과로 분리하지 않았다. 저자들은 주로 run 사이 높은 분산으로 해석하는데, agent가 생성기 기반 dev set에서 고른 휴리스틱이 크기 분포가 전혀 다른 test로 옮겨가는 것인지, 구조가 달라서인지는 이 설계로 구분되지 않는다."
    tags: [distribution-shift, eval-protocol]
    source: analyst
builds_on: [COBench, DIMACS, TSPLib, PACE]
compared_against: [FunSearch, Self-Refine, ReEvo, DiffUCO, SDDS, RLNN, LEHD, SIL, DIFUSCO, DeepACO, tMDP, SORREL, GCNN, IL-LNS, CL-LNS, MPGN, L-RHO, KaMIS, LKH-3, HGS, GB21-MH, SCIP-Jack, Gurobi, CPLEX]
open_questions:
  - "LLM agent의 hard set 열화는 dev set의 크기 분포와 test 크기 분포가 다른 데서 오는가, 구조적 난이도에서 오는가."
  - "dev set을 여러 크기 층으로 구성하고 층별로 정규화해 선택하면 hard set gap이 줄어드는가."
  - "LLM이 자기 알고리즘의 효과를 판단하지 못한다는 문제를 평가 예산 할당(racing 등)으로 완화할 수 있는가."
hooks:
  - "LLM agent가 생성기 기반 dev set에서 고른 휴리스틱이 큰 실제 instance에서 크게 열화한다는 결과는, 사용자 계획 §1의 '크기 일반화가 진짜 평가 기준'이라는 전제와 strata_mixed_reward의 held-out 크기 층 판정을 뒷받침한다. 다만 크기와 구조가 섞여 있으므로 '크기 혼합 보상이 원인'이라는 근거로 쓰면 안 된다."
  - "primal gap을 [0, 1]로 자르고 infeasible을 1로 두는 설계는 사용자 보상 형태 비교(R0 대 instance별 정규화)에서 '상한을 둔 instance별 gap'의 표준 사례로 인용할 수 있다."
notes: "arXiv comment와 ICLR 2026 poster 페이지에서 ICLR 2026 게재를 확인했다. OpenReview forum은 브라우저 인증 화면에 막혀 리뷰를 확인하지 못해 review 한계는 넣지 않았다. 본문은 '16개 ML solver'라고 쓰지만 나열된 것은 neural 14개와 LLM agent 3개다. code 링크는 본문 요약에서 확인했고, ICLR 페이지에는 데이터 링크만 있다. booktitle은 ICLR 페이지 표기(ICLR 2026)를 그대로 썼다."
