areas: [co-heuristics, llm-rl]
problem: "EoH·ReEvo·MCTS-AHD는 LLM을 정해진 workflow 안의 수동적 생성기로 쓰고, CALM은 미세조정하더라도 workflow가 고정되어 있고 문제 하나만 학습한다. LLM이 스스로 필요한 정보를 찾고 언제 휴리스틱을 제출할지 정하는 agent로 만들어, 적은 평가 횟수로 여러 문제와 처음 보는 문제까지 다루고자 한다."
core_idea: "매 turn마다 LLM이 휴리스틱을 생성해 평가기에 제출할지, 도구를 부를지, 최종 휴리스틱을 낼지를 고르는 multi-turn 틀이다. 도구는 읽기 전용 진단용으로, design set의 요약·단일 instance·가장 다른 instance 쌍을 보여 주는 instance 분석 도구와, 후보가 이전 시도와 구조적으로 얼마나 다른지 재는 AST 도구가 있다. 도구는 validation set을 보지 못하고, 평가기 호출만 예산에 포함된다. Qwen3-4B-Instruct를 GRPO(prompt당 rollout 8개, 4 prompt/step, 500 step)로 학습하며, 중간 보상은 0이고 최종 휴리스틱의 design set 점수에서 baseline 휴리스틱 점수를 뺀 값이 trajectory 보상이다. 코드가 없으면 −2.0, 실행 실패나 infeasible이면 −1.5다. 학습 환경은 seed 휴리스틱(ReEvo 탐색 결과 등 597개 또는 seed 없음), instance 변형(N∈{40,50,60,70,80}), solver 틀(구성형, ACO)을 바꿔 자동 합성하며, TSP·CVRP × 구성형·ACO 네 도메인에 도메인당 1,000개 prompt를 둔다."
key_assumptions:
  - "Design set 위의 단일 스칼라 점수 차이가 trajectory 전체의 보상으로 충분하다고 본다. 그 점수를 크기가 다른 instance 사이에서 어떻게 집계하는지는 명시하지 않는다."
  - "여러 도메인에서 합성한 환경으로 배운 정보 탐색·제출 정책이 OP·MKP·BPP·BO 획득함수 같은 처음 보는 문제로 옮겨 간다고 가정한다."
  - "평가 시 design set은 도메인당 한 크기(예: 구성형 TSP N=50 64개, CVRP-ACO N=50 10개)로 충분하다고 본다."
strengths:
  - text: "4B 모델로 훨씬 큰 모델을 쓴 fixed-workflow 방법과 비슷하거나 더 좋은 휴리스틱을 찾으면서 평가 횟수를 크게 줄였다. 짧은 설정은 평가 최대 30회(실제 약 11–15회)로 100회를 쓴 baseline과 경쟁한다."
    tags: [inference-cost]
  - text: "학습하지 않은 OP·MKP·BPP·비용 인식 BO 획득함수로 transfer를 평가했다. 학습 도메인 수를 늘리면 held-out OP-ACO gap이 24.5%에서 8.9%로 줄어, 문제 다양성이 일반화의 핵심 변수임을 보였다."
    tags: [distribution-shift, task-coverage]
  - text: "RL을 빼면 CVRP-구성형 평균 gap이 21.20%에서 37.59%로 나빠지고, 도구 없이 평가기 피드백만 주면 22.90%가 되어 RL과 도구 각각의 기여를 분리했다."
    tags: [adaptation]
  - text: "Validation 단계에서는 크기마다(N=50/100/200 등, 각 64개) 평균 목적값과 gap을 따로 보고해, 크기별 성능을 구분해 본다."
    tags: [eval-protocol]
limitations:
  - text: "학습된 정책이 BPP에서는 DeepACO와의 격차를 줄이는 데 그쳐 여전히 약하다. 저자들은 이를 학습 정책의 한계 지점으로 본다."
    tags: [distribution-shift]
    source: self
  - text: "[analyst] 보상인 design set 점수의 집계 방식이 명시되지 않았다. RL 학습 prompt는 N=40–80을 섞어 쓰는데, 평균 목적값을 그대로 쓴다면 큰 N이 점수 차이를 지배할 수 있다. Validation은 크기별로 나눠 보고하면서 보상은 그렇게 하지 않는 비대칭이 있다. 또 결과의 seed 분산과 보상이 design set 표본에 얼마나 민감한지도 분석되지 않았다."
    tags: [multi-reward, reward-signal, eval-protocol]
    source: analyst
  - text: "[analyst] 보상이 고정 baseline 휴리스틱과의 차이라서, baseline이 강한 환경과 약한 환경 사이에서 보상 스케일이 달라진다. GRPO는 prompt 안에서 정규화하므로 group 사이 스케일은 상쇄되지만, 같은 prompt 안 instance 층 사이의 스케일 차이는 남는다."
    tags: [multi-reward, reward-signal]
    source: analyst
builds_on: [ReEvo, CALM, GRPO, Qwen3-4B-Instruct]
compared_against: [ReEvo, EoH, MCTSAHD, CALM, POMO, DeepACO, GreedyConstruct, EI, EIpu, EI-cool]
open_questions:
  - "Design set 점수를 크기별로 정규화하거나 층별 순위로 바꾸면 held-out 크기와 도메인으로의 transfer가 달라지는가?"
  - "Instance 분석 도구가 실제로 정보 탐색에 쓰이는가, 아니면 design set 특성에 맞춘 과적합 경로가 되는가? Validation set 접근을 막았다는 것만으로 design set 과적합은 배제되지 않는다."
hooks:
  - "(strata 계획의 대상 셋 중 하나) 사용자 연구 계획 §8.2는 CALM·AHD Agent·RFTHGS 세 RL-AHD가 모두 크기·스케일이 섞인 평균을 보상으로 둔다고 정리했다. AHD Agent에 대해서는 '학습 prompt가 N=40–80을 섞고, 보상 집계는 서술하지 않으며, validation은 크기별'이라는 점까지 원문으로 확인된다. 따라서 '집계 방식을 서술하지 않음'으로 쓰고 '평균을 쓴다'고 단정하지 않는 것이 정확하다(저장소 코드 확인 필요)."
  - "(고정 baseline 차이 보상, M6) 진단 계획 M6의 보상 형태 중 'AHD Agent 점수 차이'는 이 논문 보상식 Score(h) − Score(h_b)에 해당한다. CALM의 parent 대비 상대 Δ와 달리 baseline이 고정이므로, 같은 instance 표본 잡음에서 부호 뒤집힘 양상이 다를 수 있다(가설)."
  - "(문제 다양성과 transfer) 학습 도메인 수가 일반화를 좌우한다는 결과는 사용자 계획 §7의 '문제 하나에 깊게 vs 여러 문제로 transfer' 결정에서 transfer 쪽이 이미 선점되었다는 판단의 근거다. 사용자는 TSP 하나를 깊게 파고 보상 신호 품질을 축으로 삼는 쪽이 차별화에 유리하다."
notes: "arXiv v2(2026-08) HTML 본문 전체(본문과 부록 B–E)를 두 번에 나눠 읽었다. 학회 게재는 확인하지 못해 misc로 두었다. 저자 목록은 arXiv abs 페이지 현재 버전 기준이며, 검색 요약에 나온 v1 저자 목록에는 Yew-Soon Ong이 없었다. 본문에 limitation 절이 없어 self 한계는 저자들이 직접 언급한 BPP 약점만 넣었다. Code 링크는 사용자 연구 노트의 출처 목록에 있는 주소다. GRPO, Qwen3-4B-Instruct는 외부 이름이다."
