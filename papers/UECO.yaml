areas: [graph-learning, co-heuristics]
problem: "Neural combinatorial optimization(NCO)에서 decision paradigm, 학습 목적, 문제 종류가 특정 backbone 구조와 묶여 있어서, 방법 간 차이가 backbone 차이와 교락되고 범용 모델 개발과 공정한 비교가 어렵다는 문제를 다룬다."
core_idea: "UECO는 decoder와 분리된 공용 encoder다. 그래프 국소성 위에서 정의한 가벼운 local 모듈이 edge 표현을 층마다 갱신하고, 그 edge 상태가 다음 global node attention의 점수를 조절한다. 갱신된 node 표현은 다시 다음 edge 갱신을 이끈다. 정적 edge feature를 한 번에 더하는 대신 local·global 정보를 층마다 번갈아 섞는 구조다. 방향성이 있는 문제(ATSP, ACVRP)에는 edge 양 끝의 두 view를 유지하는 이중 node 채널을 둔다. 같은 encoder를 Local Construction(autoregressive, 주로 RL), Global Prediction(one-shot heatmap 또는 생성형), Adaptive Expansion 세 paradigm의 decoder에 그대로 연결한다."
key_assumptions:
  - "Host 방법의 학습 목적, decoder, feasibility 처리를 그대로 두고 encoder만 바꾸면 backbone 효과를 분리해 비교할 수 있다고 본다."
  - "문제가 node 또는 edge 단위 결정 변수를 갖는 그래프로 표현된다(KP, FFSP는 보조 실험)."
strengths:
  - text: "Encoder만 교체하는 통제 실험으로 TSP, ATSP, CVRP, ACVRP, MIS, MaxClique, MaxCut의 여러 규모에서 거의 일관된 해 품질·일반화 개선을 보고했다. 기존 encoder와의 교락을 줄인 비교 설계다."
    tags: [eval-protocol, graph-structure-use]
  - text: "TSP-100에서 학습한 모델을 TSP-1000으로 외삽하고, divide-and-conquer 틀(DualOPT)의 부분 solver로 넣어 TSP-1K/10K/100K에서 LKH 대비 gap 0.66%/0.64%/1.55%를 보고했다(DualOPT-AM은 2.58%/1.90%/1.71%). MIS/MCl/MCut은 최대 11000 노드로 외삽했다."
    tags: [graph-scale, distribution-shift]
  - text: "Gaussian, clustered 등 학습 분포 밖 TSP/ATSP instance와 실제 TWITTER/COLLAB MaxClique에서도 평가했다."
    tags: [distribution-shift]
limitations:
  - text: "저자들은 통합이 주로 encoder 수준이라 문제군마다 task별 decoder, feasibility mask, 출력 head가 여전히 필요할 수 있다고 밝힌다."
    tags: [task-coverage]
    source: self
  - text: "Global attention이 dense graph에서 추가 계산 비용을 낼 수 있어, 메모리 효율적 attention이나 적응적 이웃 선택이 필요하다고 저자들이 인정한다. KP, JSP 같은 다른 조합최적화 문제군으로의 확장도 남은 과제로 든다."
    tags: [inference-cost, graph-scale, task-coverage]
    source: self
  - text: "비교는 neural solver끼리의 encoder 교체 실험이다. LLM이 생성한 휴리스틱(FunSearch, EoH, CALM 계열)과 같은 instance·예산으로 비교한 결과는 없다."
    tags: [eval-protocol]
    source: analyst
builds_on: ["attention-based NCO encoders (AM, POMO, MatNet)", "GCN4CO", "COExpander", "ML4CO-Kit"]
compared_against: ["UTSP", "DIMES", "GNNGLS", "VAG-CO", "Meta-EGN", "GCN4CO", "Fast-T2T", "DiffUCO", "AM", "MatNet", "POMO", "Sym-NCO", "GOAL", "MatPOENet", "UniteFormer", "PreferenceCO", "LwD", "COExpander", "Concorde", "LKH", "KaMIS", "Gurobi"]
open_questions:
  - "Encoder 통일 뒤에도 남는 paradigm 간 성능 차이는 decoder와 학습 목적 중 어디서 오는가?"
  - "Dense graph에서 global attention 비용을 줄이면서 edge 진화의 이득을 유지할 수 있는가?"
hooks:
  - "사용자의 LLM 휴리스틱 자동설계(AHD) 보상 연구는 TSP를 주 문제로 두고 크기 일반화를 따로 본다. UECO는 같은 TSP에서 학습 크기 밖 외삽(100→1000, D&C로 100K)을 보고하므로, 생성 휴리스틱이 넘어야 할 neural solver 기준선으로 쓸 수 있다(직접 비교 결과는 없음)."
  - "Backbone을 고정하고 encoder만 바꾸는 통제 비교 설계는, 사용자 실험에서 보상 정의만 바꾸고 나머지 파이프라인을 고정하는 원칙과 같은 방향의 평가 protocol 근거다."
notes: "README와 PDF preview는 NeurIPS 2026(Oral)을 표기하지만 neurips.cc에서 확인하지 못했고 arXiv id도 찾지 못해 misc로 둔다. PDF는 camera-ready 이전 early preview라고 README가 밝힌다."
