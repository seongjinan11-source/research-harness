  code: https://github.com/Thinklab-SJTU/UECO
citation:
  type: misc
  title: "UECO: A Unified Encoder for Neural Combinatorial Optimization with Iterative Edge-Node Reasoning"
  authors: ["Wenzheng Pan", "Shuyi Yan", "Nuoyan Chen", "Yiyang Qu", "Jiale Ma", "Junchi Yan"]
  year: 2026
