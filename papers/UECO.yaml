id: UECO
title: "UECO: A Unified Encoder for Neural Combinatorial Optimization with Iterative Edge-Node Reasoning"
authors: "Wenzheng Pan, Shuyi Yan, Nuoyan Chen, Yiyang Qu, Jiale Ma, Junchi Yan (Shanghai Jiao Tong University, Shanghai Innovation Institute)"
venue: "NeurIPS 2026 (README 표기, 미확인)"
year: 2026
links:
