areas: [co-heuristics]
problem: "FunSearch가 함수 하나를 진화시킨 것을 넘어, 여러 함수와 언어로 된 코드 파일 전체를 LLM으로 진화시켜 수학·알고리즘 문제와 실제 계산 인프라 최적화에서 새로운 결과를 얻고자 한다."
core_idea: "LLM ensemble이 기존 프로그램을 SEARCH/REPLACE diff(짧은 코드는 전체 재작성)로 고치고, 사용자 평가 함수가 여러 scalar 지표를 돌려준다. EVOLVE-BLOCK 표시로 진화할 영역을 지정하므로 파일 전체, 여러 함수, 여러 언어를 다룰 수 있다. Program database는 MAP-Elites식 다양성 유지와 island 구조를 섞는다. Prompt에는 과거 프로그램, 문제 맥락, 평가 결과, 그리고 따로 진화시키는 meta prompt가 들어간다. 모델은 많은 후보를 빠르게 내는 Gemini 2.0 Flash와 적지만 질 좋은 후보를 내는 Gemini 2.0 Pro를 섞는다. 평가는 싼 소규모 test를 먼저 통과한 후보만 더 어려운 test로 올리는 evaluation cascade로 하고, 여러 지표를 함께 최적화할 수 있으며, LLM이 매긴 정성 점수도 쓸 수 있다."
key_assumptions:
  - "자동으로 돌릴 수 있는 평가기가 있어야 한다. 사람이 실험해야 하는 과제는 범위 밖이다."
  - "평가 cascade의 앞 단계 결과가 뒤 단계 성능을 잘 예측해, 싼 test로 후보를 걸러도 좋은 후보를 잃지 않는다고 가정한다."
strengths:
  - text: "4×4 복소 행렬 곱을 scalar 곱셈 48번으로 하는 알고리즘을 찾아 이 설정에서 Strassen 이후 56년 만에 처음 개선했다. 50개 넘는 수학 문제 중 약 75%에서 최고 결과와 같았고 약 20%에서 개선했다."
    tags: [program-synthesis]
  - text: "Google Borg 데이터센터 스케줄링 휴리스틱을 과거 workload snapshot 시뮬레이터로 진화시키고, 더 최근 데이터로 따로 일반화를 확인했다. 배포 후 평균 약 0.7%의 fleet 계산 자원을 되찾아 시뮬레이터 예측과 맞았다. Gemini kernel tiling도 학습 shape와 held-out shape를 나눠 평가해 평균 약 23% kernel 속도 향상을 냈다."
    tags: [distribution-shift, eval-protocol]
  - text: "Evolution, prompt 맥락, meta prompt 진화, 파일 전체 진화, 모델 혼합을 하나씩 빼는 ablation으로 각 구성요소의 기여를 보였다. 해석 가능한 코드라 배포와 검증이 쉽다는 점을 deep RL 대신 택한 이유로 든다."
    tags: [interpretability]
limitations:
  - text: "자동 평가기가 필요하다는 것이 주된 한계라고 저자들이 직접 밝힌다. 수작업 실험이 필요한 과제는 다룰 수 없고, LLM 기반 평가는 가능하지만 이 연구의 초점이 아니었다."
    tags: [task-coverage, reward-signal]
    source: self
  - text: "AlphaEvolve는 closed-source이고 여러 frontier LLM ensemble에 의존한다고 지적하며, 이를 오픈 모델 하나로 재현하는 framework를 제안했다."
    tags: [inference-cost, eval-protocol]
    source: cited
    by: "ThetaEvolve: Test-time Learning on Open Problems (2026)"
    by_id: ThetaEvolve
    by_link: https://arxiv.org/abs/2511.23473
  - text: "AlphaEvolve 같은 test-time scaling은 고정된 LLM에 반복해서 프롬프트를 주는 탐색이라, 해당 문제에서 얻은 경험으로 모델을 계속 학습하지 못한다고 지적한다."
    tags: [adaptation]
    source: cited
    by: "Learning to Discover at Test Time (2026)"
    by_id: TTTDiscover
    by_link: https://arxiv.org/abs/2601.16175
  - text: "[analyst] Run 사이 분산, 사용한 평가 횟수와 비용이 문제별로 체계적으로 보고되지 않는다. Cascade로 후보를 자르는 기준이 평가 잡음에 얼마나 민감한지도 분석되지 않았다."
    tags: [eval-protocol, reward-signal]
    source: analyst
builds_on: [FunSearch, MAP-Elites, Gemini-2.0]
compared_against: [FunSearch, Strassen]
open_questions:
  - "Evaluation cascade의 단계별 통과 기준을 어떻게 정해야 잡음이 큰 과제에서도 좋은 후보를 잃지 않는가?"
  - "AlphaEvolve가 찾은 코드를 base model로 증류하면(저자들의 향후 과제) 다른 문제로 transfer되는가?"
hooks:
  - "(평가 예산 할당의 선행) Evaluation cascade는 '싼 test로 먼저 거르고 유망한 후보만 비싼 test로 올리는' 방식으로, 사용자 노트가 언급한 AdaEva의 successive halving과 같은 계열이다. 사용자 연구의 해결 원리 후보인 '부호를 정할 만큼만 평가 예산을 쓰는 racing'은 진화 탐색 쪽에서 AlphaEvolve부터 이미 쓰인다. 따라서 RL 보상 계산에 맞춘 할당이라는 점에서만 차별점을 주장해야 한다."
  - "(held-out 평가의 모범 사례) Borg 스케줄링은 최근 데이터로, kernel tiling은 held-out shape로 따로 검증했다. Strata 계획의 held-out 층 A·B 분리는 이 관행을 AHD 보상 비교에 옮긴 것으로 서술할 수 있다."
notes: "arXiv v1 HTML 본문 앞 약 100k자(구조, 평가, 응용, ablation, 한계)를 읽었다. 학회·저널 게재는 확인하지 못해 misc로 두었다. 시스템이 closed-source라 code 링크는 없다. MAP-Elites, Gemini-2.0, Strassen은 외부 이름이다. cited 한계 두 개는 ThetaEvolve 초록과 TTT-Discover 초록(PMLR 페이지)에서 읽은 내용이다."
