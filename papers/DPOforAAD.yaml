id: DPOforAAD
title: "Fine-tuning Large Language Model for Automated Algorithm Design"
authors: "Fei Liu, Rui Zhang, Xi Lin, Zhichao Lu, Qingfu Zhang"
venue: "arXiv 2025 (ICLR 2026 workshop AIMS poster)"
year: 2025
links:
  paper: https://arxiv.org/abs/2507.10614
  code: https://github.com/RayZhhh/dpo-aad
