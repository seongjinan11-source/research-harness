citation:
  type: misc
  title: "Fine-tuning Large Language Model for Automated Algorithm Design"
  authors: ["Fei Liu", "Rui Zhang", "Xi Lin", "Zhichao Lu", "Qingfu Zhang"]
  year: 2025
  arxiv: "2507.10614"
  url: https://arxiv.org/abs/2507.10614
  verified_from:
    - https://arxiv.org/abs/2507.10614
    - https://iclr.cc/virtual/2026/10018197
areas: [co-heuristics, llm-rl]
problem: "자동 알고리즘 설계(AAD)에 범용 코딩 LLM을 그대로 쓰지 않고, 이 task에 맞게 fine-tuning하면 더 작은 모델로도 좋은 알고리즘을 만들 수 있는지 묻는다."
core_idea: "FunSearch와 EoH를 Llama-3.1-8B-Instruct로 돌려 나온 유효 알고리즘을 모두 database에 모은다(ASP·CVRP에서 각각 약 6만 개). Diversity-Aware Rank-based(DAR) sampling은 database를 fitness 순으로 M개 같은 크기 구간으로 나누고, 상위 구간 쪽으로 치우친 softmax로 구간 i를 고른 뒤 그 구간에서 positive를, 바로 아래 구간을 건너뛴 i+2 이하 구간에서 negative를 뽑아 품질 차이를 강제한다. 이렇게 만든 선호 쌍으로 base 모델을 기준 모델로 하는 DPO(β=0.4, LoRA)를 학습하고, 학습된 모델을 다시 FunSearch·EoH 탐색의 생성기로 쓴다."
key_assumptions:
  - "탐색 중 기록된 fitness 순위가 알고리즘 품질의 순위를 충분히 반영해, 구간 차이로 만든 선호 쌍이 올바른 방향을 가리킨다고 가정한다."
  - "한 번의 오프라인 탐색 database에서 배운 선호가 이후 탐색과 관련 task로 전이된다고 본다."
strengths:
  - text: "탐색 부산물(평가된 알고리즘 database)을 학습 데이터로 재사용하는 오프라인 방식이라 학습 중 추가 평가가 필요 없다. 인접 순위 구간을 건너뛰어 쌍을 만드는 규칙으로 품질 차이가 작은 쌍을 피하며, top-k sampling보다 선호 gap이 크고 더 좋은 모델을 만든다고 보고한다."
    tags: [reward-signal, adaptation]
  - text: "Fine-tuning한 Llama-3.2-1B가 base보다 크게 좋아지고 base 8B와 비슷한 수준에 가깝다. 예: ASP FunSearch top-1이 19.48에서 9.19(8B base 8.46), CVRP FunSearch top-1이 35.81에서 30.26."
    tags: [inference-cost]
  - text: "CVRP-50으로 학습한 8B를 CVRP-100에서 써도 top-1 gap이 줄었고(FunSearch 26.27에서 24.1, EoH 26.88에서 23.34), CVRP로 학습한 모델이 TSP-50에서도 개선되었다."
    tags: [distribution-shift]
limitations:
  - text: "저자들은 이 연구를 예비적 단계로 규정한다. 데이터에서 full fine-tuning이 수렴하지 않아 LoRA를 썼고, EoH를 쓴 TSP 전이에서는 이득이 작았다(10.87에서 10.3). 알고리즘마다 평가 비용이 커서 dataset을 키우기 어렵다."
    tags: [adaptation, inference-cost]
    source: self
  - text: "[analyst] 선호 쌍의 방향은 탐색 때 계산한 fitness 순위에 전적으로 의존하지만, 그 fitness를 몇 개 instance로 계산했는지와 순위의 표본 잡음은 다루지 않는다. 같은 database의 순위로 쌍을 만들고 같은 평가 설정으로 성능을 재므로, 평가 집합에 맞춘 선호가 학습되었을 가능성을 분리하지 못한다. 실험도 탐색 3회로 보고한다."
    tags: [reward-signal, eval-protocol]
    source: analyst
builds_on: [FunSearch, EoH, DPO]
compared_against: [Llama-3.2-1B-Instruct, Llama-3.1-8B-Instruct, openPangu-Embedded]
open_questions:
  - "DAR의 구간 건너뛰기 폭을 fitness 추정 잡음 크기에 맞춰 정하면 선호 쌍의 오류율과 학습 결과가 어떻게 바뀌는가?"
  - "오프라인 DPO와 온라인 RL(CALM류)은 같은 평가 예산에서 어느 쪽이 더 큰 instance로 잘 일반화하는가?"
hooks:
  - "(순위 잡음과 쌍 구성) DAR이 인접 구간을 건너뛰어 쌍을 만드는 것은 fitness 차이가 작은 쌍의 방향이 믿기 어렵다는 점에 대한 암묵적 대응으로 읽을 수 있다. 사용자 보상 잡음 진단은 소수 고정 instance에서 계산한 순위가 큰 생성기 표본의 순위와 얼마나 다른지 재는 것이므로, 그 결과는 DAR 같은 순위 기반 선호 쌍의 오류율을 직접 추정하는 데에도 쓸 수 있다(가설). 이 논문 자체는 잡음을 측정하지 않는다."
  - "(크기 전이) CVRP-50에서 100으로의 전이를 보고하지만 학습 신호는 단일 크기에서 나온다. 층이 섞인 보상이 크기 전이를 바꾸는지 묻는 사용자 strata 계획에서, 단일 크기 학습의 비교 기준선 사례로 쓸 수 있다."
notes: "arXiv abs와 HTML v2 본문을 읽었다. 사용자 노트는 이 논문을 'DPO for AAD (ICLR 2026)'로 불렀으나, iclr.cc 가상 페이지에서 확인한 결과 main conference가 아니라 ICLR 2026 workshop(AI for Mechanism Design and Strategic Decision Making, AIMS)의 poster다. 그래서 misc로 두었다. OpenReview forum 주소는 그 페이지에서 읽었다. 논문에 별도 limitation 절은 없어 self 한계는 본문에서 저자가 직접 인정한 내용만 넣었다."
