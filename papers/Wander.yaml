id: Wander
title: "To Learn is to Wander: Learning Across Graphs and Tasks with Random Walks"
authors: "Louis Tichelman, Xingyue Huang, Jinwoo Kim, İsmail İlkan Ceylan (TU Wien / AITHYRA / University of Oxford / KAIST)"
