core_idea: '[초록 확인; 전체 본문 미확인] LLM을 고정하고 lightweight Interpreter를 semantic proxy로 학습한다. Node-wise confidence와 dynamic
  role switching으로 더 신뢰할 수 있는 view가 다른 view를 보정하게 한다.'
key_assumptions:
- Confidence가 view별 신뢰도를 유용하게 구분해야 한다.
strengths:
- text: LLM fine-tuning과 지속적인 test-time prompting을 피하도록 semantic proxy를 학습한다.
  tags:
  - inference-cost
  - llm-semantics
- text: Confidence feedback으로 semantic·structural view를 상호 보정한다.
  tags:
  - multi-view-fusion
  - robustness
limitations:
- text: '[analyst] 두 view가 동일한 잘못된 근거를 공유할 때도 confidence가 신뢰도를 구분하는지는 별도 확인해야 한다. 초록만으로 calibration 보장을 판단할 수 없다.'
