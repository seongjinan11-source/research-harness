areas: [co-heuristics]
problem: "전문가가 미리 정한 휴리스틱 공간 안에서 고르는 기존 hyper-heuristic 대신, LLM이 열린 공간에서 휴리스틱 코드를 생성하는 Language Hyper-Heuristic을 정의하고, 적은 평가 횟수로 여러 조합최적화 문제와 알고리즘 틀에서 좋은 휴리스틱을 찾고자 한다."
core_idea: "고정된 함수 시그니처를 가진 코드 조각을 개체로 하는 genetic programming 식 루프다. Generator LLM이 휴리스틱을 만들고, 별도 reflector LLM이 성찰(reflection)을 글로 쓴다. 목적값이 서로 다른 parent 두 개를 뽑아 short-term reflection으로 둘을 비교하고, 그 성찰을 넣어 crossover로 자식을 만든다. Long-term reflection은 지금까지의 통찰을 누적해 갱신하고, elitist mutation은 현재 최고 휴리스틱의 변형 여러 개를 뽑는다. GLS penalty, ACO heuristic measure, EDA용 GA 연산자, TSP 구성형 휴리스틱, neural solver의 attention 재조정까지 다섯 가지 알고리즘 틀에 붙이고, 문제 설명을 주는 white-box와 숨기는 black-box 설정을 모두 본다. 휴리스틱 평가는 100회로 제한한다."
key_assumptions:
  - "휴리스틱의 기대 성능을 instance 집합 위 평균 성능으로 추정할 수 있다고 본다. ACO 틀에서는 test 다섯 크기 가운데 가장 작은 크기로만 학습한다."
  - "LLM이 쓴 성찰이 일종의 verbal gradient로서 탐색에 유용한 방향을 준다고 가정한다."
  - "평가 100회라는 작은 예산에서의 비교가 방법의 우열을 보여 준다고 본다."
strengths:
  - text: "TSP·CVRP·OP·MKP·BPP·DPP의 여섯 문제와 다섯 알고리즘 틀, white-box·black-box 두 설정에서 실험해 범위가 넓다. 같은 예산에서 EoH보다 샘플 효율이 높다고 보고한다."
    tags: [task-coverage, inference-cost]
  - text: "LLM 샘플링 확률로 이웃을 정의해 fitness landscape를 분석했다. ACO-TSP50에서 성찰을 넣으면 correlation length가 0.28에서 1.28로 커지고 평균 목적값은 12.08에서 6.53으로 줄어, landscape가 매끄러워진다고 주장한다."
    tags: [theory-gap]
  - text: "ACO에서 가장 작은 크기로만 학습한 휴리스틱을 더 큰 크기 test에 적용해 크기 외삽을 함께 보고한다."
    tags: [distribution-shift]
limitations:
  - text: "평가 100회 설정에서만 실험해서, 예산을 키웠을 때 결과가 그대로 유지된다고 보장할 수 없다고 저자들이 인정한다."
    tags: [eval-protocol]
    source: self
  - text: "여러 open-source LLM에서는 성찰의 이득이 아직 통계적으로 믿을 만한 수준이 아니라고 인정한다."
    tags: [training-stability, robustness]
    source: self
  - text: "규칙 기반 휴리스틱은 neural policy보다 표현력이 낮아 복잡한 환경에서는 underfit할 수 있다고 인정한다."
    tags: [task-coverage]
    source: self
  - text: "ReEvo 같은 fixed-workflow 방법은 탐색 절차를 바깥에서 정해 두고 LLM을 후보 생성기로만 쓴다. 그래서 설계 단계마다 필요한 증거를 스스로 찾지 못하고 비용이 큰 시행착오 탐색에 기댄다고 지적한다."
    tags: [adaptation, inference-cost]
    source: cited
    by: "AHD Agent: Agentic Reinforcement Learning for Automatic Heuristic Design (2026)"
    by_id: AHDAgent
    by_link: https://arxiv.org/abs/2605.08756
  - text: "[analyst] Ablation 표의 black-box 결과는 변형 사이 차이가 보고된 표준편차 안에 드는 경우가 많다(예: 전체 8.96±0.82, long-term reflection 제거 9.32±0.71). Landscape 분석도 run 3개, random walk 40걸음에 기대므로, 성찰의 기여는 white-box 설정 외에는 약하게 뒷받침된다."
    tags: [eval-protocol, training-stability]
    source: analyst
builds_on: [FunSearch, EoH, genetic-programming]
compared_against: [EoH, FunSearch, KGLS, GNNGLS, NeuralGLS, NeuOpt, DeepACO, POMO, LEHD, DevFormer, GHPP]
open_questions:
  - "평가 예산이 100회를 넘어 수천 회가 되면 성찰의 상대적 이득은 커지는가, 사라지는가?"
  - "성찰이 landscape를 매끄럽게 한다는 결과가 평가 instance 집합의 잡음과 무관한가? 같은 휴리스틱을 다른 instance 집합으로 평가해도 landscape 지표가 유지되는가?"
hooks:
  - "(seed 휴리스틱 공급원) AHD Agent는 RL 학습 환경의 seed 휴리스틱을 ReEvo 탐색 결과에서 모았다. 사용자의 휴리스틱 pool에 공개된 ReEvo 최종 휴리스틱을 넣는 계획은 RL-AHD 선행과 같은 출처를 쓰는 셈이라 비교가 쉬워진다."
  - "(크기 외삽과 학습 층) ReEvo는 ACO에서 가장 작은 크기로만 학습하고 큰 크기는 test만 했다. 이는 strata 계획에서 '학습 층과 held-out 층을 나누어 방향 일치를 본다'는 C1의 극단적 경우(학습 층 1개)다. 학습 층을 늘렸을 때 R0와 R3가 갈리는지 보는 사용자 설계는 이 관행을 확장한 대조 실험으로 위치시킬 수 있다."
  - "(평가 잡음) 저자들 스스로 open-source LLM에서 이득이 통계적으로 불안정하다고 인정하고, black-box ablation 차이가 표준편차 안에 있다. 사용자의 '작은 고정 집합 보상의 신뢰도' 진단(M1–M3)은 이런 불안정의 원인 중 하나를 평가 쪽에서 분리해 측정하는 작업으로 설명할 수 있다(가설, ReEvo는 평가 잡음을 원인으로 지목하지 않음)."
notes: "arXiv v3 HTML 본문 앞 약 100k자(방법, 문제, baseline, landscape 분석, ablation, limitation)를 읽었다. 문제별 학습 instance 개수·크기는 읽은 범위에 나오지 않아 적지 않았다. NeurIPS proceedings 페이지에서 권호(37)와 저자 순서를 확인했고 pages는 표시되지 않아 생략했다. Code 링크는 검색 결과로 확인했다."
