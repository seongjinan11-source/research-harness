problem: Spatial smooth와 correlated covariate가 겹칠 때 smoothing-induced bias가 covariate 효과로 전달된다.
core_idea: Covariate의 spatial dependence를 먼저 회귀하고 그 residual을 spatial model의 covariate로 사용한다. Thin-plate
  spline 분석과 simulation으로 bias를 검토한다.
key_assumptions:
- 공간적으로 smooth한 nuisance와 covariate의 선형 효과를 사용하며, 효과를 식별할 residual covariate variation이 필요하다.
strengths:
- text: Smoothing-induced confounding을 residualization으로 줄이는 직접적인 타분야 해결 선행이다.
  tags:
  - nuisance-separation
  - identifiability
- text: Spatial+는 원래 response를 유지하므로 model comparison이 가능하며 non-Gaussian response로 확장한다.
  tags:
  - model-based-baseline
limitations:
- text: 원문 Discussion은 covariate의 선형 효과를 사용한 분석이며 nonlinear 효과의 확장을 향후 질문으로 남긴다.
  tags:
  - task-coverage
  source: self
- text: Φ의 count-dependent 성분을 제거하는 SSP 설계와의 대응은 analyst 전이다. Fully collinear archive의 정보 부족이나 같은-K regret
    개선을 자동 해결하지 않는다.
  tags:
  - subset-cardinality
  - decision-regret
  source: analyst
