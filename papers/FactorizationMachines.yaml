problem: 희소한 입력 관측에서 feature 간 interaction을 공유 parameter로 추정한다.
core_idea: 2차 계수를 개별 자유변수 대신 latent-vector 내적 <v_i,v_j>로 나타낸다. 작은 factor 차원은 interaction 추정에 구조적 공유를 주며
  예측을 효율적으로 계산한다.
key_assumptions:
- 작은 factor 차원의 구조적 제약이 데이터에 적합해야 한다. 원 논문의 sparse data는 입력 관측의 sparsity이며 coefficient sparsity와 구별한다.
strengths:
- text: §III Eq.(1)–(3)은 dense한 pairwise 값도 factorized parameter로 공유하는 대조를 제공한다.
  tags:
  - low-rank-interactions
  - basis-dependence
limitations:
- text: 동일한 real vector를 모든 v_i에 두면 pair 계수는 ||v||²≥0이다. 이 rank-1 예는 양의 quadratic count 성분에는 맞지만 음의 곡률
    전부나 실제 학습 성공을 보장하지 않는다.
  tags:
  - subset-cardinality
  - low-rank-interactions
  source: analyst
- text: 작은 rank FM과 자유 quadratic horseshoe는 함수공간·추정 방식도 달라진다. 성능 차이를 prior만의 인과효과로 부를 수 없다.
  tags:
  - eval-protocol
  source: analyst
