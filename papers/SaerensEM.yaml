citation:
  type: article
  title: "Adjusting the Outputs of a Classifier to New A Priori Probabilities: A Simple Procedure"
  authors: ["Marco Saerens", "Patrice Latinne", "Christine Decaestecker"]
  year: 2002
  journal: "Neural Computation"
  publisher: "MIT Press"
  volume: 14
  pages: "21--41"
