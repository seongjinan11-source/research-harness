id: EvolutionOrIllusion
title: "Evolution or Illusion? Rethinking Evaluation in LLM Evolutionary Search"
authors: "Tal Oved, Roi Pony, Oshri Naparstek, Udi Barzelay"
venue: "arXiv 2026"
year: 2026
