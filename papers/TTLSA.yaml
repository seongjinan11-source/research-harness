id: TTLSA
title: 'Beyond Invariance: Test-Time Label-Shift Adaptation for Addressing "Spurious" Correlations'
authors: "Qingyao Sun, Kevin P. Murphy, Sayna Ebrahimi, Alexander D'Amour (Cornell / Google DeepMind / Google Cloud AI Research)"
venue: "NeurIPS 2023"
year: 2023
links:
