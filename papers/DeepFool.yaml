problem: Classifier 결정을 바꾸는 작은 input perturbation을 계산한다.
core_idea: Affine multiclass boundary까지의 거리를 구하고 nonlinear classifier를 국소 선형화해 perturbation을
  갱신한다.
key_assumptions:
- 본문의 모델·관측·입력 가정 안에서 해석하며 SSP의 count-dependent adaptive 정책으로 보장을 자동 이전하지 않는다.
strengths:
- text: Affine margin을 normal norm으로 나눈 exact perturbation radius의 직접 선행이다.
