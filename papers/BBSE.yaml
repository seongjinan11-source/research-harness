areas: [ml-foundations]
problem: "Label shift(p(y)는 바뀌고 p(x|y)는 그대로)에서, 고차원 입력의 density를 직접 추정하지 않고 target label 분포를 추정하고, shift를 검출하고, classifier를 보정하는 방법을 찾는다."
core_idea: "임의의 black-box predictor f를 하나 정하고, labeled source holdout에서 f의 예측과 참 label의 결합 confusion matrix C를 추정한다. Label shift 아래에서는 target에서의 f 예측 분포 μ가 C와 class별 importance weight w(y)=q(y)/p(y)의 곱과 같다는 moment 등식이 성립하므로, ŵ = Ĉ⁻¹μ̂으로 weight를 구한다(BBSE). 출력이 hard label이든 확률(soft)이든 같은 방식이 통한다. 검출(BBSD)은 1차원 predictor 출력 분포에 대한 two-sample test로 줄이고, 보정(BBSC)은 음수를 0으로 자른 ŵ로 importance-weighted ERM을 다시 돌린다."
key_assumptions:
  - "Label shift: p(x|y)가 source와 target에서 같다."
  - "Target에 있는 class는 source에도 있다(support)."
  - "Predictor의 기대 confusion matrix가 invertible이다. Predictor가 정확하거나 calibrated일 필요는 없지만, class마다 예측 분포가 선형 독립이어야 한다."
  - "Confusion matrix를 추정할 labeled source holdout이 있다."
strengths:
  - text: "Predictor가 편향되거나 uncalibrated여도 invertible confusion matrix만 있으면 consistent하다. 고차원 x의 density나 kernel 추정 없이 k×k 선형계 하나로 target label 분포를 얻는다."
    tags: [label-shift, inference-cost]
  - text: "Weight 오차가 confusion matrix의 최소 singular value σ_min의 제곱에 반비례하고 표본 수에 따라 줄어든다는 유한표본 bound를 준다. 언제 추정이 불안정해지는지가 식으로 드러난다."
    tags: [label-shift, identifiability, theory-gap]
  - text: "Shift 검출을 고차원 two-sample test 대신 1차원 predictor 출력 분포의 검정으로 바꾸어, shift가 없을 때 type I error를 지키고 kernel B-test보다 검정력이 높았다(MNIST)."
    tags: [label-shift, distribution-shift]
  - text: "MNIST·CIFAR-10의 tweak-one, knock-out, Dirichlet shift에서 weight 추정이 KMM보다 정확하고, KMM이 O(n³) 비용으로 못 가는 규모에서도 돌아간다."
    tags: [label-shift, model-based-baseline]
limitations:
  - text: "σ_min이 0에 가까우면(predictor가 class를 잘 구분하지 못하면) 추정이 불안정하고, 0이면 방법이 성립하지 않는다. 퇴화한 confusion matrix에는 soft prediction, class 병합, pseudo-inverse를 대안으로 든다."
    tags: [identifiability, label-shift]
    source: self
  - text: "Target에서 드문 class의 weight가 음수로 추정될 수 있어 0으로 잘라야 한다."
    tags: [label-imbalance, label-shift]
    source: self
  - text: "x와 y에 함께 영향을 주는 숨은 confounder가 있으면 label shift도 covariate shift도 성립하지 않는다. 저자들은 그래도 유한표본에서 근사로 쓸모가 있을 수 있다고만 말한다."
    tags: [distribution-shift, selection-bias]
    source: self
  - text: "Shift가 없는데 보정을 적용하면 classifier를 해칠 수 있어 검출을 먼저 하라고 권한다. 데이터가 매우 작으면 BBSE 보정이 baseline보다 나쁠 수 있다고 보고한다."
    tags: [label-shift, robustness]
    source: self
  - text: "[analyst] 같은 시기의 EM 기반 prior 추정(Saerens 등)과 실험 비교가 없다. 두 추정기가 언제 갈리는지는 이 논문만으로 알 수 없다."
    tags: [eval-protocol, label-shift]
    source: analyst
builds_on: [SaerensEM, KMM]
compared_against: [KMM, kernel-B-test, unweighted-ERM]
open_questions:
  - "Confusion matrix를 추정하는 holdout 자체가 target과 다른 방식으로 선택되었을 때(p(x|y)가 holdout과 target 사이에서 다를 때) BBSE의 moment 등식은 얼마나 깨지는가?"
  - "집단마다 따로 weight를 추정해야 할 때, 집단별 표본이 적어 σ_min이 작아지는 문제를 집단 간 정보 공유로 완화할 수 있는가?"
hooks:
  - "(BSEL, per-community prior 추정) BBSE를 community마다 적용하려면 community별 confusion matrix가 필요한데, commconc에서는 많은 community에 context 노드가 거의 없거나 일부 class만 있다. 그 결과 σ_min이 작아져 오차 bound가 커지거나 행렬이 퇴화한다. 또 confusion matrix를 context에서 추정하면 그 context가 이미 community 기준으로 선택된 것이라, 저자들이 요구한 'holdout과 target 사이 p(x|y) 불변'이 깨진다. 이 프로젝트에서 라벨 없는 per-community prior 추정기가 선택 편향을 물려받은 관찰(BSEL-F04)과 같은 경로다."
  - "(BSEL-L01과의 관계) BBSE로 얻는 것은 (community, class)별 상수 weight이므로, prior 추정이 정확해도 within-community pairwise AUC는 바뀌지 않는다. BBSE를 BSEL 기준선으로 쓴다면 AUC보다 bAcc나 community 간 쌍에서의 효과로 판정해야 한다."
notes: "arXiv v3(ICML 2018 게재 표기)와 ar5iv 본문을 읽었다. PMLR 페이지의 저자 표기는 Zachary Lipton, Yu-Xiang Wang, Alexander Smola이고 arXiv는 Zachary C. Lipton, Alex Smola로 적는다. citation은 PMLR 표기를 따랐다. 편집자는 Jennifer Dy, Andreas Krause."
