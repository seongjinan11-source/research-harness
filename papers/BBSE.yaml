id: BBSE
title: "Detecting and Correcting for Label Shift with Black Box Predictors"
authors: "Zachary C. Lipton, Yu-Xiang Wang, Alex Smola"
venue: "ICML 2018"
year: 2018
links:
  paper: https://arxiv.org/abs/1802.03916
  proceedings: https://proceedings.mlr.press/v80/lipton18a.html
citation:
  type: inproceedings
  title: "Detecting and Correcting for Label Shift with Black Box Predictors"
  authors: ["Zachary Lipton", "Yu-Xiang Wang", "Alexander Smola"]
  year: 2018
  booktitle: "Proceedings of the 35th International Conference on Machine Learning"
  publisher: "PMLR"
  volume: 80
  pages: "3122--3130"
