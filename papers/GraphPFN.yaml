# 파일명 = id.yaml. 설명은 한국어, 용어는 영어 그대로. 원문 문장 복사 금지(요약·의역).
id: GraphPFN
title: "GraphPFN: A Prior-Data Fitted Graph Foundation Model"
authors: "Dmitry Eremeev, Oleg Platonov, Gleb Bazhenov, Artem Babenko, Liudmila Prokhorenkova (Yandex Research / HSE)"
venue: "ICML 2026"
year: 2026
links:
  paper: https://arxiv.org/abs/2509.21489
  code: https://github.com/yandex-research/graphpfn
  openreview: https://openreview.net/forum?id=340Ep8sfJ3
areas: [graph-fm, pfn, tabular-fm]
problem: "G2T-FM·TAG처럼 hand-crafted graph feature를 붙여 tabular foundation model에 넘기는 방식에서 벗어나, 그래프 위에서 직접 사전학습된 PFN으로 node classification·regression을 in-context learning과 finetuning 모두에서 풀고자 한다."
core_idea: "Backbone은 TabPFNv2 계열의 tabular PFN인 LimiX이며, 각 노드(sample)의 각 feature가 하나의 token이 되는 2축 token grid 구조를 그대로 쓴다. 저자들은 매 LimiX block 끝에 adjacency를 mask로 쓰는 multi-head attention adapter를 붙인다. 이 adapter는 sample 축을 따라 1-hop 이웃끼리만 정보를 교환하는 message passing 역할을 하고, feature token마다 독립적으로 같은 graph mask를 적용한다. Synthetic prior는 두 단계로 만든다. 구조는 여러 개의 SBM을 겹친 multi-level SBM에 preferential attachment로 저차수 주변부 노드를 덧붙여 생성한다. Attribute와 target은 TabICL식 MLP SCM에서 일부 neuron을 GNN aggregation neuron으로 바꾸고 degree·PageRank를 입력에 섞은 graph-aware SCM으로 생성한다. 사전학습은 LimiX checkpoint에서 출발해 backbone을 얼리고 adapter만 약 160만 개 synthetic graph로 학습하며, PFN supervised loss에 masked graph modeling(edge 복원) loss를 더한다. 추론은 가중치를 고정한 ICL(10회 ensemble, 8개 random feature 추가)과 전체 모델 finetuning 두 모드를 모두 지원한다."
key_assumptions:
  - "LimiX가 tabular 데이터에서 배운 feature·label 처리 능력이 node attribute에도 그대로 통하며, 그래프 정보는 backbone을 얼린 채 adapter만으로 주입할 수 있다고 가정한다."
  - "실제 그래프는 대부분 community 구조와 core-periphery 구조를 가진 social·information network류라고 보고, prior를 이 형태에 맞춰 설계했다."
  - "노드 target은 이웃 정보의 국소적 aggregation(층마다 1-hop)으로 설명된다고 본다. 따라서 수용 영역은 backbone block 수로 정해진다."
  - "전체 그래프와 모든 노드의 feature token이 한 번에 GPU 메모리에 올라간다고 가정하고, 분류는 기본적으로 10개 이하 class만 다룬다."
  - "사전학습에서 context 노드는 무작위로 뽑히고 평가도 random 10%/10%/80% split이다. 즉 라벨 노드가 그래프 전체에 고르게 퍼져 있다는 설정을 암묵적으로 깔고 있다."
strengths:
  - text: "Hand-crafted graph feature(Laplacian PE, PageRank, 이웃 평균 등)에 기대지 않고, 모델 안에서 adjacency-masked attention으로 message passing을 직접 학습한다. 그 결과 ICL만으로도 G2T-FM·TAG와 튜닝된 GNN보다 평균 rank가 높고, 무거운 전처리도 필요 없다."
    tags: [graph-structure-use]
  - text: "LimiX의 per-feature tokenization을 그대로 물려받아, 데이터셋마다 feature 개수가 달라도 차원 축소 없이 하나의 모델로 처리한다. 같은 모델이 node classification과 node regression을 모두 다룬다."
    tags: [feature-heterogeneity, task-coverage]
  - text: "Graph prior가 구조(multi-level SBM + preferential attachment)와 attribute(MLP·GNN neuron 혼합 SCM)를 분리해 설계되어 있고, 그래프 의존 정도를 mixing 확률로 조절할 수 있다. 부록 분석에서 synthetic graph의 평균 차수·clustering·power-law 적합도 분포가 실제 GraphLand 그래프 통계를 대체로 덮는다."
    tags: [prior-mismatch, pretraining-data]
  - text: "ICL과 finetuning을 모두 지원하며, finetuning 시 13개 데이터셋 중 11개에서 최고 성능을 낸다. 같은 구조에 random adapter를 붙여 finetuning하면 성능이 크게 떨어지므로, 이득이 구조가 아니라 사전학습에서 온다는 점을 보였다."
    tags: [adaptation, zero-shot-gap]
  - text: "LimiX에서 warm-start하고 adapter만 학습하므로 사전학습이 A100 8장으로 약 36시간에 끝난다. ICL 추론 시간은 GCN을 처음부터 학습하는 것과 같은 자릿수이고, 하이퍼파라미터 탐색이 필요 없다."
    tags: [inference-cost]
limitations:
  - text: "구현이 전체 데이터셋(그래프)을 한 번에 처리해야 하므로 메모리 사용이 크고, 아주 큰 그래프로 확장하기 어렵다. 저자들은 TabICL 같은 메모리 효율적 backbone이나 subgraph sampling을 해법 후보로 든다."
    tags: [graph-scale, context-scale]
    source: self
  - text: "Graph prior가 social·information network에 맞춰져 있어 traffic network 같은 공간·기하 구조 그래프는 덮지 못한다. 저자들은 geometric graph 같은 random graph model 추가를 향후 과제로 남긴다."
    tags: [prior-mismatch]
    source: self
  - text: "LimiX backbone의 제약을 그대로 물려받아 multiclass는 기본적으로 10개 class까지만 지원한다. ECOC로 우회할 수 있으나, class가 많은 hm-categories에서는 ICL 성능이 GNN보다 낮았다."
    tags: [label-space]
    source: self
  - text: "Node-level task 전용이다. Masked graph modeling head를 사전학습에 넣었지만 예측은 여전히 node label에 크게 의존하므로, link prediction과 graph-level task에는 바로 쓸 수 없다."
    tags: [task-coverage]
    source: self
  - text: "사전학습 seed에 따라 ICL 성능이 0.3~0.7%p 표준편차로 흔들린다. 저자들은 사전학습 절차의 안정성 개선을 과제로 인정한다."
    tags: [training-stability]
    source: self
  - text: "부록의 prior ablation에서 단순 degree-corrected SBM으로 사전학습해도 제안한 multi-level SBM + PA prior와 비슷하거나 일부 데이터셋에서 더 좋았다. 저자들도 이전 revision과 결과가 달라졌음을 인정하고, 제안 prior는 일관성과 다양성 때문에 유지했다고 설명한다. 즉 새 graph prior의 성능상 기여는 최종본에서 뒷받침되지 않는다."
    tags: [prior-mismatch, pretraining-data]
    source: self
  - text: "Feature 차원이 높은 text-embedding 데이터셋(amazon-ratings, questions)은 finetuning이 불가능해 PCA로 64차원까지 줄여야 했다. PCA를 쓰면 성능이 크게 떨어지는 pubmed(500차원)는 finetuning 중 메모리 부족이 나서 ICL 결과로 대신 보고했다."
    tags: [feature-heterogeneity, context-scale]
    source: self
  - text: "후속 재평가에서 GraphPFN은 finetuning 시 10개 GraphLand 데이터셋 모두 1위였지만, 추론 비용과 메모리가 튜닝된 GNN보다 훨씬 컸다. GNN 추론은 1초 미만인데 GraphPFN은 수 초에서 수 분이 걸렸고, 일부 데이터셋에서는 학습 peak 메모리가 80GB GPU 한 장을 넘어 model parallelism이 필요했다. 수백만 노드 규모 데이터셋은 평가 대상 GFM 모두가 처리하지 못해 제외되었다. (GraphPFN 저자 일부가 쓴 논문이다.)"
    tags: [inference-cost, graph-scale]
    source: cited
    by: "A Fair Evaluation of Graph Foundation Models for Node Property Prediction (2026)"
    by_link: https://arxiv.org/abs/2606.24509
  - text: "GraphPFN의 adapter 방식은 graph attention이 message passing을 하도록 전체 그래프를 가속기 메모리에 올려 두고, 학습 table 전체를 context로 쓴다고 지적한다. 그래서 peak 메모리가 노드 수뿐 아니라 그래프 크기와 feature 수에 따라 커진다. 이 논문은 GraphPFN checkpoint를 그대로 둔 채 예산을 정한 subgraph context만 구성해도 정확도가 비슷하거나 조금 높게 나온다고 보고한다. 예를 들어 artnet-exp에서 peak 메모리가 약 19.6GB에서 8.2GB로 줄었다."
    tags: [context-scale, graph-scale, inference-cost]
    source: cited
    by: "LoGIC: Budgeted Context Construction for Node-Level Graph In-Context Learning with Tabular Foundation Models (2026)"
    by_link: https://arxiv.org/abs/2609.05955
  - text: "대규모 node classification benchmark에서 GraphPFN은 가장 강한 GFM이었지만, 데이터셋 조건별로 보면 강한 homophily, 고차원 feature, 심하게 불균형한 target에서 튜닝된 GNN(GCNII, GPRGNN)에 뒤졌다. 10개 초과 class task도 불리했다. 라벨을 50%까지 늘려도 고차원 feature·불균형 target·다중 class 약점은 남았다. 저자들은 사전학습 표현을 새 그래프에 적응시키는 능력의 한계로 해석한다."
    tags: [label-imbalance, feature-heterogeneity, label-space, graph-structure-use]
    source: cited
    by: "NodeGround: A Node Classification Benchmark in the Graph Foundation Model Era (2026)"
    by_link: https://arxiv.org/abs/2609.39673
  - text: "GraphPFN 같은 message passing 기반 foundation model은 구조적 수용 범위가 network 깊이에 고정되어 추론 시 조절할 수 없고, 표현력도 표준 message passing 범위에 묶인다고 지적한다. 실제로 node feature가 없는 구조 위주 task에서 GraphPFN은 크게 실패했다(Grids 23.3% vs random-walk 기반 Wander 96.6%)."
    tags: [graph-structure-use]
    source: cited
    by: "To Learn is to Wander: Learning Across Graphs and Tasks with Random Walks (2026)"
    by_link: https://arxiv.org/abs/2610.06694
  - text: "[analyst] ICL만 놓고 보면 G2T-LimiX 대비 우위가 크지 않다. GraphLand 전체 평균 rank는 3.50 대 3.88이고, tolokers-2·avazu-ctr·city-roads-M에서는 G2T-LimiX가 앞선다. 헤드라인의 큰 격차는 대부분 finetuning에서 나온다. 또 twitch-views처럼 random feature 추가 여부로 성능이 크게 바뀌는 데이터셋이 있어, 일부 이득은 추론 시 trick에도 기대고 있다."
    tags: [zero-shot-gap, eval-protocol]
    source: analyst
  - text: "[analyst] 부록 통계에서 synthetic graph의 homophily는 중앙값 0.01, 상위 25% 경계가 0.08로 0 근처에 몰려 있다. 반면 city-reviews(0.69) 같은 강한 homophily 그래프는 prior 분포의 꼬리에 있다. NodeGround가 보고한 강한 homophily 조건에서의 열세와 맞아떨어지며, prior의 라벨-구조 결합 분포가 한쪽으로 치우쳐 있을 가능성을 시사한다. Class 비율도 SCM target 이산화에 맡겨져 있어 명시적으로 통제되지 않는다."
    tags: [prior-mismatch, label-imbalance]
    source: analyst
builds_on: [LimiX, TabPFNv2, TabICL, PFN, G2T-FM, MaskGAE]
compared_against: [GCN, GraphSAGE, GAT, GraphTransformer, LightGBM-NFA, OpenGraph, AnyGraph, TS-GNN, SAMGPT, MDGFM, GCOPE, G2T-FM, TAG, NodePFN]
open_questions:
  - "단순 DC-SBM prior로도 성능이 거의 같다면, transfer를 실제로 좌우하는 prior 성질은 무엇인가? 구조 생성기보다 attribute SCM(GNN neuron 비율, homophily 분포)이나 context 구성 쪽이 더 중요한지 분해 실험이 없다."
  - "Backbone을 얼리고 adapter만 학습하는 recipe에서, label을 다루는 sample-level attention은 사전학습 동안 전혀 바뀌지 않는다. 라벨 분포·class 수처럼 label 쪽 prior를 바꾸고 싶을 때도 adapter만으로 충분한가?"
  - "전체 그래프를 한 번에 올리는 방식 대신 subgraph·budgeted context로 바꿀 때, 어떤 context 선택이 성능을 유지하는가? LoGIC는 가능성을 보였지만 사전학습 단계부터 subgraph episode로 학습하는 경우는 다루지 않았다."
  - "층마다 1-hop인 adapter로는 long-range·feature 없는 구조 task를 못 푼다. Random walk나 positional encoding 같은 구조 인터페이스를 PFN에 결합하면서 per-feature tokenization의 장점을 유지할 수 있는가?"
hooks:
  - "(불균형 context, ImbNodePFN 재현) GraphPFN은 사전학습에서 context 노드를 무작위로 뽑는다. 이는 instance-balanced sampling에 해당하고, class 비율은 SCM target 이산화에 맡겨져 있다. 또 LimiX backbone은 얼어 있고 adapter만 학습된다. 그래서 label skew를 prior에 넣는 재현은 두 갈래로 설계하는 것을 추천한다. 첫째는 GraphPFN recipe 그대로 adapter-only로 skewed context episode를 이어서 학습하는 것이다. 이는 label 처리부가 고정된 상태에서 graph channel만으로 skew 대응을 배울 수 있는지 보는 실험이 된다. 둘째는 LimiX까지 풀어 학습하는 ablation이다. NodeGround가 GraphPFN이 심한 불균형 target에서 GNN에 뒤진다고 독립적으로 보고했으므로 외부 motivation으로 쓸 수 있다. 평가는 10개 이하 class 데이터셋으로 제한하는 것이 깔끔하다. ECOC를 쓰면 class 코딩이 minority 처리 자체를 바꿔 결과 해석이 섞인다. Adapter가 labeled·unlabeled 노드 사이에 양방향으로 message를 보내므로, 라벨 위치만 바꾸는 selection study도 GraphPFN에서 자연스럽게 재현할 수 있다."
  - "(이질 feature 공간, per-graph codebook) GraphPFN은 tSVD 대신 per-feature token으로 feature 이질성을 푼다. 하지만 비용이 노드 수와 feature 수의 곱으로 커져서, 고차원 text feature는 결국 PCA 64차원으로 줄였고 pubmed는 finetuning에서 메모리 부족이 났다. NodeGround도 고차원 feature를 GraphPFN의 지속적 약점으로 꼽는다. 따라서 per-graph codebook 인터페이스는 tSVD(NodePFN)와 PCA+per-feature token(GraphPFN) 사이의 중간 지점으로 포지셔닝할 수 있다. pubmed·questions·amazon-ratings·wiki-cs 같은 고차원 데이터셋에서 세 인터페이스의 정확도와 peak 메모리를 같은 표에 놓는 것이 가장 직접적인 비교다."
  - "(그래프 구조를 넣은 MVTS PFN) GraphPFN의 adapter 설계는 시계열 PFN에 거의 그대로 옮길 수 있다. Sensor graph를 mask로 쓰는 attention을 variable 축에 걸고, 매 block 뒤에 붙인 뒤 backbone은 얼리고 adapter만 synthetic graph-MVTS prior로 학습하는 방식이다. 다만 GraphPFN 저자들 스스로 SBM+PA prior가 traffic·도로망 같은 기하 구조 그래프를 덮지 못한다고 인정했다. 실제로 도로 그래프인 city-roads-M에서는 Erdős–Rényi prior도 경쟁력이 있었다. 그러므로 PEMS 실험에는 geometric·planar graph prior가 필요해 보인다. 지금 돌리는 실제 이웃 vs 섞은 이웃 점검은 GraphPFN의 random adapter 대조 실험과 같은 논리이므로, 같은 형식으로 보고하면 설득력이 생긴다."
added: 2026-10-30
