areas: [ml-foundations]
problem: "Label이 전혀 없고 여러 domain에서 온 데이터만 있을 때, domain마다 class 비율은 다르지만 class-conditional p(x|y)는 같다면 그 차이를 이용해 잠재 class 자체와 domain별 class 비율·classifier를 복원할 수 있는가를 묻는다."
core_idea: "핵심 원리는 domain 사이에서 함께 비율이 변하는 입력끼리 같은 class로 묶는다는 것이다. 이산 입력에서는 이 설정이 topic modeling과 동형이다(입력=단어, domain=문서, class=topic). 연속 입력에서는 domain discriminator p(d|x)가 충분 통계량 역할을 하고, class마다 그 class만 만드는 anchor 영역이 있으면 discriminator 출력 공간의 polytope 꼭짓점이 class에 대응해 p(y|d)가 permutation을 빼고 식별된다. 실제 알고리즘 DDFA는 domain discriminator를 학습하고(Discriminate), 그 출력을 clustering해 이산화하고(Discretize), cluster×domain 빈도표에 NMF를 적용해 p(y|d)를 얻은 뒤(Factorize), Bayes 규칙으로 domain별 posterior를 만든다(Adjust)."
key_assumptions:
  - "모든 domain에서 p(x|y)가 같다(latent label shift)."
  - "Domain 수가 class 수 이상이고, class×domain 비율 행렬이 full rank이다."
  - "Class마다 그 class에만 속하는 anchor subdomain이 일정 질량 이상 있다."
  - "Domain이 균등하게 표현되며(resampling으로 맞출 수 있음), class 수 k를 안다."
strengths:
  - text: "Label 없이도 domain 간 class 비율 차이만으로 잠재 class와 domain별 prior를 식별하는 조건을 준다. Label shift를 보정 대상이 아니라 비지도 학습의 신호로 쓴다."
    tags: [label-shift, identifiability]
  - text: "Prior 추정에 labeled source를 쓰지 않고 domain 표지와 모든 unlabeled 입력만 쓴다. 따라서 labeled 집합의 선택 방식에 기대지 않는다."
    tags: [label-shift, selection-bias]
  - text: "Feature 유사도가 class와 어긋나는 데이터(FieldGuide: 같은 종의 애벌레와 성체)에서 SCAN을 크게 이겼다(FieldGuide-2 최희소 설정 0.947 대 0.589). CIFAR-20에서도 희소한 class-domain 구조에서 큰 차이가 났다(0.807 대 0.445)."
    tags: [label-shift, robustness]
limitations:
  - text: "필요한 가정 집합에 묶여 있다고 저자들이 인정한다. 특히 domain 수 ≥ class 수, full rank, anchor 조건, 알려진 k가 필요하다."
    tags: [identifiability]
    source: self
  - text: "DDFA의 유한표본 bound가 없고, discriminator 출력에 noise가 있을 때 clustering heuristic이 순수한 anchor cluster를 찾는다는 보장도 없다."
    tags: [theory-gap, identifiability]
    source: self
  - text: "평가가 domain별 class 비율을 Dirichlet으로 뽑은 semi-synthetic 실험뿐이고, 자연스러운 domain shift에서는 검증하지 않았다. SCAN과의 비교도 DDFA만 domain 정보를 쓰므로 공정 비교가 아니라고 저자들이 밝힌다."
    tags: [eval-protocol]
    source: self
  - text: "[analyst] 결과가 class-domain 구조가 희소할수록 좋고 조밀하면 SCAN과 비슷해진다. 즉 domain별 class 구성이 충분히 달라야 신호가 생긴다."
    tags: [label-shift, identifiability]
    source: analyst
builds_on: [BBSE, topic-modeling-anchor-words, NMF]
compared_against: [SCAN]
open_questions:
  - "Domain마다 class와 무관한 feature offset이 있어 p(x|y, d)가 d에 의존하면, domain discriminator는 class가 아니라 domain 고유 신호를 배우게 되는가?"
  - "Labeled 노드가 일부 있을 때, DDFA식 비지도 prior 추정과 labeled 정보를 어떻게 결합하는가?"
hooks:
  - "(BSEL, community를 domain으로) Community를 domain으로 보면, 각 community의 class 비율 p(y|community)를 context 라벨 없이 그래프 전체 unlabeled 노드에서 추정하는 길이 된다. 이 프로젝트의 라벨 없는 per-community prior 추정기들은 편향 선택된 context나 PFN posterior에서 출발해 선택 편향을 물려받았는데(BSEL-F04), DDFA는 context를 쓰지 않으므로 그 경로를 피한다는 점이 다르다(가설)."
  - "(BSEL, 가정 위반 위험) 다만 DDFA는 p(x|y)가 domain 간 같다고 가정한다. BSEL-F03·L03은 실데이터의 community feature offset이 class와 얽혀 있음을 보였으므로, domain discriminator가 class 신호 대신 community offset을 배울 위험이 크다. 또 community 수가 class 수보다 많아야 하고 class마다 anchor 영역이 필요하다. 얻는 것도 per-(community,class) prior라서 BSEL-L01에 따라 within-community pairwise AUC는 직접 바꾸지 못한다. BSEL-P03의 O-prior 같은 상한과 먼저 비교할 진단 도구로 쓰는 편이 맞다."
notes: "arXiv v2 HTML 본문 앞부분(약 10만 자)을 읽었다. NeurIPS proceedings 페이지의 저자 표기는 Zachary Lipton(중간 이니셜 없음), arXiv는 Zachary C. Lipton이다. 쪽수는 페이지에 없고 DOI 10.52202/068431-1363만 있다. Manley Roberts와 Pranav Mani는 equal contribution."
