areas: [tsfm, mvts]
problem: "frequency, 변수 개수, 값의 분포가 제각각인 시계열 예측 문제를 하나의 사전학습 모델이 zero-shot으로 모두 처리하는 universal forecaster를 만드는 것이 목표다. 저자들은 이를 막는 걸림돌로 frequency 간 간섭, 임의 개수의 변수, 데이터마다 다른 예측 분포, 그리고 대규모 공개 사전학습 데이터의 부재를 든다."
core_idea: "모델은 patch 기반 masked encoder Transformer이고, 예측할 horizon 구간의 patch를 학습 가능한 [mask] embedding으로 바꿔 forward 한 번에 채운다. 첫째, frequency마다 미리 정한 patch size(8~128)를 쓰고 patch size별로 입력·출력 projection을 따로 둔다. 고주파 데이터는 큰 patch로 attention 비용을 줄이고 저주파 데이터는 작은 patch로 계산을 Transformer 쪽에 넘기려는 설계다. 둘째, 다변량 시계열은 모든 변수를 한 sequence로 펴고, 시간 위치는 RoPE로, 변수 구분은 같은 변수인지 아닌지만 가리는 학습 가능한 binary attention bias로 표시한다(Any-variate Attention). 셋째, 출력은 Student-t, negative binomial, log-normal, 분산이 작은 normal을 섞은 mixture distribution의 parameter이고 negative log-likelihood로 학습한다. 사전학습 데이터는 9개 도메인 약 276억 관측치의 공개 corpus LOTSA이며, 학습 때 context·prediction length와 변수 수를 무작위로 뽑고 sequence packing을 쓴다. 크기는 Small, Base, Large 세 가지이며 각각 14M, 91M, 311M 파라미터다."
key_assumptions:
  - "frequency가 적절한 patch size를 결정한다고 보고, frequency에서 patch size로 가는 대응표를 사람이 미리 정해 둔다."
  - "변수 축에는 같은 변수인지 아닌지만 알려 주면 충분하다고 본다. 변수의 의미나 변수 간 관계에 대한 사전 정보 없이, 값만 보고 어떤 변수가 서로 관련 있는지 알아낼 수 있다고 가정한다."
  - "서로 무관한 단변량 시계열을 무작위로 이어 붙여 만든 sample도 다변량 사전학습 데이터로 쓸 수 있다고 본다."
  - "instance normalization 뒤에 남는 모양 정보로 예측할 수 있다고 보고, 네 가지 component의 mixture면 실제 데이터의 예측 분포 대부분을 덮는다고 가정한다."
  - "학습 sample 하나는 변수와 patch를 합쳐 512 token 안에 들어간다고 가정한다. 사전학습에서 변수 수는 최대 128개, 평균 약 37개로 뽑는다."
strengths:
  - text: "다변량 시계열을 한 sequence로 펴고 변수 축은 binary attention bias로만 구분해서, 변수 개수가 몇 개든 하나의 모델로 받는다. 변수 순서나 번호를 바꿔도 출력이 그에 맞춰 바뀔 뿐 달라지지 않고, horizon 값이 알려진 dynamic covariate도 같은 sequence에 넣을 수 있다. 이 attention을 learned variate embedding으로 바꾸면 Monash 정규화 MAE가 0.655에서 0.904로 나빠졌다."
    tags: [channel-dependency, covariates, feature-heterogeneity]
  - text: "mixture distribution 출력으로 양수 count, 오른쪽으로 치우친 분포, 확신이 높은 구간을 한 head에서 다룬다. Student-t 하나로 바꾸면 Monash 정규화 MAE가 0.655에서 0.740으로 나빠졌고, peak 구간에서 대칭 분포가 부적절한 예측 구간을 내는 사례도 보였다."
    tags: [uncertainty]
  - text: "LOTSA, 학습 라이브러리 uni2ts, 모델 가중치를 모두 공개했다. LOTSA 대신 Monash와 GluonTS만으로 학습하면 in-distribution인 Monash에서도 정규화 MAE가 0.655에서 0.809로 나빠져, 데이터 다양성이 cross-domain 학습에 중요하다는 점을 보였다."
    tags: [pretraining-data]
  - text: "학습 때 window 길이와 예측 비율을 무작위로 뽑아서 하나의 모델이 임의의 context·prediction length를 처리한다. masked encoder라 horizon 전체를 forward 한 번으로 내므로 autoregressive decoding의 누적 오차와 반복 비용이 없다. ETTm1, Electricity, Weather에서는 context를 수천 step까지 늘릴수록 오차가 줄었는데, 기존 Transformer 예측 모델에서는 잘 나타나지 않던 성질이다."
    tags: [context-horizon, inference-cost]
  - text: "zero-shot 성능이 데이터셋별로 학습한 모델과 경쟁할 만하다. Monash in-distribution 평가에서는 크기와 상관없이 Monash 벤치마크의 모든 baseline보다 나았다. 학습에 쓰지 않은 6개 데이터셋의 확률 예측에서는 Base와 Large가 Walmart와 Istanbul Traffic을 빼고 모두 1위나 2위였고, 장기 예측에서도 full-shot 모델과 비슷하거나 나았다."
    tags: [zero-shot-gap]
  - text: "multi patch size와 sequence packing이라는 설계 선택의 효과를 ablation으로 보였다. multi patch size를 없애고 patch를 32로 고정하면 Monash 정규화 MAE가 0.655에서 1.156까지 나빠졌다. 길이가 제각각인 sample을 packing으로 묶어 padding 비율을 61%에서 0.4% 수준으로 낮췄고, 같은 compute에서 성능이 16% 좋아졌다."
    tags: [tokenization, inference-cost]
limitations:
  - text: "frequency마다 patch size를 미리 정해 두는 multi patch size 방식이 다소 heuristic이라고 저자들이 인정했다. 더 유연하고 깔끔한 cross-frequency 학습 방법을 향후 과제로 남겼다."
    tags: [tokenization]
    source: self
  - text: "현재 구조가 고차원 시계열을 제한적으로만 지원한다고 저자들이 밝혔다. 모든 변수를 한 sequence로 펴므로 변수 수만큼 token이 늘어나기 때문이며, Transformer 입력 길이를 효율적으로 늘리는 방법을 해법으로 들었다."
    tags: [channel-dependency, context-scale]
    source: self
  - text: "LOTSA의 도메인과 frequency 다양성을 더 늘려야 한다고 인정했다. 실제로 관측치의 59%가 Energy 도메인, 72%가 hourly 계열에 몰려 있다."
    tags: [pretraining-data]
    source: self
  - text: "자원 제약 때문에 hyperparameter 튜닝을 거의 하지 못했다고 밝혔다. 장기 예측에서 Large가 Base보다 일관성이 떨어지는 등 모델 크기와 성능의 관계가 약했는데, 저자들은 고정된 데이터 크기에서 나온 결과라 scaling의 가능성을 부정하는 증거는 아니며 시계열 모델용 scaling law 연구가 필요하다고 보았다."
    tags: [theory-gap]
    source: self
  - text: "LOTSA에 PeMS 기반 대규모 데이터(LargeST)를 넣었기 때문에 PEMS03/04/07/08, PEMS-Bay, 장기 예측 벤치마크의 Traffic처럼 같은 출처의 데이터셋은 더 이상 zero-shot 평가로 볼 수 없다고 저자들이 명시했다. 그래서 장기 예측 평가에서 Traffic을 뺐다."
    tags: [eval-protocol, pretraining-data]
    source: self
  - text: "zero-shot 비교 대상이 다른 universal forecaster가 아니라 각 데이터셋에서 학습한 full-shot 모델이다. 저자들은 공개 가중치가 있는 universal forecaster가 거의 없고, 모든 모델이 보지 않은 표준 held-out 데이터셋도 없어서 공정한 비교가 어렵다고 설명했다."
    tags: [eval-protocol]
    source: self
  - text: "Moirai의 frequency별 projection을 사람이 정한 specialization이라고 비판했다. frequency가 달라도 패턴이 비슷하거나 frequency가 같아도 패턴이 전혀 다른 경우가 많아서 frequency는 사전학습 데이터를 묶는 기준으로 믿기 어렵고, 짧은 window 안에서도 분포가 바뀌는 non-stationarity를 frequency 단위로는 담지 못한다는 것이 근거다. 실제로 MoE 모델 안에서 multi-patch 구성을 써 보니 single patch의 가장 나쁜 경우와 비슷한 성능에 그쳤다. Monash에서 Moirai는 Chronos를 넘지 못했다는 점도 적었다."
    tags: [tokenization, nonstationarity]
    source: cited
    by: "Moirai-MoE: Empowering Time Series Foundation Models with Sparse Mixture of Experts (ICML 2025)"
    by_id: Moirai-MoE
    by_link: https://arxiv.org/abs/2410.10469
  - text: "GIFT-Eval에서 Moirai는 foundation model 중 유일하게 multivariate 예측을 지원해서 다변량 데이터에서 다른 foundation model보다는 나았지만, 다변량 데이터 전체의 1위와 2위는 PatchTST와 iTransformer였다. 도메인별로는 Moirai와 Chronos가 대부분 상위였으나 Transport와 Web/CloudOps에서는 PatchTST, TFT 같은 deep learning 모델이 앞섰고, 저자들은 이 도메인 데이터의 높은 entropy와 lumpiness, 사전학습 데이터 부족을 원인으로 추정했다. Moirai의 사전학습 데이터가 GIFT-Eval 평가 데이터와 일부 겹친다는 점도 명시했다. GIFT-Eval에는 Moirai 저자 6명 중 5명이 참여했다."
    tags: [channel-dependency, eval-protocol, pretraining-data]
    source: cited
    by: "GIFT-Eval: A Benchmark For General Time Series Forecasting Model Evaluation (2024)"
    by_id: GIFT-Eval
    by_link: https://arxiv.org/abs/2410.10393
  - text: "같은 Salesforce 그룹의 후속작이 Moirai의 핵심 설계를 대부분 되돌렸다. masked encoder는 sample 하나당 loss를 한 번만 내고 가려진 일부 token만 loss에 참여해서 데이터 활용이 비효율적이고, 반복 예측 때마다 key-value를 처음부터 다시 계산해야 한다고 지적했다. multi-patch 구성은 frequency 간 학습을 오히려 제약했다고 보고 single patch로 바꿨다. mixture distribution 출력은 실제로는 효과가 덜하고 설계와 최적화를 복잡하게 만들며, NLL이 outlier에서 variance collapse나 불안정한 gradient를 겪을 수 있다며 quantile loss로 대체했다. multivariate 예측과 covariate 지원은 이득이 거의 없었다며 아예 뺐고, 그런 성질을 가진 고품질 데이터가 부족한 탓으로 추정했다."
    tags: [channel-dependency, covariates, uncertainty, tokenization]
    source: cited
    by: "Moirai 2.0: When Less Is More for Time Series Forecasting (2025)"
    by_link: https://arxiv.org/abs/2511.11698
  - text: "Moirai가 같은 데이터 출처의 변수들은 서로 상관돼 있다고 암묵적으로 가정하고, 아무 filtering 없이 모든 변수의 token 사이에 관계를 맺는다고 비판했다. 그 결과 약하게 관련되거나 무관한 변수에서 noise가 들어오고 학습 비용도 커질 수 있다는 주장이다. 대안으로 fine-tuning 단계에서 변수 간 주파수 spectrum 유사도로 adjacency를 샘플링해서 관련 있는 변수끼리만 attention하게 막는 graph learning layer를 제안했다."
    tags: [robustness, channel-dependency]
    source: cited
    by: "Time Tracker: Mixture-of-Experts-Enhanced Foundation Time Series Forecasting Model with Decoupled Training Pipelines (2025)"
    by_link: https://arxiv.org/abs/2505.15151
  # review: ICML 2024 OpenReview forum(https://openreview.net/forum?id=Yd8eHMY1wz)은 브라우저 검증에 막혀 열 수 없었고 ICML은 리뷰를 공개하지 않아 미기재.
  - text: "[analyst] zero-shot 결과의 상당 부분이 target 데이터셋의 validation 구간으로 추론 설정을 고른 결과다. 확률 예측에서는 context length(1000~5000)와 patch size를 validation CRPS로 골랐고, 장기 예측에서는 ETT와 Weather에 대해 channel-independent와 channel mixing 중 무엇을 쓸지까지 validation MSE로 골랐다. 고정된 context로 평가하는 다른 zero-shot 모델과 같은 기준이라고 보기 어렵고, 어느 전략이 선택됐는지도 보고하지 않는다."
    tags: [zero-shot-gap, eval-protocol]
    source: analyst
  - text: "[analyst] Any-variate Attention이 다변량 정보를 실제로 써서 이득을 내는지는 검증되지 않았다. 해당 ablation은 LOTSA에 모두 target 1개짜리로 들어 있는 Monash 데이터셋에서만 했고, 비교 대상도 channel-independent 처리가 아니라 다른 variate encoding이었다. 게다가 사전학습의 다변량 sample 일부는 서로 무관한 단변량 시계열을 이어 붙여 만든 것이라, 모델이 변수 간 관계를 쓰는 법을 배웠는지 무시하는 법을 배웠는지 이 논문만으로는 알 수 없다."
    tags: [channel-dependency, robustness]
    source: analyst
builds_on: [PatchTST, RevIN, RoPE, TableFormer, DeepAR, "masked encoder forecaster (Woo et al. 2023)"]
compared_against: [PatchTST, TiDE, TFT, DeepAR, AutoARIMA, Seasonal Naive, iTransformer, TimesNet, Crossformer, DLinear, SCINet, FEDformer, LLMTime, N-BEATS, ETS, Theta, TBATS, CatBoost]
open_questions:
  - "frequency별 patch size heuristic 없이 cross-frequency 학습을 할 수 있는가. 이 논문의 dense masked encoder에서는 patch를 32로 고정하면 크게 나빠졌는데, 후속작 Moirai-MoE(decoder + MoE)와 Moirai 2.0(dense decoder)은 single patch가 오히려 낫다고 보고했다. 차이가 학습 목표에서 오는지 patch 크기 선택에서 오는지는 아직 분리되지 않았다."
  - "flattened any-variate attention은 어떤 조건에서 다변량 정보로 이득을 보고, 어떤 조건에서 무관한 변수 때문에 손해를 보는가. 변수 수의 제곱으로 커지는 attention 비용은 어떻게 줄일 것인가."
  - "고정된 LOTSA에서 Large가 Base보다 꾸준히 낫지 않은 이유는 무엇인가. 시계열 foundation model의 scaling law는 어떤 모양인가."
  - "LOTSA와 출처까지 겹치지 않는 평가셋에서 zero-shot 우위가 얼마나 남는가."
hooks:
  - "nuisance context: Moirai는 모든 stream을 한 sequence로 펴서 full attention을 하고, 변수 축에는 같은 변수인지만 가리는 bias 두 개밖에 없다. 어떤 stream이 대상 변수와 관련 있는지에 대한 사전 정보 없이 모든 stream이 대상 token의 attention에 직접 들어간다는 뜻이다. 그런데 사전학습에서는 서로 무관한 단변량 시계열을 이어 붙인 sample을 많이 봤으므로, 무관한 stream을 무시하도록 이미 학습됐는지가 nuisance-context audit으로 바로 검증할 수 있는 질문이 된다. 같은 가중치에 대상 변수만 넣은 입력과 nuisance stream을 추가한 입력을 비교하면 모델 차이 없이 context 효과만 분리된다. Moirai 2.0이 multivariate 지원을 이득이 없다며 뺀 것, Time Tracker가 filtering 없는 변수 간 attention을 비판한 것, GIFT-Eval에서 channel-independent인 PatchTST가 다변량 데이터 1위였던 것은 모두 이 연구의 동기로 인용할 수 있다."
  - "obsolete history: Moirai는 context length를 validation으로 1000~5000 중에서 고르고, 논문에서는 context가 길수록 오차가 줄었다. regime shift가 있는 데이터에서 같은 실험을 반복하면 긴 context가 항상 좋다는 관찰이 깨지는 지점을 보여줄 수 있다. shift 이전 구간을 잘라 낸 입력과 전체 입력의 예측 차이를 재는 probe는 학습 없이 바로 할 수 있다."
  - "graph 시계열 PFN: LOTSA에는 PeMS 기반 LargeST(약 44.5억 관측치)와 LibCity의 PEMS03/04/07/08, PEMS-Bay, Los-Loop, Loop Seattle이 들어 있어서, 저자들 스스로 이 계열을 zero-shot으로 볼 수 없다고 했다. PEMS류 벤치마크에서 Moirai와 비교하려면 이 중복부터 밝혀야 한다. 또 LibCity 데이터를 넣을 때 공간 정보는 버렸으므로, Moirai는 교통 데이터를 보고도 관측 그래프는 한 번도 쓰지 않은 모델이다. Any-variate Attention의 binary bias(같은 변수/다른 변수)를 그래프 이웃 여부나 hop 거리에 따른 bias로 바꾸는 것이 관측 그래프를 넣는 가장 작은 수정이고, 원래 Moirai는 그래프 없는 fully-connected 극한의 기준선이 된다."
notes: "ICML 2024 정식판은 PMLR v235, pp.53140-53164이다. 저자 6명은 PMLR 페이지, PMLR PDF, arXiv v2(2024-05-22) 페이지에서 모두 같게 확인했다. cited 한계는 상한 4개 때문에 아래 후속 지적은 본문을 확인했지만 넣지 않았다. (1) Challenges and Requirements for Benchmarking Time Series Foundation Models(TSFM-BenchReqs, https://arxiv.org/abs/2510.13654) 부록 B.2는 GIFT-Eval 실험을 재분석해서, 평가셋의 약 0.1%가 사전학습에 섞인 기존 Moirai가 누수 없이 다시 학습한 Moirai보다 Loop Seattle, M-DENSE, SZ-Taxi에서 MAPE가 짧은 horizon 평균 7.6%p, 긴 horizon 평균 29%p 낮았고 Large에서 차이가 가장 컸다고 보고했다. (2) Chronos-2(https://arxiv.org/abs/2510.15821)는 Moirai-1이 다변량 입력을 내부에서 펴기 때문에 고차원으로 확장하기 어렵다고 지적하고, 기능 비교표에 메모리 비용을 변수 수의 제곱으로 적었다. (3) Sundial(https://arxiv.org/abs/2502.00816)은 Moirai의 mixture distribution prior도 복잡한 분포를 담지 못할 수 있다고 지적했다. (4) Time-MoE(https://arxiv.org/abs/2409.16040)는 Moirai가 입출력 layer에서 hardcoded heuristic에 의존한다고 지적했다. 같은 논문의 zero-shot 장기 예측 평균에서 MSE는 Time-MoE-ultra가 Moirai-Large보다 낮았지만, MAE는 Moirai-Base(0.370)가 Time-MoE-ultra(0.372)보다 약간 나았다. 참고로 arXiv 2410.11802(FoundTS)의 최신판 v6는 제목이 TSFM-Bench로 바뀌었고, Moirai를 channel-dependent 모델로 분류해 상관이 강한 데이터셋에서도 오차가 일정 범위에 머문다고 긍정적으로 평가했다."
