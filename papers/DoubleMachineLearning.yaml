problem: Nuisance ML의 regularization bias와 overfitting이 저차원 관심 parameter의 추정·추론으로 전달된다.
core_idea: Auxiliary prediction으로 Neyman-orthogonal score를 구성하여 nuisance 오차의 1차 영향을 줄이고 cross-fitting으로
  overfitting을 제어한다.
key_assumptions:
- Target-specific orthogonal score, 식별·moment 조건, nuisance 수렴률과 sample splitting의 조건이 필요하다.
strengths:
- text: 예측 정확도와 target parameter 추정 정확도를 구별하고 nuisance regularization 오염에 대응한다.
  tags:
  - nuisance-separation
  - theory-gap
- text: Cross-fitting과 orthogonal score를 결합하여 조건부 점근 추론을 가능하게 한다.
  tags:
  - experimental-design
limitations:
- text: Neyman orthogonality는 일반적으로 local·1차 robustness다. 작은 adaptive BO archive의 exact posterior invariance나
    ranking·regret 보장을 뜻하지 않는다.
  tags:
  - decision-regret
  - identifiability
  source: analyst
