areas: [co-heuristics]
problem: "LLM이 NP-hard CO 문제의 해를 직접 생성할 때 제약 위반이 잦은데, 출력 표현과 모델 구조를 바꿔 생성 과정에서 feasibility를 지키게 할 수 있는지를 묻는다."
core_idea: "해를 최종 목록(list of lists)으로 쓰는 대신, 결정 하나마다 누적 가치·무게·거리·machine 시간 같은 상태 갱신을 함께 적는 ACCORD 형식으로 쓰게 한다. 이렇게 하면 autoregressive 생성 중에 제약 확인이 텍스트에 드러난다. TSP, VRP, Knapsack, Bin Packing, JSSP, FSSP 각각 약 15,000개 instance로 ACCORD-90k 데이터셋을 만들고(OR-Tools, CP-SAT, NEH로 label), 문제별 LoRA adapter를 학습한다. 별도의 작은 transformer 분류기가 지시문을 읽고 맞는 adapter를 고른다. 학습은 Llama 3.1 8B(4-bit)의 SFT만이며 RL은 없다. 추론 때 instance당 60개 해를 뽑아 feasible한 것 중 최선을 고른다."
key_assumptions:
  - "누적 상태를 텍스트로 적게 하면 모델이 다음 결정에서 제약을 스스로 확인한다고 본다."
  - "OR-Tools·CP-SAT·NEH로 만든 label이 모방할 만한 품질이라고 본다. FSSP label은 정확 solver가 아니라 NEH 휴리스틱이다."
  - "문제마다 adapter를 분리하고 router로 고르면 문제 사이 간섭이 줄어든다고 본다."
strengths:
  - text: "출력 형식만 바꿔 feasibility를 크게 올렸다. list of lists 대비 FSSP 24.86%, TSP·VRP 10%, JSSP 7% 개선을 보고했고, 500개 TSP instance에서 feasibility가 71.4% 대 1.6%였다."
    tags: [tokenization]
  - text: "작은 크기(5, 8, 12)에서 8B 모델이 GPT-4 기반 prompting 방법(SGE 등)보다 gap이 작았다. 크기 5에서 ACCORD는 0.0–3.9%, SGE는 8.1–11.9%였다. 6개 문제와 9만 개 instance 데이터셋을 공개했다."
    tags: [task-coverage]
limitations:
  - text: "LLM의 context window 때문에 매우 큰 instance를 다루지 못하고, 8B 모델 위의 LoRA adapter에 의존한다고 저자들이 인정했다. 더 큰 backbone의 full fine-tuning, 외부 메모리나 계층적 encoding으로 context를 늘리는 것을 후속 과제로 들었다."
    tags: [context-scale]
    source: self
  - text: "[analyst] 주 비교표가 크기 5·8·12에 한정되고 일반화 검증도 크기 5–50이라, 실용적인 CO 크기와는 거리가 멀다. 또 feasibility 이득의 일부는 instance당 60개를 뽑아 걸러내는 표본·필터 단계에서 오는데, 형식 효과와 표본 수 효과를 분리한 비교가 없다."
    tags: [context-scale, eval-protocol]
    source: analyst
builds_on: [Llama 3.1, LoRA, OR-Tools]
compared_against: [GPT-4, SGE, Input-Output prompting, list of lists representation, L2D]
open_questions:
  - "누적 상태 형식을 SFT 뒤 RL 보상과 함께 쓰면 feasibility 보상의 희소성이 줄어드는가."
  - "같은 표본 수(60개)를 list of lists 형식에도 주면 feasibility 격차가 얼마나 남는가."
hooks:
  - "사용자 메모의 B안 지형 정리용이다. RL이 없고 크기도 작아 사용자 RL-AHD 보상 연구와의 직접 접점은 약하다. 다만 'SFT만으로는 feasibility가 불안정하다'는 B안 공통 관찰의 다른 해법(출력 형식으로 제약을 드러내기)으로 대비할 수 있다."
notes: "arXiv 페이지에 venue가 적혀 있지 않아 misc로 두었다. 본문 6절은 2 epoch·40k context, 부록은 1 epoch·10,000 token으로 학습 설정 서술이 서로 다르다."
