id: HerrmannPallez
title: "An In-depth Study of LLM Contributions to the Bin Packing Problem"
authors: "Julien Herrmann, Guillaume Pallez"
venue: "arXiv 2025 (arXiv comment: ACM Transactions on Evolutionary Learning and Optimization 게재 승인)"
year: 2025
links:
