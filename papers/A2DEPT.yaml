areas: [co-heuristics]
problem: "기존 LLM 기반 자동 휴리스틱 설계(AHD)가 고정 template 안의 함수 하나만 바꾸는 component tuning에 머무는 한계를 넘어, 실행 가능한 solver 프로그램 전체를 진화시키는 algorithm-level 설계를 하려 한다."
core_idea: "LLM을 시스템 수준 algorithm architect로 쓰고, 평가한 모든 프로그램을 전역 탐색 tree에 보관한다. 프로그램은 고정 preface와 함수 registry로 구조화되어 불변 정의와 변경 가능한 전략 함수로 나뉜다. 부모 대비 자식 채택은 재가열이 있는 simulated annealing으로, 남는 부모 자리는 tree 전체에 대한 Boltzmann sampling으로 채운다. 연산자는 micro-tuning, 진입 함수 workflow를 다시 쓰는 macro-mutation, 의미 기반 crossover의 계층이며, node마다 softmax scheduler가 점수 변화로 연산자 가중을 조정한다. 호출 그래프로 미구현 함수를 찾아 LLM에 채우게 하는 repair loop로 실행 가능성을 유지한다. Fitness 집합은 문제마다 크기 4단계 × 4개 = 16개 synthetic instance이고, 목적값을 크기 척도(고객 수, job 수, vertex 수)로 나눈 instance 점수를 평균해 모든 크기가 같은 몫으로 기여하게 한다."
key_assumptions:
  - "목적값을 문제 크기로 나누면(고객당 평균 비용, job당 평균 시간, node 선택 비율) 크기가 다른 instance를 같은 척도로 평균할 수 있다고 가정한다."
  - "크기 4단계 × 4개라는 작은 fitness 집합이 진화 탐색의 선택 기준으로 충분하다고 본다."
  - "LLM이 다중 함수 프로그램 수준의 수정과 repair를 안정적으로 수행할 만큼 강하다고 가정한다(주 실험은 DeepSeek v3.2, Gemini 2.5 Flash)."
strengths:
  - text: "FrontierCO의 MIS, CVRP, CFLP, FJSP와 제약이 강한 CEVRPTW, MRCPSP에서 FunSearch, EoH, ReEvo, MCTS-AHD보다 모든 task에서 좋았고, 표준 벤치마크의 평균 정규화 gap을 가장 강한 AHD 기준선 대비 9.8% 줄였다. 예: CVRP 17.42%에서 8.79%, MIS 11.35%에서 4.20%. CEVRPTW의 infeasible 비율은 2.56%로 ReEvo의 8.67%보다 낮았다."
    tags: [program-synthesis]
  - text: "Fitness를 원 목적값 합으로 두면 큰 instance가 지배하는 스케일 편향이 생긴다고 명시하고, 크기 척도로 나눈 점수를 평균해 모든 크기 단계가 같은 몫으로 기여하도록 설계했다."
    tags: [reward-signal, eval-protocol]
  - text: "Ablation에서 고정 template, Boltzmann 보충, 적응형 scheduling, hybrid selection 중 어느 것을 빼도 최소 한 task에서 성능이 떨어진다."
    tags: [program-synthesis]
limitations:
  - text: "Repair와 검증 때문에 closed-loop 비용이 크다. batching, caching, 정적 검사로 줄이는 것을 과제로 든다. 실행은 되지만 interface 계약을 어기는 모듈 간 type 불일치가 생길 수 있다."
    tags: [inference-cost, program-synthesis]
    source: self
  - text: "여러 파일로 된 산업용 codebase로 확장하려면 계층적 모듈 관리, 증분 compile, 파일 수준 의존성 추적이 필요하다. 다목적 설정으로의 확장과 LLM 신뢰도에 대한 강건성은 향후 과제다."
    tags: [task-coverage, robustness]
    source: self
  - text: "[analyst] 크기로 나누는 정규화는 instance 사이 스케일은 맞추지만 휴리스틱 사이 점수 분산은 맞추지 않는다. 그래서 선택 판정이 여전히 특정 크기 단계의 차이에 끌려갈 수 있다. 또 16개 instance로 평가한 fitness의 표본 잡음과 크기별 순위 불일치는 보고하지 않는다."
    tags: [reward-signal, eval-protocol]
    source: analyst
builds_on: [FunSearch, EoH, ReEvo, MCTS-AHD]
compared_against: [Gurobi, ILS, SDDS, DeepACO, GCNN, MPGN, FunSearch, EoH, ReEvo, MCTS-AHD]
open_questions:
  - "크기 척도 정규화와 instance별 gap 정규화, 크기별 순위 집계 중 어느 것이 더 큰 미학습 크기로의 일반화를 낫게 하는가?"
  - "16개 fitness 집합으로 고른 프로그램의 순위가 더 큰 독립 instance 집합에서도 유지되는가?"
hooks:
  - "(AHD 쪽 크기 문제 선행) 사용자 strata 계획 §9는 A2DEPT를 'AHD에서 이미 크기를 의식한 연구'로 분류했다. 원 목적값 합이 스케일 편향을 만든다는 문제 인식과, 모든 크기가 같은 몫으로 기여하게 한다는 목적까지 명시했으므로, 층 혼합 문제를 처음 지적했다고 주장할 수 없다. 차별점은 (i) 진화 탐색의 선택이 아니라 RL 학습 보상과 GRPO advantage에서의 효과, (ii) 스케일 정규화 뒤에도 남는 휴리스틱 간 분산에 의한 가중(사용자 계획 §9.3 b, dev 관찰은 gap 단위에서도 층 사이 불일치가 컸다), (iii) held-out 크기로의 전이 검증이다."
  - "(작은 고정 fitness 집합) A2DEPT도 크기 단계당 4개, 문제당 16개 instance로 fitness를 계산한다. CALM의 OBP 4개·TSP 64개와 같이 작은 고정 집합 문제가 진화 계열에서도 그대로 있다는 사례로, 보상 잡음 진단 cycle의 동기 근거로 인용할 수 있다. A2DEPT는 이 잡음을 분석하지 않는다."
  - "(정규화 비교 기준선) A2DEPT식 크기 척도 정규화는 사용자 계획의 R1(instance별 정규화) 계열에 해당한다. R0가 이미 gap 단위라는 점을 고려하면, A2DEPT 방식은 R0와 별도로 크기 척도 정규화 변형을 하나 더 두어 비교할지 판단할 근거가 된다(제안)."
notes: "arXiv abs와 HTML 본문 및 부록 D.2(평가 집합 구성과 크기 정규화)를 읽었다. 부록 D.2에서 서술한 한계 중 abstract/결론에 저자가 명시하지 않은 것은 self로 넣지 않았다. arXiv comment는 Preprint이고 학회 게재 정보는 찾지 못했다. 공식 코드 링크는 확인하지 못했다."
