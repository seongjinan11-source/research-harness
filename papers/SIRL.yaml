id: SIRL
title: "Solver-Informed RL: Grounding Large Language Models for Authentic Optimization Modeling"
authors: "Yitian Chen, Jingfan Xia, Siyu Shao, Dongdong Ge, Yinyu Ye"
venue: "NeurIPS 2025"
year: 2025
links:
