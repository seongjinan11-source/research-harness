id: ContextualCalibration
title: "Calibrate Before Use: Improving Few-shot Performance of Language Models"
authors: "Tony Z. Zhao, Eric Wallace, Shi Feng, Dan Klein, Sameer Singh"
venue: "ICML 2021"
year: 2021
links:
  paper: https://arxiv.org/abs/2102.09690
  proceedings: https://proceedings.mlr.press/v139/zhao21c.html
