problem: 중복 후보를 반복하는 combinatorial BO의 탐색 정체를 줄인다.
core_idea: SK ground-state 문제에 normal-prior nBOCS를 사용하고, 제안점이 이미 관측됐으면 새 random point로 교체한다. TS/MAP와 random
  postprocessing 유무를 비교한다.
key_assumptions:
- SK coupling은 dense하며 normal prior와 noise scale은 preliminary run에서 정한 값이다.
strengths:
- text: 본문 Eq.(3)–(7) 사이에서 dense SK coupling을 이유로 horseshoe 대신 normal prior를 선택했다고 명시한다.
  tags:
  - sparsity-prior
- text: 중복 query 배제라는 간단한 탐색 대조를 제공한다.
  tags:
  - experimental-design
limitations:
- text: 결론은 다른 문제, 특히 constrained combinatorial optimization에 대한 적용을 향후 질문으로 남긴다.
  tags:
  - task-coverage
  source: self
- text: 주 실험의 변화는 random postprocessing이며 horseshoe 대 normal의 matched size 실험이 아니다. Normal 선택 이유를 size
    손실의 실증으로 인용하지 않는다.
