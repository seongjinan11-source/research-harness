id: SmoothFunctionalShrinkage
title: Adaptive shrinkage of smooth functional effects towards a predefined functional subspace
authors: Paul Wiemann, Thomas Kneib
venue: arXiv
year: 2021
links:
  paper: https://arxiv.org/abs/2101.05630
citation:
  type: misc
  title: Adaptive shrinkage of smooth functional effects towards a predefined functional subspace
  authors:
  - Paul Wiemann
  - Thomas Kneib
  year: 2021
  url: https://arxiv.org/abs/2101.05630
