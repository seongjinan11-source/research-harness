open_questions:
  - "objective function 선택이 zero-shot 정확도와 calibration에 각각 얼마나 영향을 주는가. 서베이는 축을 세웠지만 효과를 재지는 않았다."
  - "여섯 축 중 어떤 축이 downstream 성능 차이를 가장 많이 설명하는가. 같은 benchmark 위에서 축별 효과를 분리할 수 있는가."
hooks:
  - "nuisance-context 연구에서 모델을 분류할 때 이 서베이의 단변량·다변량 이분법으로는 부족하다. 채널 독립(MOMENT, TimesFM, Chronos), 변수를 한 sequence로 펴서 attention하는 방식(MOIRAI), group 단위로 변수 간 정보를 섞는 이후 모델(Chronos-2)처럼 변수 정보가 섞이는 경로로 나눠야 irrelevant stream의 영향이 어디서 들어오는지 설명할 수 있다."
  - "MVTS 이상탐지에서 TSFM을 고를 때 objective 축이 바로 쓰인다. TSAD-OneLiners가 보였듯 MSE 복원 모델은 정규화 때문에 분산 detector로 무너지고, 예측 모델은 horizon에 따라 point와 sequence anomaly 사이에서 trade-off가 생긴다. likelihood로 학습한 확률적 모델은 예측 분포 아래의 확률을 점수로 쓸 수 있으므로, 이 실패를 피하는지 시험해 볼 후보군을 Table 2에서 바로 고를 수 있다."
notes: "다룬 모델 중 하네스 id가 있는 것은 MOMENT, TimesFM, Moirai, Time-MoE다. 서베이라 builds_on과 compared_against는 비워 두었다."
