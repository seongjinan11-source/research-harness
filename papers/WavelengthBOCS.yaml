problem: 근적외선 spectrum의 wavelength region을 선택해 PLS sugar-content 예측과 선택 일관성을 개선한다.
core_idea: Cross-validated PLS RMSE를 black-box 목적함수로 삼는다. Horseshoe로 규제한 quadratic surrogate의 posterior
  draw를 QUBO로 최적화하고 SA/QA로 후보를 선택한다.
key_assumptions:
- Prune spectroscopy 데이터, 정해진 wavelength partition과 cross-validation protocol에서 평가한다.
strengths:
- text: §2.2 Eq.(7)–(8)에서 horseshoe global/local scale과 Gaussian likelihood를 명시하는 최근 BOCS 응용이다.
  tags:
  - sparsity-prior
- text: 반복 실행의 선택 일관성과 one-bit removal 후 예측오차를 보고한다.
  tags:
  - robustness
  - eval-protocol
limitations:
- text: 결론은 더 신뢰할 일반화 평가를 위해 independent test를 포함한 nested validation이 필요할 수 있다고 밝힌다.
  tags:
  - eval-protocol
  source: self
- text: Wavelength partition 해상도 n을 예측 결과를 보고 선택했으며 자동 결정과 chemical validation을 향후 과제로 남긴다.
  tags:
  - experimental-design
  - interpretability
  source: self
- text: 원문은 BOCS의 긍정 결과다. 최근 사용 사례이지만 size leakage 실패나 CBO 전체의 사용 빈도를 입증하지 않는다.
  tags:
  - subset-cardinality
  - decision-regret
  source: analyst
builds_on:
- BOCS
compared_against:
- Genetic algorithm
- Simulated annealing
open_questions: &id001
- Size-prior 수정 여부를 독립적으로 검증할 후보 응용이다. 기존 선택된 해상도와 validation protocol의 selection bias를 통제해야 한다.
