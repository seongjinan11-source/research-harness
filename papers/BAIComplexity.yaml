core_idea: 정보량 기반 lower bound, Gaussian/Bernoulli 두-arm의 정밀 결과와 change-of-measure
  도구를 제시한다.
key_assumptions:
- 본문의 모델·관측·입력 가정 안에서 해석하며 SSP의 count-dependent adaptive 정책으로 보장을 자동 이전하지 않는다.
strengths:
- text: 구별하기 어려운 두 환경에서 추천의 한계를 유도하는 직접 기초다.
