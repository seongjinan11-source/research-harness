core_idea: '[본문 확인] Role-aware LLM 설명을 semantic vector로 인코딩해 node feature를 보강한다. 이 의미 정보를 이용해 target별 typed path를
  샘플링하고, local path와 global neighbor 요약을 schema token으로 만들어 Transformer에 입력한다.'
key_assumptions:
- 역할별 prompt, 구조화된 속성, 사전 지정 transaction schema가 필요하다.
strengths:
- text: 역할별 business semantics를 feature 보강과 evidence 선택에 함께 활용한다.
  tags:
  - heterogeneous-semantics
  - llm-semantics
- text: Target-conditioned path와 global neighbor 정보를 정해진 schema token으로 결합한다.
  tags:
  - meta-paths
  - graph-structure-use
