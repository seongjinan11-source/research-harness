problem: Biological dose–response의 알려진 nonlinear shape를 활용하면서 data가 요구하면 그 shape에서 벗어나게 한다.
core_idea: Taylor/Jacobian으로 nonlinear function family를 locally 선형화하고 그 공간에 대한 deviation에 horseshoe functional
  shrinkage를 건다. Hill model과 복수 함수 family를 다룬다.
key_assumptions:
- Nonlinear parametric family를 사전에 지정하고 parameter prior 및 local approximation을 사용한다.
strengths:
- text: Linear subspace shrinkage를 nonlinear shape family로 확장하는 직접적인 메소드 선행이다.
  tags:
  - basis-dependence
  - sparsity-prior
limitations:
- text: Discussion은 subspace 안팎으로 수축을 선택하는 성질을 simulation에서 보였으나 이론 증명은 제공하지 않았다고 명시한다.
  tags:
  - theory-gap
  source: self
- text: 본문 §3의 projection은 Taylor 근사에 기반한다. 모든 nonlinear curve에 대한 exact global projection이나 finite-sample
    posterior invariance로 해석할 수 없다.
  tags:
  - theory-gap
  source: analyst
- text: Dose–response 추정의 실험은 subset BO의 same-count 추천 손실에 대한 검증이 아니다.
  tags:
  - decision-regret
  source: analyst
builds_on:
