problem: 여러 국가의 GDP growth tail을 정보 공유와 nonlinear quantile response를 통해 예측한다.
core_idea: Linear part와 BART의 convex combination 및 latent quantile factor를 사용한다. Linear coefficient는 zero가
  아닌 Gaussian common mean 주변으로 horseshoe 수축하는 pooled-HS hierarchy를 사용한다.
key_assumptions:
- 국가·quantile 간 공유 구조와 model-specific factor 및 asymmetric-Laplace 계열 likelihood를 사용한다.
strengths:
- text: 공통 mean을 Gaussian으로 추정하고 개별 deviation을 global-local scale로 수축한다. Common mean=0이면 conventional
    HS가 된다.
  tags:
  - sparsity-prior
  - nuisance-separation
- text: Shared structure와 sparse heterogeneity를 분리하는 실재하는 단순 대조를 제공한다.
  tags:
  - model-based-baseline
limitations:
- text: Common mean은 국가별 같은 covariate의 pooling이며 monomial count subspace가 아니다. Count 방향의 식별·native contrast
    prior·BO 결정을 보호하는 보장은 별도로 필요하다.
  tags:
  - subset-cardinality
  - decision-regret
  source: analyst
builds_on: []
compared_against:
- Conventional horseshoe
- Linear quantile factor models
open_questions: &id001
- Gaussian shared count + horseshoe deviations의 최소 baseline 및 구조적 선행으로 인정한다.
hooks: *id001
notes: 읽은 2021 preprint pp.7–8의 hierarchy에 근거한다. Domestic common mean의 prior variance10은 application 설정이며
  flat prior가 아니다. 후속 출판판 metadata와 섞지 않는다.
