problem: 과거 상호작용의 반복만으로는 시간에 따라 변하는 사건의 textual semantics와 구조적 noise를 구분하기 어렵다.
core_idea: '[출판사 초록·공개 발췌 확인; 전체 본문 미확인] LLM으로 역사적 사건 설명을 인코딩하고 attention으로 요약한다. Structural encoder는 stable core와
  transient residual view를 분리하며 structural plausibility·semantic coherence·recency를 함께 점수화한다.'
key_assumptions:
- 과거 사건의 구조와 자연어 설명을 함께 이용할 수 있어야 한다.
strengths:
- text: 사건의 자연어 설명과 구조적 이력을 함께 사용한다.
  tags:
  - llm-semantics
  - temporal-kg
- text: Stable core와 transient residual을 분리하는 dual-view 추론을 제시한다.
  tags:
  - multi-view-fusion
  - nonstationarity
limitations:
- text: '[analyst] Core·residual 분리라는 설계가 실제 causal signal과 nuisance의 식별을 보장하는지는 별도 검증이 필요하다.'
