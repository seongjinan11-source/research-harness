problem: 오지정 module에서 다른 module로 전달되는 Bayesian feedback을 제어한다.
core_idea: Full Bayes와 cut을 포함하는 influence parameter의 계열로 정보의 방향과 양을 조절한다.
key_assumptions:
- 본문의 모델·관측·입력 가정 안에서 해석하며 SSP의 count-dependent adaptive 정책으로 보장을 자동 이전하지 않는다.
strengths:
- text: Directed feedback을 제어하는 cut과 semi-modular inference를 통합한다.
