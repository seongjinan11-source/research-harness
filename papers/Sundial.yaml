areas: [tsfm]
problem: "기존 TSFM은 MSE·quantile loss로 단봉 분포를 가정하거나(TimesFM, Time-MoE), mixture 분포를 미리 정하거나(Moirai), 값을 이산 token으로 양자화한다(Chronos). 이 논문은 연속값 시계열에서 분포를 미리 정하지 않고 다음 patch의 예측 분포를 직접 학습해서 여러 개의 그럴듯한 미래를 생성하는 foundation model을 만들고자 한다."
core_idea: "길이 16 patch를 연속값 그대로 embedding하는 decoder-only transformer(RoPE, Pre-LN, FlashAttention, KV cache)가 각 위치의 표현을 만든다. 이 표현을 조건으로 받는 작은 MLP flow-matching 네트워크가 noise에서 다음 구간 값으로 가는 velocity를 학습하는데, 이 손실을 TimeFlow Loss라고 부른다. 추론 때는 서로 다른 Gaussian noise에서 K=50 step을 적분해 여러 sample을 뽑고, sample의 median과 quantile로 point·확률 예측을 만든다. lookback 표현은 한 번만 계산해 모든 sample이 공유하므로 반복 sampling이 싸다. 한 위치에서 여러 patch를 한꺼번에 예측하는 multi-patch prediction(출력 길이 16 또는 720)으로 autoregressive step 수를 줄인다. 사전학습 데이터는 약 1.03조 시점의 TimeBench이며 ERA5, LOTSA, Chronos corpus, ECG, 금융, IoT 데이터에 KernelSynth synthetic 0.05%를 섞었다. 모델은 Small(32M), Base(128M), Large(444M)이고 최대 context는 2,880 시점이다."
key_assumptions:
  - "변수 수가 데이터셋마다 다른 문제를 피하려고 단변량으로 사전학습해도 충분하다고 본다. 다변량 데이터는 변수별로 정규화해 따로 처리한다."
  - "다음 patch의 조건부 분포를 작은 flow-matching MLP 하나가 표현할 수 있고, 이를 위한 정보는 transformer 표현 하나에 다 담긴다고 가정한다."
  - "sample의 median이 좋은 point forecast이고, 20~100개 sample로 구한 quantile이 예측 구간으로 충분히 보정되어 있다고 본다."
  - "ERA5 등 기상 데이터가 절반 이상인 TimeBench가 다양한 도메인의 패턴을 대표한다고 가정한다."
  - "평가 데이터셋을 사전학습에서 제외했다는 저자 진술을 근거로 모든 평가를 zero-shot으로 본다."
strengths:
  - text: "flow matching 기반 TimeFlow Loss로 분포 형태를 미리 정하지 않고 연속값에서 바로 생성형 확률 예측을 한다. 이산 tokenization의 out-of-vocabulary 문제와 거친 예측 구간을 피하고, 평균이나 quantile 말고도 sample에서 임의의 통계량을 추정할 수 있다."
    tags: [uncertainty, tokenization]
  - text: "추론 비용을 줄이는 설계가 촘촘하다. multi-patch prediction으로 decoding step을 줄였고, KV cache와 FlashAttention으로 메모리를 14.8%, 추론 시간을 43.6% 줄였다. 20개 sample을 각각 50 step으로 만들어도 CPU에서 1초 남짓이며, FEV에서는 Chronos보다 약 35배 빠르다고 보고한다."
    tags: [inference-cost, context-horizon]
  - text: "zero-shot 성능이 넓은 벤치마크에서 강하다. TSLib 장기 예측에서 더 적은 파라미터로 Time-MoE 대비 평균 MSE 7.57%, MAE 4.71%를 낮췄다. GIFT-Eval에서는 비교 대상 중 MASE가 가장 낮았고(0.673), FEV leaderboard에서는 zero-shot 사전학습 모델 중 Chronos 다음 2위였다."
    tags: [zero-shot-gap]
  - text: "약 1조 시점 규모의 TimeBench로 규모를 키우는 효과를 보였다. Large는 Small보다 수렴 training loss가 15.38% 낮았고, TSLib에서도 모델이 클수록 일관되게 좋아졌다."
    tags: [pretraining-data]
  - text: "sample 개수와 flow-matching step 수를 추론 시에 조절해서 재학습 없이 정확도와 속도를 맞바꿀 수 있다. FEV에 한 번 fine-tuning하면 zero-shot보다 더 좋아지고, 같은 데이터로 처음부터 학습한 모델보다는 확실히 좋아 사전학습 지식이 전이됨을 보였다."
    tags: [uncertainty, adaptation]
limitations:
  - text: "TimeBench에는 중·저주파 시계열이 많아서 아주 고주파인 데이터에서의 성능은 보장할 수 없다고 저자들이 인정한다. 모델 용량을 키웠어도 hallucination이 생길 수 있다고 밝히며, 다중 스케일 시계열로의 일반화를 중요한 향후 과제로 든다."
    tags: [pretraining-data, prior-mismatch]
    source: self
  - text: "Gaussian noise에서 시작하는 단순한 sampling만 썼기 때문에 sampling 전략과 frequency normalization 같은 후처리에 개선 여지가 크다고 저자들이 밝힌다. sample과 step을 늘릴수록 지표가 좋아지므로, 좋은 확률 예측을 얻으려면 추론 시간을 더 써야 하는 trade-off가 있다."
    tags: [inference-cost, uncertainty]
    source: self
  - text: "변수 수 차이를 피하려고 단변량으로 사전학습했기 때문에 변수 간 상관이나 covariate 정보를 명시적으로 쓰지 못한다고 저자들이 인정한다."
    tags: [channel-dependency, covariates]
    source: self
  - text: "autoregressive 구조는 context 길이에 유연하지만, 여러 step에 걸친 autoregression은 여전히 지나치게 매끄럽거나 신뢰하기 어려운 예측을 낳을 수 있다고 저자들이 밝힌다."
    tags: [context-horizon]
    source: self
  - text: "기능 비교표에서 Sundial을 단변량만 지원하고 past-only·known·categorical covariate와 cross learning을 모두 지원하지 않는 모델로 분류한다. fev-bench에서 Sundial의 win rate는 41.0%, skill score는 33.4%로 비교한 사전학습 모델 9개 중 가장 낮았고, median runtime도 Chronos-2의 약 10배였다. GIFT-Eval WQL skill score도 44.1%로 Chronos-2(51.4%)에 크게 못 미쳤다."
    tags: [channel-dependency, covariates, zero-shot-gap]
    source: cited
    by: "Chronos-2: From Univariate to Universal Forecasting (2025)"
    by_id: Chronos-2
    by_link: https://arxiv.org/abs/2510.15821
  - text: "Sundial 저자들이 GIFT-Eval과 겹치는 데이터를 제외했다고 밝히면서도 어떤 데이터셋을 뺐는지 목록을 제시하지 않았다고 지적한다. 같은 데이터가 저장소마다 다른 이름으로 올라와 있는 상황에서는 제외 여부를 외부에서 검증할 수 없다는 것이 요지다. 데이터셋 동일성 확인이 어렵다는 점을 명시하고 해당 데이터를 뺀 TiRex·Toto와 대비된다."
    tags: [eval-protocol]
    source: cited
    by: "Rethinking Evaluation in the Era of Time Series Foundation Models: (Un)known Information Leakage Challenges (2026)"
    by_id: TSFM-BenchReqs
    by_link: https://arxiv.org/abs/2510.13654
  - text: "zero-shot TSFM 6개의 80% 예측 구간 보정을 평가했다. Sundial은 context 길이와 상관없이 과신(over-confident)했다. 폴란드 전력망 부하 데이터에서는 interval coverage error가 약 0.45였고, S&P 500 ETF 가격에서는 0.50을 넘겨 목표로 한 가격 변동의 절반을 구간 밖으로 놓쳤다. 같은 평가에서 Chronos-2와 TiRex는 잘 보정되었다. 생성형 sampling이 신뢰할 만한 불확실성을 준다는 Sundial의 핵심 주장과 정면으로 부딪히는 결과다."
    tags: [uncertainty]
    source: cited
    by: "Evaluating Accuracy and Probabilistic Reliability of Zero-Shot Time Series Foundation Models (2026)"
    by_link: https://arxiv.org/abs/2609.25788
  # review: ICML 2025 OpenReview forum(https://openreview.net/forum?id=LO7ciRpjI5)은 있으나 ICML은 리뷰를 공개하지 않고 접근도 차단되어 미기재.
  - text: "[analyst] TimeFlow Loss의 point 예측 이득은 작다. 같은 backbone과 데이터에서 MSE loss로 바꾸면 TSLib 6개 평균 MSE가 0.290에서 0.296으로 나빠질 뿐이고, ETTh1(0.404 대 0.411)과 Weather(0.231 대 0.234)에서는 오히려 MSE loss가 더 좋았다. mode collapse 주장은 주로 정성적 예시 그림에 기대고, 예측 구간 품질은 집계된 CRPS·WQL로만 보였다. 이후 독립 평가에서 과신 문제가 나온 것을 보면, 분포를 미리 정하지 않는다는 것과 보정이 잘 된다는 것은 별개의 문제다."
    tags: [uncertainty, theory-gap]
    source: analyst
  - text: "[analyst] TimeBench 시점의 약 62%가 ERA5 기상 재분석 데이터(3시간·12시간·일·주·월·분기 해상도의 합)이고, LOTSA와 Chronos corpus까지 합치면 약 94%다. 저자들이 고주파 성능을 보장하지 못한다고 인정한 것도 이 구성에서 나온다. GIFT-Eval 표에서도 MASE는 1위였지만 전체 rank는 9.06으로 TimesFM(8.24)과 TabPFN(8.27)보다 뒤였다. 비교 대상은 GIFT-Eval 원 논문의 baseline 13개로 한정되었다."
    tags: [pretraining-data, eval-protocol]
    source: analyst
builds_on: [Timer, Timer-XL, flow matching, Chronos, Moirai]
compared_against: [Time-MoE, Timer-XL, Moirai, Chronos, TimesFM, TabPFN, PatchTST, iTransformer, DeepAR, TiDE, N-BEATS, AutoARIMA, AutoTheta, Seasonal Naive, Naive]
open_questions:
  - "생성형 sample의 분포가 실제로 보정되어 있는가. median·quantile 정확도와 별개로 coverage를 직접 재면 sample 수, step 수, 후처리 중 무엇이 과신을 줄이는가."
  - "flow-matching head의 이득이 point 정확도에서는 작다면, 생성형 학습의 진짜 가치는 다봉 미래나 사건성 패턴처럼 평균 지표로는 보이지 않는 곳에 있는가. 이를 보여줄 평가 지표는 무엇인가."
  - "기상 데이터 위주의 corpus를 고주파·다중 스케일 데이터로 넓히면 Sundial의 순위가 어떻게 달라지는가."
  - "단변량 사전학습 backbone에 flow-matching head를 유지한 채 다변량·covariate 정보를 넣을 수 있는가."
hooks:
  - "(obsolete history) Sundial은 평균 하나가 아니라 sample 분포를 낸다. 그래서 regime shift 이후에 shift 이전 regime이 평균의 편향이 아니라 sample 분포 속 가짜 mode로 남는지 볼 수 있다. 예를 들어 sample 중 옛 regime의 level이나 추세를 따르는 비율을 재면 '오래된 history를 잊지 못하는 정도'를 분포 수준에서 보여줄 수 있다. 최대 context가 2,880 시점(patch 180개)이므로 shift 이전 구간 길이를 이 범위 안에서 조절하면 된다."
  - "(irrelevant context) 단변량 모델이라 nuisance stream에 구조적으로 영향받지 않는 기준선이다. 다만 독립 평가에서 예측 구간이 과신으로 나왔으므로, nuisance 연구에서 CRPS나 coverage 같은 확률 지표로 비교할 때는 Sundial의 구간 폭이 좁다는 점을 감안해야 한다. point 지표와 확률 지표를 함께 보고하는 것을 추천한다."
  - "(graph 시계열 PFN) TimeBench는 LOTSA(22%)와 Chronos corpus(9%)를 포함하는데 저자들이 평가 데이터 제외 목록을 공개하지 않았다. PEMS류 교통 데이터로 Sundial과 비교하려면 LOTSA·Chronos corpus 구성과 직접 대조해 중복부터 확인해야 한다."
notes: "ICML 2025 oral(icml.cc oral 페이지)이며 spotlight poster로도 발표되었다. PMLR v267 pp.39295-39317. 본문 수치와 Appendix E(Limitations)는 PMLR PDF에서 직접 확인했다. 모델 크기는 Table 5 기준 Small 32M, Base 128M, Large 444M이다. FEV에서는 출력 길이 F=16 모델, TSLib·GIFT-Eval에서는 F=720 모델을 따로 학습해 썼다. fev-bench 논문(v2, 2026)에서도 Sundial-Base는 covariate를 무시하는 모델로 분류되었고, covariate task skill score가 28.0%로 Chronos-2(47.0%)보다 크게 낮았다. TSFM-BenchReqs는 arXiv 2510.13654의 harness id다. v3 제목은 위 by와 같고, 이전 판 제목은 Challenges and Requirements for Benchmarking Time Series Foundation Models였다."
