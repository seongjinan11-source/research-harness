# 파일명 = id.yaml. 설명은 한국어, 용어는 영어 그대로. 원문 문장 복사 금지(요약·의역).
id: TimesFM
title: "A decoder-only foundation model for time-series forecasting"
authors: "Abhimanyu Das, Weihao Kong, Rajat Sen, Yichen Zhou (Google Research)"
venue: "ICML 2024"
year: 2024
links:
  paper: https://arxiv.org/abs/2310.10688
  code: https://github.com/google-research/timesfm
citation:
  type: inproceedings
  title: "A decoder-only foundation model for time-series forecasting"
  authors: ["Abhimanyu Das", "Weihao Kong", "Rajat Sen", "Yichen Zhou"]
  year: 2024
  booktitle: "Proceedings of the 41st International Conference on Machine Learning"
  publisher: "PMLR"
  volume: 235
  pages: "10148--10167"
  arxiv: "2310.10688"
  url: https://proceedings.mlr.press/v235/das24c.html
  verified_from:
