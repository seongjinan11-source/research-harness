problem: Parametric와 nonparametric module 사이의 오지정 및 prior-data conflict를 다룬다.
core_idea: Renyi divergence 기반 variational optimization으로 cut posterior를 정의하고 semiparametric
  concentration과 GP confounding 사례를 제시한다.
key_assumptions:
- 본문의 모델·관측·입력 가정 안에서 해석하며 SSP의 count-dependent adaptive 정책으로 보장을 자동 이전하지 않는다.
strengths:
- text: GP를 포함한 semiparametric feedback 제어의 직접 선행이다.
