id: AdaBN
title: "Revisiting Batch Normalization For Practical Domain Adaptation"
authors: "Yanghao Li, Naiyan Wang, Jianping Shi, Jiaying Liu, Xiaodi Hou (Peking University, TuSimple, SenseTime)"
venue: "arXiv 2016"
year: 2016
