areas: [graph-learning]
problem: "라벨 있는 source graph에서 학습한 GNN을 라벨 없는 target graph에 옮길 때(graph domain adaptation), node representation의 marginal 분포만 맞추는 기존 방법은 연결 패턴의 변화와 클래스 분포의 변화를 제대로 처리하지 못한다. 이 둘을 원리적으로 분리해 보정하려 한다."
core_idea: "저자들은 생성 과정을 Y에서 A와 X가 나오는 순서로 두고, structure shift P(A,Y)의 변화를 conditional structure shift(CSS, P(A|Y)의 변화)와 label shift(LS, P(Y)의 변화)로 나눈다. Feature shift P(X|Y)는 기존 conditional alignment로 처리되었다고 가정한다. SBM식 edge 조건부 독립 아래에서는, 중심 노드 클래스가 주어졌을 때 이웃 라벨 분포 P(Y_v|Y_u, v∈N_u)만 맞추면 층마다 클래스 조건부 representation이 정렬된다(mean pooling에서는 degree 분포 정렬의 영향이 작다). 그래서 source edge에 클래스 쌍별 비율 γ를 weight로 주어 message를 재보정하고, γ는 edge-type 분포 비율 w와 끝점 라벨 분포로 계산한다. w는 target pseudo-label의 edge-type 혼동 행렬로 만든 선형계를 제약 least squares로 풀어 얻고(BBSE와 같은 원리), LS용 label weight β도 노드 수준 혼동 행렬로 같은 방식으로 추정해 classification loss에 곱한다. 혼동 행렬이 ill-conditioned할 때를 위해 L2 regularization을 넣고, 추정과 학습을 주기적으로 번갈아 반복한다."
key_assumptions:
  - "Feature shift P(X|Y)는 없거나 다른 방법으로 이미 처리되었다고 가정한다."
  - "라벨이 주어지면 edge가 서로 독립으로 생긴다(SBM형 구조)."
  - "w와 β의 식별은 P_S(H|Y)=P_T(H|Y)와 라벨이 주어졌을 때 representation의 조건부 독립을 전제로 한다(Lemma 3.8, 3.11)."
  - "학습 중 라벨 없는 target graph 전체에 접근할 수 있고, 모델 선택에는 target 노드 라벨 20%를 validation으로 쓴다."
strengths:
  - text: "Structure shift를 CSS와 LS로 분해하고, CSS 보정에 필요한 것이 이웃 라벨 분포의 클래스 조건부 정렬이라는 충분조건을 정리로 제시했다. Marginal alignment가 LS 아래에서는 클래스 조건부 정렬을 깨고 CSS 아래에서는 shared encoder로 원리적으로 실패한다는 점을 명확히 했다."
    tags: [distribution-shift, label-shift, graph-structure-use]
  - text: "Edge weight와 label weight를 모두 pseudo-label 혼동 행렬 기반 선형계로 추정한다. StruRW가 가정한 완벽한 source 예측과 hard pseudo-label 대신 soft 혼동 행렬과 regularization을 써서 추정이 더 안정적이다."
    tags: [label-shift, identifiability]
  - text: "국가별로 나눈 MAG citation graph(약 38만 노드, 135만 edge)라는 대형 GDA 데이터를 만들고, 여기서 StruRW 대비 25% 넘는 상대 개선을 보였다. HEP pileup에서는 label 분포가 심하게 치우친 높은 PU에서 낮은 PU로 옮길 때 LS 보정(PA-LS)이, 반대 방향에서는 CSS 보정(PA-CSS)이 효과적이어서 두 모듈의 역할이 분리되어 드러났다."
    tags: [label-shift, label-imbalance, distribution-shift]
limitations:
  - text: "GDA 방법들은 source와 target graph에 동시에 접근해야 하므로, 이 논문의 edge 재가중 계열도 source 데이터를 다시 볼 수 없는 test-time adaptation 상황으로 확장할 수 없다고 지적한다."
    tags: [adaptation, distribution-shift]
    source: cited
    by: "Matcha: Mitigating Graph Structure Shifts with Test-Time Adaptation (2025)"
    by_id: Matcha
    by_link: https://arxiv.org/abs/2410.06976
  - text: "[analyst] Label weight와 edge weight의 식별은 클래스 조건부 representation이 두 domain에서 같다는 전제에 기대는데, 이 전제는 feature shift를 가정으로 없앤 뒤에만 성립한다. 같은 클래스라도 지역(community)마다 feature offset이 다르면 혼동 행렬이 domain마다 달라져 BBSE식 추정이 편향된다. 또 LS는 전역 P(Y) 하나만 보정하므로 지역마다 클래스 구성이 다른 경우는 다루지 않는다."
    tags: [group-offset, label-shift, identifiability]
    source: analyst
builds_on: [StruRW, BBSE, IWDAN, CSBM, GraphSAGE]
compared_against: [ERM, DANN, IWDAN, UDAGCN, StruRW, SpecReg]
open_questions:
  - "Feature shift와 CSS·LS가 함께 있을 때 Lemma의 전제가 깨지는 정도와 추정 편향의 관계는 무엇인가? 저자들은 feature shift를 가정으로 제외했다."
  - "전역 label weight 대신 지역·community별 label weight를 혼동 행렬 역산으로 추정할 수 있는가, 그리고 그때 필요한 표본 수와 conditioning은 어떤가?"
hooks:
  - "(BSEL 출력 prior 보정 계열의 원형) PairAlign의 LS 모듈은 BSEL-F04 CPC가 시도한 '출력 쪽 클래스 prior 보정'의 표준형이다. F04에서 PFN posterior 기반 community Saerens EM(E-R2)은 SG +0.3으로 효과가 없었고, BSEL-P04는 병목이 클래스 원형 추정 하나라고 보였다(context 원형은 SRec 0.21, 참 pool 원형은 0.92). 이는 정확히 PairAlign의 식별 전제 P(H|Y) 불변이 commconc에서 깨진 결과로 읽힌다. Context 노드는 소수 community에서 왔고 community feature offset을 갖기 때문에(BSEL-P02, group-offset), context에서 잰 클래스 조건부 분포가 그래프 전체의 그것과 다르다. 따라서 PairAlign을 community별 p(c|k) 추정으로 확장하려면 혼동 행렬을 community offset에서 분리해 추정하는 장치가 먼저 필요하다. 이것은 F04 reopen_when 조건과 같다."
  - "(CSS 모듈과 GraphPFN adapter) GraphPFN adapter는 adjacency를 attention mask로 쓰므로, 추론 시 클래스 쌍별 edge weight를 attention bias로 넣는 것은 원리적으로 가능하다(가설, 미검증). 그러나 γ 추정에는 이웃 라벨이 필요하고 commconc에서는 PFN posterior가 c-context community에 몰려 있었다(BSEL-F02, U posterior 정확도 0.31). 그러므로 pseudo-label 기반 CSS 보정은 F02와 같은 실패를 반복할 가능성이 높다. 먼저 참 라벨 γ를 쓰는 oracle로 상한부터 재는 것이 순서다."
notes: "본문에 별도의 limitation 절은 없어 self 한계는 넣지 않았다. 코드 링크는 arXiv Comments에서 읽었다."
