problem: 이종그래프의 local relational pattern과 distant semantic interaction을 함께 학습하는 문제를 다룬다.
core_idea: '[출판사 초록·공개 발췌 확인; 전체 본문 미확인] SGAM은 type-aware R-GCN과 adaptive residual로 구조를 인코딩한다. MSR은 Mamba·multi-scale
  fusion·방향성 위치 인코딩으로 긴 semantic 의존을 모델링하고 양방향 대조학습으로 두 view를 정렬한다.'
key_assumptions:
- Schema와 node type 및 semantic sequence를 구성할 수 있어야 한다.
strengths:
- text: 관계별 local 구조와 Mamba 기반 long-range 의미를 서로 다른 encoder로 다룬다.
  tags:
  - heterogeneous-semantics
  - graph-structure-use
- text: Semantic·structural view가 서로 augmentation과 감독 신호가 되도록 정렬한다.
  tags:
  - contrastive-learning
  - multi-view-fusion
limitations:
- text: '[analyst] View 정렬이 downstream에 유용한 정보 보존을 보장하는 것은 아니므로, 보조 loss와 최종 예측의 이득을 분리해 검증해야 한다.'
  tags:
  - auxiliary-loss
  - theory-gap
