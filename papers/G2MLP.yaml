problem: GNN에서 MLP로 증류할 때 teacher의 graph-induced geometry를 어디에서 보존할지 결정하는 문제를 다룬다.
core_idea: '[본문 확인] Ollivier–Ricci curvature로 spectral underfit·overfit이 집중되는 위치를 구분한다. Neighborhood 분포를 diagonal
  Gaussian moment로 근사해 prediction·representation alignment를 적응적으로 배분한다.'
key_assumptions:
- Graph teacher와 neighborhood moment·curvature를 학습 시 계산할 수 있어야 한다.
strengths:
- text: 단순 logit matching을 넘어 위치별 graph geometry alignment를 설계했다.
  tags:
  - graph-distillation
  - graph-geometry
- text: 배포 모델은 graph access 없이 실행하는 일반 MLP로 유지한다.
  tags:
  - inference-cost
  - graph-distillation
limitations:
- text: Diagonal Gaussian surrogate는 다봉·상관된 neighborhood 분포의 alignment cost를 충분히 표현하지 못할 수 있다.
  tags:
  - graph-geometry
  - graph-structure-use
  source: self
  evidence:
