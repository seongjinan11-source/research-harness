    section: Appendix H, Diagonal Gaussian neighborhood surrogate
- text: 이론 결과는 upper bound와 구조적 설명이며, curvature-adaptive 정렬이 필요한 조건의 완전한 특성화나 대응 lower bound를 제공하지 않는다.
  tags:
