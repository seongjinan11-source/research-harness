open_questions: &id001
- 명시적 size basis 자체의 최초성은 주장하지 않고, subset composition prior와 결정 왜곡의 연결로 차별화한다.
hooks: *id001
notes: PMLR metadata 및 본문 §3.1 Eq.(6) 확인. Loss basis (1,(1−s)^2), log-cost basis (1,s). 이 논문의 모델 구조를 모든
  실제 size curve의 보장으로 확대하지 않는다.
