problem: 대규모 데이터의 비싼 hyperparameter 탐색을 작은 training subset 평가로 가속한다.
core_idea: Training-data 비율 s를 별도 입력으로 두고 hyperparameter kernel과 finite-rank size basis covariance를 곱한다.
  Loss와 log-cost를 모델링하고 full-data 최적점에 대한 정보 대비 비용으로 평가점을 선택한다.
key_assumptions:
- 작은 training dataset에서 full dataset으로의 구조적 extrapolation과 비용 모델이 유용해야 한다.
strengths:
- text: §3.1 Eq.(6)은 k(x,x′)·φ(s)ᵀΣφφ(s′) 형태의 명시적 size basis를 사용한다.
  tags:
  - subset-cardinality
  - model-based-baseline
- text: Size별 loss·계산비용과 full-data 목표를 연결하는 선행 설계다.
  tags:
  - inference-cost
  - experimental-design
limitations:
- text: s는 hyperparameter 평가의 training-data fidelity다. 선택 item의 identity와 cardinality가 같은 binary vector에
    섞이는 SSP 문제와는 다르다.
  tags:
  - nuisance-separation
  source: analyst
