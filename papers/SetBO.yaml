problem: 집합 입력에 대한 kernel 예측과 Bayesian set optimization을 다룬다.
core_idea: RKHS set embedding의 Double Sum과 Deep Embedding kernel을 비교하고 정정치성 조건을 분석한다.
key_assumptions:
- 본문의 모델·관측·입력 가정 안에서 해석하며 SSP의 count-dependent adaptive 정책으로 보장을 자동 이전하지 않는다.
strengths:
- text: Variable-cardinality set BO와 set kernel의 직접 선행이다.
  tags: &id001
  - subset-cardinality
  - uncertainty
limitations:
- text: Count nuisance shrinkage가 composition 추정과 선택을 오염시키는 SSP의 구체적 손실 분석과 같은 정리라고
    볼 수 없다.
  tags: *id001
  source: analyst
