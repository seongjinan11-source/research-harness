areas: [graph-fm, pfn]
problem: "새 그래프마다 GNN을 따로 학습하지 않고, 합성 그래프로 한 번 사전학습한 모델 하나로 임의의 그래프에서 node classification을 in-context로 풀고자 한다."
core_idea: "TabPFN v1식 random-MLP SCM으로 node feature와 label을 만들고, 그 label을 community로 삼아 homophily를 조절하는 cSBM 그래프와 구조 정보가 없는 Erdős–Rényi 그래프를 반씩 섞어 1,024-node 합성 그래프 약 25만 개를 만든다. 모델은 12층 Transformer다. 각 층에서 context node끼리 self-attention하고 query node는 context에만 cross-attention하는 branch와, 전체 그래프 위의 GCN branch를 따로 계산한 뒤 입력과 함께 residual로 더하고 LayerNorm한다. context node는 feature embedding에 label embedding을 더해 넣고 query node는 feature만 넣으며, 출력은 query별 최대 20-class softmax다. feature 차원이 다른 실제 그래프는 zero-padding하거나 truncated SVD로 줄이고, 추론 때는 feature 순서와 scaling을 바꾼 32개 변형을 앙상블한다."
key_assumptions:
  - "그래프 구조는 label을 통해서만 feature와 연결된다고 본다. 합성 prior에서 구조가 SCM label로 정한 community 위에서 생성되기 때문이다."
  - "구조와 label의 관계는 homophily 스칼라 하나와 local GCN smoothing으로 충분히 표현된다고 가정한다."
  - "feature를 고정 차원으로 압축(padding 또는 tSVD)해도 class 정보가 크게 손실되지 않고, class 수는 20개 이하라고 가정한다."
  - "context 노드는 그래프에서 무작위로 뽑힌다고 가정한다. 사전학습의 context/query 분할이 stratification 없는 random partition이다."
strengths:
  - text: "모델 하나로 가중치 업데이트 없이 23개 benchmark를 평가했고, 평균 accuracy와 평균 순위 모두 그래프마다 학습한 GCN·GAT와 GraphAny보다 좋았다. graph PFN이 node classification에서 작동함을 보인 초기 결과다."
    tags: [zero-shot-gap]
  - text: "cSBM의 homophily를 넓게 샘플링해 heterophily 쪽도 prior에 넣었다. 그 결과 heterophilous 그룹 평균에서 GCN보다 6%p 이상 높았다."
    tags: [graph-structure-use, prior-mismatch]
  - text: "attention branch와 GCN branch를 층마다 병렬로 두는 단순한 dual-branch 구조로 그래프 구조를 PFN에 넣었다. MPNN branch를 빼면 Cora와 Wisconsin에서 accuracy가 크게 떨어져, 구조 branch의 기여가 ablation으로 확인된다."
    tags: [graph-structure-use]
  - text: "약 29M parameter 모델을 단일 GPU에서 약 6 GPU-hour로 사전학습할 만큼 가볍고, 추론은 forward pass 한 번이다."
    tags: [inference-cost]
  - text: "tabular FM을 가져오지 않고 처음부터 학습했기 때문에 최대 20-class를 기본 지원한다. GraphPFN 저자들은 대부분의 tabular FM이 10-class까지만 지원한다는 점과 대비해 이 점을 언급했다."
    tags: [label-space]
  - text: "합성 그래프 수를 늘릴수록 성능이 오르는 prior-scale 분석과, ER·cSBM·BA 구성을 바꾼 prior ablation을 함께 제시해 어떤 prior 성분이 도움이 되는지 일부 보여준다."
    tags: [pretraining-data, prior-mismatch]
limitations:
  - text: "최대 class 수와 최대 feature 차원을 사전학습 때 고정해야 한다. 저자들은 20-class까지만 시험했다고 밝힌다."
    tags: [label-space, feature-heterogeneity]
    source: self
  - text: "attention 비용이 quadratic이라 큰 그래프에 적용하기 어렵다고 저자들이 인정하고, efficient attention을 future work로 남겼다."
    tags: [context-scale, graph-scale]
    source: self
  - text: "text-attributed graph의 semantic 정보는 활용하지 않는다. 저자들은 구조 학습과 텍스트 semantic 처리를 결합하는 방향을 future work로 제시한다."
    tags: [task-coverage]
    source: self
  - text: "공식 코드는 training sample을 1,024개 이하로 쓰라고 권장하는데, 표준 split의 benchmark들은 모두 이를 넘는다. 이 조건에서 돌린 NodePFN은 모든 데이터셋에서 GraphPFN에 크게 졌고, GCN·GraphSAGE·GAT·GT보다도 평균 순위가 낮았다. 공식 구현에 fine-tuning 경로가 없어 ICL로만 평가할 수 있었다는 점도 함께 지적됐다."
    tags: [context-scale, zero-shot-gap, adaptation]
    source: cited
    by: "GraphPFN: A Prior-Data Fitted Graph Foundation Model (2026)"
    by_id: GraphPFN
    by_link: https://arxiv.org/abs/2509.21489
  - text: "NodePFN이 약한 이유로 세 가지를 가설로 든다. 첫째, sample 하나를 token 하나로 보는 TabPFN v1 시절 구조를 쓴다. 둘째, 강한 tabular FM에서 초기화하지 않고 처음부터 학습한다. 셋째, GraphPFN보다 prior가 단순하다. 이 이유로 자신들의 공정 비교 평가에서는 NodePFN을 아예 제외했다. 검증된 원인이 아니라 저자들의 추정이라는 점은 감안해야 한다."
