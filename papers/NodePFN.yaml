builds_on: [TabPFN, PFN, cSBM, GCN]
compared_against: [GCN, GAT, MLP, GraphAny, SGC, HGC, LabelPropagation, TabPFN, H2GCN, GPRGNN, FAGCN, Node2Vec, LINE]
open_questions:
  - "context가 수천 개 이상으로 커질 때도 graph PFN의 ICL 이점이 유지되는가? efficient attention과 context 선택 중 어느 쪽이 맞는 해법인지 아직 답이 없다."
  - "label-conditioned SBM과 ER 외에 degree 이질성, 계층적 community, label을 거치지 않는 feature-structure 결합 같은 prior 성분 중 무엇이 실제 그래프로 전이되는가? BA만 쓴 ablation은 데이터셋마다 결과가 들쭉날쭉했다."
  - "padding과 tSVD 없이 feature 차원과 class 수 상한을 없앨 수 있는가? GraphPFN식 per-feature token이 유일한 답인지는 열려 있다."
  - "context 라벨 분포가 사전학습 sampling과 다를 때, 예를 들어 불균형 context에서 graph PFN의 posterior가 얼마나 틀어지는가?"
hooks:
  - "(불균형 context) NodePFN은 사전학습에서 random partition, 즉 instance-balanced sampling으로 context를 뽑지만 평가는 class당 20개라는 class-balanced protocol을 쓴다. 따라서 기존 graph PFN이 사전학습과 평가에서 서로 다른 sampling을 암묵적으로 쓴다는 점을 motivation으로 명시할 수 있다. label skew를 prior 성분으로 넣는 접근은 이 축을 처음으로 명시적인 prior 변수로 만드는 작업으로 위치를 잡으면 된다. 공개 코드가 있으므로 vanilla NodePFN이 불균형 context에서 얼마나 무너지는지 보여주는 직접 baseline으로 쓸 수 있다. 다만 GraphPFN이 NodePFN을 크게 앞선다는 후속 결과가 있으므로, 같은 결론이 GraphPFN backbone에서도 재현되는지가 리뷰어 방어의 핵심이 된다."
  - "(이질 feature 공간, per-graph codebook) NodePFN은 padding과 tSVD에 기대고, 데이터셋마다 SVD 성분 수(15~35개)를 따로 고르며, feature 순서·scaling 32개 앙상블로 순서 민감도를 덮는다. GraphPFN 저자들도 NodePFN을 돌릴 때 SVD 성분 수와 smoothing 단계를 validation으로 튜닝해야 했다. per-graph codebook 입력 인터페이스가 이 데이터셋별 튜닝과 앙상블을 없앤다는 점을 보여주면, graph-specific training이 없다는 PFN의 약속을 실제로 지키는 차별점이 된다. 비교표는 tSVD(NodePFN), per-feature token(GraphPFN), codebook 세 인터페이스를 같은 backbone에서 놓는 형태가 가장 직접적이다."
  - "(그래프 구조를 넣은 MVTS PFN) 변수를 node로 보면, 층마다 입력·attention 출력·GCN 출력을 더하고 LayerNorm하는 NodePFN의 residual fusion이 TimePFN 계열에 관측 그래프를 넣는 가장 단순한 출발점이다. 특히 prior를 ER 50%와 cSBM 50%로 섞는 설계는 주어진 그래프가 쓸모없을 수도 있는 경우를 prior에 넣는 장치다. 시계열 쪽에서도 관측 그래프가 무의미한 경우를 prior에 섞어 두면, 모델이 쓸모없는 그래프를 무시하도록 학습되는지를 MPNN branch ablation과 함께 검증할 수 있다."
notes: "NodePFN이라는 이름의 논문은 Choi et al.의 ICLR 2026 논문 하나만 확인됐다. 합성 graph prior로 사전학습한 node classification용 PFN이므로 이 논문으로 확정했다. 같은 그룹의 TabPFN-GN(그래프를 tabular로 바꿔 TabPFN에 넣는 논문)과는 다른 논문이다. OpenReview forum과 API가 이 세션에서 차단돼 reviewer weakness는 확인하지 못했고, review 항목은 비워 두었다. NodePFN을 인용하는 것으로 보이는 후보 두 편은 arXiv rate limit 때문에 본문을 읽지 못해 제외했다. 하나는 Learning a Prior-Data Fitted Network for Graph Foundation Models via Structural Causal Model Priors(arXiv 2610.38335)이고, 다른 하나는 Message Passing Does More with Less for In-Context Learning on Graphs(arXiv 2609.37057)다. 원 논문에는 homophily 정의가 본문(h = p_in/(p_in+p_out))과 부록(p_out = p_in(1-h))에서 서로 맞지 않는 불일치가 있다. 그래서 prior가 실제로 덮는 homophily 범위는 명목상의 U(0.1, 0.9)와 다를 수 있다. 헤드라인 평균 71.27%는 23개 데이터셋 평균이 아니라 homophilous 그룹과 heterophilous 그룹 평균을 다시 평균한 값이다."
