compared_against: [GIFT-Eval, FoundTS, TFB, Monash, TempusBench, Fidel-TS, fev-bench, TimesFM, Moirai, Moirai-MoE, MOMENT, Time-MoE, Sundial, Chronos, TiRex, Lag-Llama, Timer, TTM]
open_questions:
  - "Chronos-2나 Moirai 같은 실제 대규모 TSFM에서 indirect leakage의 효과 크기는 얼마인가. 전역 cutoff 이후 데이터로 다시 평가하면 기존 leaderboard 순위가 바뀌는가."
  - "저장소를 거치며 이름·스케일·frequency가 바뀐 데이터의 동일성을 자동으로 판정하려면 어떤 fingerprint가 필요한가."
  - "synthetic test 데이터가 실제 응용 성능을 대표할 만큼 현실적일 수 있는가. 저자들이 제안한 방향 중 하나지만 검증되지 않았다."
  - "covariate나 다른 변수를 입력으로 받는 multivariate TSFM에서, 같은 시점의 관련 정보를 정당하게 쓰는 것과 indirect leakage를 어떻게 구분할 것인가."
hooks:
  - "nuisance-context 연구에서 irrelevant stream을 고를 때 이 논문의 indirect leakage 정의를 그대로 적용해야 한다. 대상 series와 같은 기간의 stream을 넣으면 공통 외부 충격을 통해 test 기간 정보가 섞일 수 있다. 그러면 성능 변화가 '무관한 정보를 무시하지 못함'인지 '같은 시기 정보를 활용함'인지 구분되지 않는다. 시간대를 어긋나게 한 stream과 같은 시간대 stream을 분리해 실험하면 리뷰어 질문을 미리 막을 수 있다."
  - "WWW 2027 투고 논문은 Chronos-2와 Moirai를 공개 데이터셋에서 평가하므로 direct leakage 질문을 받을 가능성이 높다. 두 모델 사전학습 데이터의 마지막 시점 이후 구간만으로 작은 test 집합을 만들어 주요 결론이 유지되는지 보이면 이 논문의 두 번째 요건을 충족한다."
  - "synthetic prior만으로 학습하는 시계열 PFN은 실제 데이터를 사전학습에 쓰지 않으므로 direct leakage가 구조적으로 없다. 이 논문의 요건 1(사전학습 데이터 유연성)과 반대 방향에서 같은 문제를 푸는 셈이라, 관측 그래프 시계열 PFN의 장점으로 내세울 수 있다. 다만 prior를 실제 데이터 통계에 맞춰 조정했다면 그 데이터의 기간을 밝혀야 한다."
notes: "arXiv 버전마다 제목이 다르다. v1(2025-10-15)은 'Time Series Foundation Models: Benchmarking Challenges and Requirements', v2는 'Challenges and Requirements for Benchmarking Time Series Foundation Models'(요청에 적힌 제목), v3(2026-02-25)는 위 title이다. citation은 arXiv abs 페이지가 보여주는 최신판(v3)을 따랐다. v2와 v3의 핵심 주장(두 누수 경로, 두 요건, Madrid·COVID 실험)은 같고, 일부 수치(GIFT-Eval Moirai ablation의 horizon별 차이)는 버전마다 다르게 정리되어 있어 본문에 옮기지 않았다. 학회 게재는 확인되지 않았다. 계보 분석 대상 22개 모델의 선정 기준(학회 목록, 검색 방법)에 대한 근거는 논문에 없다."
