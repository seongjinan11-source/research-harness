id: TSFM-BenchReqs
title: "Rethinking Evaluation in the Era of Time Series Foundation Models: (Un)known Information Leakage Challenges"
authors: "Marcel Meyer, Sascha Kaltenpoth, Kevin Zalipski, Oliver Müller"
venue: "arXiv 2025"
year: 2025
links:
