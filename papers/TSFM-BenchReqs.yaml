areas: [benchmark, tsfm]
problem: "TSFM은 거대한 공개 corpus로 사전학습하기 때문에, LLM 평가처럼 test 데이터가 사전학습에 섞이는 정보 누수에 취약하다. 이 논문은 현재 TSFM 벤치마크가 이 누수 때문에 zero-shot 성능을 실제보다 낙관적으로 보고한다고 진단하고, 누수 없는 평가가 갖춰야 할 요건을 제시한다."
core_idea: "누수를 두 경로로 나눈다. 첫째는 direct leakage로, 같은 데이터셋이 어떤 모델에서는 사전학습에, 다른 모델에서는 평가에 쓰여 train과 test 샘플이 겹치는 경우다. 저자들은 주요 학회(TMLR, ICML, NeurIPS, ICLR, WWW와 workshop)에 2026년 1월까지 발표된 TSFM 22개의 데이터 계보를 추적해 401개 데이터셋을 사전학습·train/test·zero-shot 용도로 분류했다. 어떤 사전학습이나 fine-tuning에도 쓰이지 않은 데이터셋은 6%뿐이었다. 이름 변경, 스케일 조정, 부분집합 추출, resampling 때문에 중복이 잘 드러나지 않는다는 사례도 정리했다. 둘째는 indirect leakage로, test series 자체는 학습에 없더라도 같은 기간의 상관된 series가 사전학습에 들어가 test 기간 정보가 새는 경우다. 이를 보이려고 작은 Time-Series Transformer를 처음부터 학습하는 통제 실험을 했다. 다른 주가지수의 COVID 기간 데이터를 학습에 넣은 모델이 처음 보는 S&P 500의 COVID 충격 구간을 10개 seed 중 8개에서 더 잘 예측했다. 이를 바탕으로 두 요건을 제안한다. 하나는 사전학습 데이터는 제한하지 말고, 대신 벤치마크 쪽이 어떤 사전학습 corpus에도 있을 수 없는 새 데이터를 쓰라는 것이다. 다른 하나는 비교하는 모든 모델의 사전학습 데이터 중 가장 늦은 시점 이후의 관측만 test로 쓰는 전역적인 시간 cutoff다."
key_assumptions:
  - "공통 외부 요인(COVID, 날씨 등)을 공유하는 series들은 서로의 test 기간 정보를 담고 있어서, test 값이 없어도 같은 기간 데이터만으로 누수가 생긴다고 본다."
  - "사전학습 데이터를 제한하는 규칙은 강제할 수 없으므로, 누수 차단의 책임은 벤치마크 설계 쪽이 져야 한다고 본다."
  - "각 모델의 사전학습 데이터 마지막 시점을 알 수 있다고 가정한다. 전역 cutoff 요건은 이 정보가 정확히 공개되어야 성립한다."
  - "논문과 코드에 문서화된 데이터 목록이 실제 사전학습 데이터를 반영한다고 보고 계보 분석을 했다."
strengths:
  - text: "TSFM 22개와 데이터셋 401개의 용도를 체계적으로 추적해 데이터 재사용 지도를 처음으로 수치화했다. 모든 모델에 공통으로 깨끗한 평가 데이터셋이 없고, 어디에도 학습용으로 쓰이지 않은 데이터셋이 6%뿐이라는 결과는 기존 zero-shot 비교의 전제를 직접 흔든다."
    tags: [eval-protocol, pretraining-data]
  - text: "샘플 중복과 다른 두 번째 누수 경로, 즉 같은 기간의 상관된 series로 인한 indirect leakage를 명시적으로 정의했다. 통제 실험에서 누수 신호는 학습 관측 약 20만 5천 개 중 약 1,600개에 불과했는데도 충격 구간의 MAE가 평균 약 217에서 190으로 줄었다. 이 이점은 충격 구간이 지나자 사라져서, 효과가 test 기간 정보 때문이라는 해석을 뒷받침한다."
    tags: [eval-protocol, nonstationarity]
  - text: "중복이 숨는 구체적 사례를 모았다. Electricity가 Autoformer, Monash, Informer에서 서로 다른 이름으로 쓰이는 경우, Australian Electricity Demand를 1/1000로 줄인 부분집합, 같은 출처를 표기하지만 각각 Lyft와 Uber 데이터인 car ride 데이터셋, 여러 저장소를 거치며 변형된 Solar Alabama 데이터가 그 예다. 벤치마크를 만들 때 바로 쓸 수 있는 점검 목록이 된다."
    tags: [pretraining-data]
  - text: "누수가 점수를 얼마나 부풀리는지에 대한 기존 증거를 한곳에 모았다. GIFT-Eval의 Moirai 누수 ablation, 평가 데이터셋 세 개가 TimesFM·UniTS·TTM 사전학습에 들어가 MSE가 47~184% 낮아진 FoundTS 사례, 사전학습에 포함된 스페인 에너지 데이터에서 Chronos가 TiDE보다 훨씬 좋았던 사례가 포함된다."
    tags: [eval-protocol]
  - text: "요건이 구체적이고 실행 가능하다. 사전학습 데이터를 규제하지 않으면서, 비교 대상 모델들의 학습 시점에 맞춰 test 구간을 정하는 model-aware 전역 cutoff를 제안했다. 미리 정한 고정 날짜가 아니라 비교하는 모델 집합에 따라 cutoff가 정해진다."
    tags: [eval-protocol]
limitations:
  - text: "test set 오염의 효과 크기는 몇몇 고립된 사례에서만 유의하게 확인됐다고 저자들이 인정했다. 실제 TSFM 환경에서 temporal leakage가 얼마나 큰지는 대부분 알려져 있지 않고, 도메인과 사건 유형에 따라 다를 것이라고 했다. 부록에서 제시한 Monash 데이터의 시간 중복 사례도 이론적 가능성일 뿐 효과를 측정하지는 않았다."
    tags: [eval-protocol]
    source: self
  - text: "COVID 통제 실험은 기존 TSFM이 아니라 처음부터 학습한 작은 Transformer로 했다고 저자들이 밝혔다. Madrid 교통 사례(MAE 약 43% 개선)는 누수에 거의 이상적인 조건이었다고도 인정했다. 대규모 TSFM이 더 취약할 것이라는 주장은 실험하지 않은 추론이다."
    tags: [eval-protocol, robustness]
    source: self
  # cited: QuitoBench(2026), IMPERMANENT(2026), TS-Arena(같은 저자, 2025)가 이 논문을 인용하지만 모두 누수 문제의 근거로 지지적으로 인용했고 한계를 지적한 문장은 찾지 못해 미기재.
  # review: 학회 게재나 OpenReview 기록을 확인하지 못해 미기재.
  - text: "[analyst] 이 논문은 요건을 제시하지만 요건을 만족하는 평가에서 기존 모델 순위가 실제로 바뀐다는 것은 보이지 않았다. 누수가 개별 사례에서 점수를 부풀린다는 것과 leaderboard 결론이 틀렸다는 것은 다른 주장이다. 같은 저자들의 후속 TS-Arena가 실시간 사전 등록 방식으로 이 간극을 메우려 한다."
    tags: [eval-protocol]
    source: analyst
  - text: "[analyst] 전역 cutoff 요건은 실무 비용이 크다. 가장 최근에 학습한 모델이 cutoff를 정하므로 새 모델이 추가될 때마다 test 구간이 뒤로 밀리고 짧아진다. 짧은 최근 구간은 특정 regime 하나에 치우치기 쉬워 nonstationarity가 평가를 흔든다. 또 각 모델의 학습 데이터 마지막 시점이 정확히 공개되어야 하는데, 논문이 직접 든 Sundial 사례처럼 제외한 데이터 목록조차 공개되지 않는 경우가 있다."
    tags: [eval-protocol, nonstationarity]
    source: analyst
