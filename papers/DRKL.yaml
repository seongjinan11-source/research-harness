problem: GNN-to-MLP 증류에서 reverse KL의 fitting·regularization 항이 고정 비중으로 결합되는 문제를 다룬다.
core_idea: '[출판사 초록·공개 발췌 확인; 전체 본문 미확인] Reverse KL의 항을 분리하고 각 항의 비중을 독립적으로 조절한다. Output logits를 증류하는 기존 GKD framework에
  loss로 적용한다.'
key_assumptions:
- Teacher·student의 출력 분포와 가중치 선택 절차가 필요하다.
strengths:
- text: Fitting과 regularization 항의 비중을 분리해 prediction 설정에 맞게 조절한다.
  tags:
  - graph-distillation
  - adaptation
- text: 추가 모델 branch 없이 기존 output-logit 증류 loss를 교체하는 방식이다.
  tags:
  - inference-cost
  - graph-distillation
limitations:
- text: '[analyst] Logit loss의 개선을 teacher의 hidden geometry 보존이나 최적 hyperparameter의 데이터셋 간 transfer 보장으로 확대하지 않는다.'
